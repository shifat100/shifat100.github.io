<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Md Al Shahreya Shifat - Journey of a Legend</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --bg: #060911;
      --accent: #00ff88;
      --accent-blue: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000;
      color: var(--text);
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: fixed;
      transition: opacity 0.6s ease;
    }

    #cinematic-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 20;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Skip Intro Button */
    #skip-intro-btn {
      position: fixed;
      top: 20px;
      right: 22px;
      z-index: 120;
      background: rgba(14, 21, 37, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: var(--accent-blue);
      padding: 8px 16px;
      border-radius: 20px;
      font-family: 'Space Grotesk', monospace;
      font-size: 0.76rem;
      letter-spacing: 1.5px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #skip-intro-btn:hover {
      background: rgba(0, 255, 136, 0.15);
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
    }

    .icon {
      display: inline-block;
      width: 14px;
      height: 14px;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      vertical-align: middle;
      flex-shrink: 0;
    }

    /* Scene 1: Welcome Overlay */
    #welcome-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 30;
      pointer-events: none;
      padding: 0 15px;
    }
    .letter-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(0.4rem, 2.5vw, 1.8rem);
      width: 100%;
      max-width: 95vw;
    }
    .letter {
      display: inline-block;
      font-size: clamp(2rem, 9vw, 4.2rem);
      font-weight: 300;
      letter-spacing: clamp(2px, 1.2vw, 6px);
      color: #f8fafc;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 0 0 40px rgba(56, 189, 248, 0.5);
      transition: transform 1.2s cubic-bezier(0.7, 0, 0.2, 1), opacity 1.2s ease, filter 1.2s ease;
      will-change: transform, opacity, filter;
    }

    /* Flash Overlay */
    #flash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 40;
      transition: opacity 0.2s ease-out;
    }

    /* Left-Top Text HUD */
    #hud-text {
      position: absolute;
      top: clamp(20px, 4vh, 40px);
      left: clamp(20px, 5vw, 45px);
      z-index: 25;
      font-size: clamp(1.4rem, 5vw, 2.3rem);
      font-weight: 700;
      letter-spacing: 3px;
      color: #ffffff;
      text-shadow: 0 0 18px rgba(56, 189, 248, 0.75);
      opacity: 0;
      transition: opacity 1s ease, color 1s ease;
    }
    #hud-subtext {
      font-size: 0.85rem;
      letter-spacing: 2px;
      color: #38bdf8;
      margin-top: 4px;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    /* Scene 2 Finale: Pure White Screen & Centered Text */
    #whiteout-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      transition: opacity 1.5s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .legend-wrapper {
      position: relative;
      display: inline-block;
      overflow: visible;
      padding: 15px 30px;
    }
    #legend-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: clamp(2.2rem, 7.5vw, 4.5rem);
      font-weight: 300;
      letter-spacing: clamp(6px, 1.8vw, 18px);
      text-transform: uppercase;
      color: #0f172a;
      opacity: 0;
      margin: 0;
      line-height: 1.2;
      transition: opacity 2.0s ease;
      position: relative;
      z-index: 2;
    }

    #eraser-tool {
      position: absolute;
      top: 50%;
      left: -80px;
      width: 48px;
      height: 78px;
      background: linear-gradient(135deg, #f43f5e 45%, #f1f5f9 46%);
      border-radius: 6px;
      border: 1px solid rgba(0,0,0,0.15);
      box-shadow: 0 12px 28px rgba(0,0,0,0.35);
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transform-origin: center center;
    }
  </style>
</head>
<body>

  <!-- SKIP INTRO BUTTON -->
  <button id="skip-intro-btn" onclick="transitionToResume()">
    <span>SKIP INTRO</span>
    <svg class="icon" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
  </button>

  <!-- 3D CINEMATIC INTRO -->
  <div id="cinematic-container">
    <div id="welcome-screen">
      <div class="letter-container" id="letterContainer">
        <span class="letter">W</span>
        <span class="letter">E</span>
        <span class="letter">L</span>
        <span class="letter">C</span>
        <span class="letter">O</span>
        <span class="letter">M</span>
        <span class="letter">E</span>
      </div>
    </div>

    <div id="flash-overlay"></div>
    <div id="hud-text">
      <div id="hud-title"></div>
      <div id="hud-subtext"></div>
    </div>

    <div id="whiteout-screen">
      <div class="legend-wrapper" id="legendWrapper">
        <h1 id="legend-text">A Legend Born</h1>
        <div id="eraser-tool"></div>
      </div>
    </div>

    <div id="canvas-container"></div>
  </div>

  <script>
    // --- REDIRECT LOGIC ---
    let isTransitioning = false;
    function transitionToResume() {
      if (isTransitioning) return;
      isTransitioning = true;

      // Smooth fade out of the screen
      document.body.style.opacity = '0';
      setTimeout(() => {
        window.location.href = 'resume.html';
      }, 500);
    }

    // --- PROCEDURAL TEXTURES ---
    function createGlowPointTexture() {
      const c = document.createElement('canvas');
      c.width = 64; c.height = 64;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.25, 'rgba(255,255,255,0.85)');
      grad.addColorStop(0.5, 'rgba(255,255,255,0.25)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }
    const particleTex = createGlowPointTexture();

    function createMagmaTexture() {
      const c = document.createElement('canvas');
      c.width = 1024; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#0a0201';
      ctx.fillRect(0, 0, c.width, c.height);
      for (let i = 0; i < 900; i++) {
        const x = Math.random() * c.width, y = Math.random() * c.height;
        const r = Math.random() * 55 + 8;
        const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
        grad.addColorStop(0, '#ffcc00');
        grad.addColorStop(0.25, '#ff3700');
        grad.addColorStop(0.65, '#3b0600');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      return new THREE.CanvasTexture(c);
    }

    function createCooledEarthTexture() {
      const c = document.createElement('canvas');
      c.width = 2048; c.height = 1024;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#082348';
      ctx.fillRect(0, 0, c.width, c.height);

      ctx.fillStyle = '#0d426e';
      for (let i = 0; i < 90; i++) {
        let x = Math.random() * c.width, y = 140 + Math.random() * (c.height - 280);
        ctx.beginPath();
        ctx.arc(x, y, 45 + Math.random() * 75, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = '#f0f9ff';
      ctx.fillRect(0, 0, c.width, 130);
      ctx.fillRect(0, c.height - 130, c.width, 130);

      ctx.fillStyle = '#e0f2fe';
      for (let i = 0; i < c.width; i += 30) {
        ctx.beginPath();
        ctx.arc(i, 130 + Math.random() * 20, 25, 0, Math.PI * 2);
        ctx.arc(i, c.height - 130 - Math.random() * 20, 25, 0, Math.PI * 2);
        ctx.fill();
      }

      drawRealisticLandmass(ctx, 320, 480, 18, 120);
      drawRealisticLandmass(ctx, 280, 310, 14, 90);
      drawRealisticLandmass(ctx, 750, 340, 24, 150);
      drawRealisticLandmass(ctx, 680, 480, 10, 70);
      drawRealisticLandmass(ctx, 890, 680, 12, 85);
      drawRealisticLandmass(ctx, 1200, 320, 14, 100);
      drawRealisticLandmass(ctx, 1150, 560, 8, 55);
      drawRealisticLandmass(ctx, 1580, 340, 20, 130);
      drawRealisticLandmass(ctx, 1720, 640, 18, 110);

      return new THREE.CanvasTexture(c);
    }

    function drawRealisticLandmass(ctx, centerX, centerY, blobCount, spread) {
      for (let i = 0; i < blobCount; i++) {
        let cx = centerX + (Math.random() - 0.5) * spread * 2;
        let cy = centerY + (Math.random() - 0.5) * spread * 1.5;
        let r = 25 + Math.random() * 65;

        ctx.fillStyle = '#1e7845';
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();

        if (Math.random() > 0.35) {
          ctx.fillStyle = '#7a642e';
          ctx.beginPath();
          ctx.arc(cx + (Math.random() - 0.5) * 35, cy + (Math.random() - 0.5) * 25, r * 0.55, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function createCloudTexture() {
      const c = document.createElement('canvas');
      c.width = 1024; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, c.width, c.height);
      for (let i = 0; i < 160; i++) {
        const x = Math.random() * c.width, y = Math.random() * c.height;
        const r = 25 + Math.random() * 65;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, 'rgba(255, 255, 255, 0.75)');
        g.addColorStop(0.5, 'rgba(255, 255, 255, 0.2)');
        g.addColorStop(1, 'transparent');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      return new THREE.CanvasTexture(c);
    }

    // --- TERMINAL DISPLAY TEXTURE ---
    const hackerCanvas = document.createElement('canvas');
    hackerCanvas.width = 1280;
    hackerCanvas.height = 720;
    const hCtx = hackerCanvas.getContext('2d');
    const hackerTex = new THREE.CanvasTexture(hackerCanvas);

    const cols = 56;
    const ypos = Array(cols).fill(0);
    const chars = "01アイウエオカキクケコサシスセソ0123456789ABCDEF<>{}/*$#@";

    function updateHackerScreen(elapsed) {
      hCtx.fillStyle = 'rgba(3, 10, 16, 0.22)';
      hCtx.fillRect(0, 0, hackerCanvas.width, hackerCanvas.height);

      hCtx.font = '16px monospace';
      for (let i = 0; i < cols; i++) {
        const char = chars.charAt(Math.floor(Math.random() * chars.length));
        const x = i * 23;
        const y = ypos[i] * 20;

        if (Math.random() > 0.85) hCtx.fillStyle = '#ffffff';
        else hCtx.fillStyle = '#00ffcc';
        hCtx.fillText(char, x, y);

        if (y > hackerCanvas.height && Math.random() > 0.975) ypos[i] = 0;
        else ypos[i]++;
      }

      const cx = hackerCanvas.width / 2;
      const cy = hackerCanvas.height / 2;

      hCtx.fillStyle = 'rgba(4, 15, 22, 0.94)';
      hCtx.fillRect(cx - 480, cy - 200, 960, 400);

      hCtx.strokeStyle = '#00ff88';
      hCtx.lineWidth = 3;
      hCtx.strokeRect(cx - 480, cy - 200, 960, 400);

      hCtx.fillStyle = '#38bdf8';
      hCtx.font = '14px monospace';
      hCtx.fillText("[SYS_ID: 06082004] // SECURE TERMINAL", cx - 450, cy - 165);
      hCtx.fillText("STATUS: OVERRIDE COMPLETE", cx + 220, cy - 165);

      hCtx.textAlign = 'center';
      hCtx.fillStyle = '#38bdf8';
      hCtx.font = 'bold 36px "Segoe UI", monospace';
      hCtx.fillText("INTRODUCING", cx, cy - 65);

      hCtx.fillStyle = '#00ff88';
      hCtx.font = '900 68px "Segoe UI", sans-serif';
      hCtx.shadowColor = '#00ff88';
      hCtx.shadowBlur = 24;
      hCtx.fillText("MD AL SHAHREYA SHIFAT", cx, cy + 30);
      hCtx.shadowBlur = 0;

      const cursor = Math.floor(elapsed * 3) % 2 === 0 ? "█" : "";
      hCtx.fillStyle = '#f59e0b';
      hCtx.font = 'bold 22px monospace';
      hCtx.fillText(`> ORIGIN: MYMENSINGH // NETROKONA ${cursor}`, cx, cy + 115);

      hCtx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      hCtx.font = '16px monospace';
      hCtx.fillText("PREPARING ENVIRONMENT... INITIALIZING CORE INTERFACE", cx, cy + 155);

      hCtx.textAlign = 'left';
      hackerTex.needsUpdate = true;
    }

    // --- THREE.JS SCENE SETUP ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 14000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const camPosTarget = new THREE.Vector3(0, 20, 160);
    const camLookTarget = new THREE.Vector3(0, 0, 0);
    const camCurrentLook = new THREE.Vector3(0, 0, 0);
    camera.position.set(0, 20, 160);

    // Cosmic Stars
    const starGeom = new THREE.BufferGeometry();
    const starPos = [];
    for (let i = 0; i < 5000; i++) {
      starPos.push((Math.random() - 0.5) * 5000, (Math.random() - 0.5) * 5000, (Math.random() - 0.5) * 5000);
    }
    starGeom.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({
      map: particleTex,
      color: 0xffffff,
      size: 2.2,
      transparent: true,
      opacity: 0.85,
      depthWrite: false
    });
    scene.add(new THREE.Points(starGeom, starMat));

    // Big Bang
    const BANG_COUNT = 16000;
    const bangGeom = new THREE.BufferGeometry();
    const bangPositions = new Float32Array(BANG_COUNT * 3);
    const bangVelocities = new Float32Array(BANG_COUNT * 3);
    const bangColors = new Float32Array(BANG_COUNT * 3);

    for (let i = 0; i < BANG_COUNT; i++) {
      bangPositions[i * 3] = 0;
      bangPositions[i * 3 + 1] = 0;
      bangPositions[i * 3 + 2] = 0;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(Math.random() * 2 - 1);
      const spd = Math.random() * 90 + 25;
      bangVelocities[i * 3] = spd * Math.sin(phi) * Math.cos(theta);
      bangVelocities[i * 3 + 1] = spd * Math.sin(phi) * Math.sin(theta);
      bangVelocities[i * 3 + 2] = spd * Math.cos(phi);

      const c = new THREE.Color().setHSL(Math.random() * 0.16 + 0.02, 1, 0.7);
      bangColors[i * 3] = c.r;
      bangColors[i * 3 + 1] = c.g;
      bangColors[i * 3 + 2] = c.b;
    }
    bangGeom.setAttribute('position', new THREE.BufferAttribute(bangPositions, 3));
    bangGeom.setAttribute('color', new THREE.BufferAttribute(bangColors, 3));
    const bangMat = new THREE.PointsMaterial({
      map: particleTex,
      size: 3.5,
      vertexColors: true,
      blending: THREE.AdditiveBlending,
      transparent: true,
      opacity: 0,
      depthWrite: false
    });
    const bangPoints = new THREE.Points(bangGeom, bangMat);
    scene.add(bangPoints);

    // Sun Accretion Vortex
    const ACCRETE_COUNT = 6000;
    const accreteGeom = new THREE.BufferGeometry();
    const accretePos = new Float32Array(ACCRETE_COUNT * 3);
    const accreteStartPos = new Float32Array(ACCRETE_COUNT * 3);

    for (let i = 0; i < ACCRETE_COUNT; i++) {
      const radius = 70 + Math.random() * 100;
      const angle = Math.random() * Math.PI * 2;
      const y = (Math.random() - 0.5) * 45;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;
      accretePos[i * 3] = x;
      accretePos[i * 3 + 1] = y;
      accretePos[i * 3 + 2] = z;
      accreteStartPos[i * 3] = x;
      accreteStartPos[i * 3 + 1] = y;
      accreteStartPos[i * 3 + 2] = z;
    }
    accreteGeom.setAttribute('position', new THREE.BufferAttribute(accretePos, 3));
    const accreteMat = new THREE.PointsMaterial({
      map: particleTex,
      color: 0xffaa00,
      size: 3.2,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const accretePoints = new THREE.Points(accreteGeom, accreteMat);
    scene.add(accretePoints);

    // Sun
    const sunGeom = new THREE.SphereGeometry(15, 48, 48);
    const sunMat = new THREE.MeshBasicMaterial({ color: 0xff8c00 });
    const sunMesh = new THREE.Mesh(sunGeom, sunMat);
    sunMesh.scale.setScalar(0.0001);
    scene.add(sunMesh);

    const sunGlowGeom = new THREE.SphereGeometry(22, 32, 32);
    const sunGlowMat = new THREE.MeshBasicMaterial({
      color: 0xff4800,
      side: THREE.BackSide,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending
    });
    const sunGlow = new THREE.Mesh(sunGlowGeom, sunGlowMat);
    sunMesh.add(sunGlow);

    const sunLight = new THREE.PointLight(0xffeedd, 0, 2500, 0.4);
    scene.add(sunLight);
    scene.add(new THREE.AmbientLight(0x334155, 0.8));

    // Other 6 Planets
    const planetSpecs = [
      { r: 1.4, dist: 28, speed: 0.024, color: 0x9ca3af },
      { r: 2.2, dist: 42, speed: 0.018, color: 0xd97706 },
      { r: 1.8, dist: 84, speed: 0.012, color: 0xd946ef },
      { r: 5.5, dist: 115, speed: 0.008, color: 0xf59e0b },
      { r: 4.5, dist: 150, speed: 0.006, color: 0xfde047, ring: true },
      { r: 3.2, dist: 180, speed: 0.004, color: 0x38bdf8 }
    ];

    const planetMeshes = [];
    planetSpecs.forEach(spec => {
      const pPivot = new THREE.Group();
      scene.add(pPivot);

      const pMesh = new THREE.Mesh(
        new THREE.SphereGeometry(spec.r, 24, 24),
        new THREE.MeshStandardMaterial({ color: spec.color, roughness: 0.7 })
      );
      pMesh.position.set(spec.dist, 0, 0);
      pMesh.scale.setScalar(0.0001);
      pPivot.add(pMesh);

      if (spec.ring) {
        const ringGeom = new THREE.RingGeometry(spec.r * 1.4, spec.r * 2.3, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xc8a46e, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
        const ringMesh = new THREE.Mesh(ringGeom, ringMat);
        ringMesh.rotation.x = Math.PI / 2.3;
        pMesh.add(ringMesh);
      }
      planetMeshes.push({ pivot: pPivot, mesh: pMesh, speed: spec.speed });
    });

    // Earth & Moon
    const earthDist = 62;
    const earthRadius = 5.0;
    const earthPivot = new THREE.Group();
    scene.add(earthPivot);

    const earthGroup = new THREE.Group();
    earthGroup.position.set(earthDist, 0, 0);
    earthGroup.rotation.z = 18 * (Math.PI / 180);
    earthPivot.add(earthGroup);

    const magmaTex = createMagmaTexture();
    const moltenMat = new THREE.MeshStandardMaterial({
      map: magmaTex,
      emissive: new THREE.Color(0xff4400),
      emissiveMap: magmaTex,
      emissiveIntensity: 1.6,
      roughness: 0.7
    });
    const moltenEarthMesh = new THREE.Mesh(new THREE.SphereGeometry(earthRadius, 64, 64), moltenMat);
    moltenEarthMesh.scale.setScalar(0.0001);
    earthGroup.add(moltenEarthMesh);

    const modernMat = new THREE.MeshStandardMaterial({
      map: createCooledEarthTexture(),
      roughness: 0.45,
      metalness: 0.08,
      transparent: true,
      opacity: 0
    });
    const modernEarthMesh = new THREE.Mesh(new THREE.SphereGeometry(earthRadius, 64, 64), modernMat);
    earthGroup.add(modernEarthMesh);

    const cloudMat = new THREE.MeshStandardMaterial({
      map: createCloudTexture(),
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending
    });
    const cloudMesh = new THREE.Mesh(new THREE.SphereGeometry(earthRadius + 0.12, 48, 48), cloudMat);
    earthGroup.add(cloudMesh);

    const atmosMat = new THREE.MeshBasicMaterial({
      color: 0xff3b00,
      side: THREE.BackSide,
      transparent: true,
      opacity: 0,

    function getResponsiveEarthCamOffset() {
      const aspect = camera.aspect;
      const vFovRad = (camera.fov * Math.PI) / 180;
      const targetCoverage = 0.62;
      let dist;
      if (aspect < 1.0) {
        dist = earthRadius / (Math.tan(vFovRad / 2) * aspect * targetCoverage);
      } else {
        dist = earthRadius / (Math.tan(vFovRad / 2) * targetCoverage);
      }
      return new THREE.Vector3(0.32, 0.36, 0.88).normalize().multiplyScalar(dist);
    }

    // Letters Collision Trigger

    let lettersCollided = false;

    function triggerLetterCollision() {
      if (lettersCollided) return;
      lettersCollided = true;
      const containerRect = container.getBoundingClientRect();
      const centerX = containerRect.left + containerRect.width / 2;
      const centerY = containerRect.top + containerRect.height / 2;

      letters.forEach(letter => {
        const rect = letter.getBoundingClientRect();
        const letterX = rect.left + rect.width / 2;
        const letterY = rect.top + rect.height / 2;
        letter.style.transform = `translate(${centerX - letterX}px, ${centerY - letterY}px) scale(0.01) rotate(${(Math.random() - 0.5) * 720}deg)`;
        letter.style.opacity = '0';

    // --- ANIMATION LOOP ---

        camera.position.lerp(camPosTarget, 0.03);
        camCurrentLook.lerp(camLookTarget, 0.03);
        camera.lookAt(camCurrentLook);
      }
      // Act 3: Big Bang
      else if (elapsed >= 5.5 && elapsed < 9.0) {
        earthGroup.rotation.y += 0.009;
        welcomeScreen.style.display = 'none';
        const t = elapsed - 5.5;

        if (t < 0.25) flashOverlay.style.opacity = '1';
        else flashOverlay.style.opacity = Math.max(0, 1 - (t - 0.25) * 1.5);

        bangMat.opacity = Math.min(1, 0.95 * (1 - (t / 3.5)));
        const bPos = bangPoints.geometry.attributes.position.array;
        for (let i = 0; i < BANG_COUNT; i++) {
          bPos[i * 3] += bangVelocities[i * 3] * 0.03;
          bPos[i * 3 + 1] += bangVelocities[i * 3 + 1] * 0.03;
          bPos[i * 3 + 2] += bangVelocities[i * 3 + 2] * 0.03;
        }
        bangPoints.geometry.attributes.position.needsUpdate = true;

        camPosTarget.set(0, 50, 210);
        camera.position.lerp(camPosTarget, 0.03);
        camCurrentLook.lerp(camLookTarget, 0.03);
        camera.lookAt(camCurrentLook);
      }
      // Act 4: Sun Accretion
      else if (elapsed >= 9.0 && elapsed < 15.0) {
        earthGroup.rotation.y += 0.009;
        bangMat.opacity = 0;
        const t = (elapsed - 9.0) / 6.0;

        accreteMat.opacity = Math.sin(t * Math.PI) * 0.95;
        const aPos = accretePoints.geometry.attributes.position.array;
        for (let i = 0; i < ACCRETE_COUNT; i++) {
          const factor = 1 - t;
          aPos[i * 3] = accreteStartPos[i * 3] * factor + (Math.random() - 0.5) * 3;
          aPos[i * 3 + 1] = accreteStartPos[i * 3 + 1] * factor + (Math.random() - 0.5) * 3;
          aPos[i * 3 + 2] = accreteStartPos[i * 3 + 2] * factor + (Math.random() - 0.5) * 3;
        }
        accretePoints.geometry.attributes.position.needsUpdate = true;
        accretePoints.rotation.y += 0.025;

        if (t > 0.35) {
          const sunP = (t - 0.35) / 0.65;
          sunMesh.scale.setScalar(sunP);
          sunGlowMat.opacity = sunP * 0.45;
          sunLight.intensity = sunP * 2.4;
        }

        camPosTarget.set(Math.cos(t * 2) * 85, 35, Math.sin(t * 2) * 85);
        camLookTarget.set(0, 0, 0);
        camera.position.lerp(camPosTarget, 0.03);
        camCurrentLook.lerp(camLookTarget, 0.03);
        camera.lookAt(camCurrentLook);
      }
      // Act 5: Planets Form
      else if (elapsed >= 15.0 && elapsed < 21.0) {
        earthGroup.rotation.y += 0.009;
        accreteMat.opacity = 0;
        const t = (elapsed - 15.0) / 6.0;

        planetMeshes.forEach((p, idx) => {
          const delay = idx * 0.12;
          if (t > delay) p.mesh.scale.setScalar(Math.min(1, (t - delay) * 3.5));
        });

        if (t > 0.65) {
          const eScale = Math.min(1, (t - 0.65) * 4);
          moltenEarthMesh.scale.setScalar(eScale);
          atmosMat.opacity = eScale * 0.5;
        }

        if (t > 0.85) moonMesh.scale.setScalar(Math.min(1, (t - 0.85) * 4));

        camPosTarget.set(135, 75, 175);
        camLookTarget.set(20, 0, 0);
        camera.position.lerp(camPosTarget, 0.03);
        camCurrentLook.lerp(camLookTarget, 0.03);
        camera.lookAt(camCurrentLook);
      }
      // Act 6: Galaxy Orbit
      else if (elapsed >= 21.0 && elapsed < 28.5) {
        earthGroup.rotation.y += 0.009;
        const t = (elapsed - 21.0) / 7.5;
        galaxyMat.opacity = Math.min(0.95, t * 1.6);
        galaxyGroup.rotation.y += 0.007;

        const orbitAngle = t * 0.45;
        camPosTarget.set(Math.sin(orbitAngle) * 750, 520, Math.cos(orbitAngle) * 750);
        camLookTarget.set(0, 0, 0);

        camera.position.lerp(camPosTarget, 0.035);
        camCurrentLook.lerp(camLookTarget, 0.035);
        camera.lookAt(camCurrentLook);
      }
      // Act 7: Cooled Earth & Counter
      else if (elapsed >= 28.5 && elapsed < 42.0) {
        earthGroup.rotation.y += 0.013;
        galaxyMat.opacity = Math.max(0, galaxyMat.opacity - 0.03);

        const earthWorldPos = new THREE.Vector3();
        earthGroup.getWorldPosition(earthWorldPos);

        const camOrbitOffset = getResponsiveEarthCamOffset();
        const desiredCamPos = earthWorldPos.clone().add(camOrbitOffset);

        camera.position.lerp(desiredCamPos, 0.06);
        camCurrentLook.lerp(earthWorldPos, 0.08);
        camera.lookAt(camCurrentLook);

        hudText.style.opacity = '1';

        const t = (elapsed - 28.5) / 13.5;

        moltenMat.emissiveIntensity = Math.max(0, 1.6 * (1 - t * 1.35));
        modernMat.opacity = Math.min(1, t * 1.35);

        if (t > 0.28) cloudMat.opacity = Math.min(0.85, (t - 0.28) * 1.4);
        atmosMat.color.lerpColors(new THREE.Color(0xff3b00), new THREE.Color(0x38bdf8), t);
        atmosMat.opacity = THREE.MathUtils.lerp(0.5, 0.32, t);

        if (t < 0.65) {
          const sub = t / 0.65;
          const yr = Math.round(THREE.MathUtils.lerp(-4500000000, -100000, Math.pow(sub, 2.5)));
          hudTitle.innerText = yr.toLocaleString();
        } else if (t < 0.92) {
          const sub = (t - 0.65) / 0.27;
          const yr = Math.round(THREE.MathUtils.lerp(-100000, 2000, Math.pow(sub, 2)));
          hudTitle.innerText = yr.toString();
        } else {
          const sub = (t - 0.92) / 0.08;
          const yr = Math.round(THREE.MathUtils.lerp(2000, 2004, sub));
          if (t < 0.985) hudTitle.innerText = yr.toString();
          else hudTitle.innerText = "06-08-2004";
        }
      }
      // Act 8: 06-08-2004 + Meteor Breaches
      else if (elapsed >= 42.0 && elapsed < 46.5) {
        earthGroup.rotation.y += 0.009;
        hudTitle.innerText = "06-08-2004";
        hudText.style.opacity = '1';

        moltenMat.emissiveIntensity = 0;
        modernMat.opacity = 1;
        cloudMat.opacity = 0.85;
        atmosMat.color.setHex(0x38bdf8);

        const earthWorldPos = new THREE.Vector3();
        earthGroup.getWorldPosition(earthWorldPos);

        const camOrbitOffset = getResponsiveEarthCamOffset();
        camera.position.copy(earthWorldPos.clone().add(camOrbitOffset));
        camera.lookAt(earthWorldPos);

        const meteorT = (elapsed - 42.0) / 4.5;
        const startMeteorPos = earthWorldPos.clone().add(new THREE.Vector3(45, 30, 60));
        const impactPoint = earthWorldPos.clone().add(new THREE.Vector3(2.2, 1.0, 4.4));

        const curMeteorPos = new THREE.Vector3().lerpVectors(startMeteorPos, impactPoint, Math.pow(meteorT, 2.2));
        meteorGroup.position.copy(curMeteorPos);

        tailHistory.unshift(curMeteorPos.clone());
        if (tailHistory.length > TAIL_COUNT) tailHistory.pop();
        const tPos = meteorTail.geometry.attributes.position.array;
        for (let i = 0; i < tailHistory.length; i++) {
          tPos[i * 3] = tailHistory[i].x - curMeteorPos.x;
          tPos[i * 3 + 1] = tailHistory[i].y - curMeteorPos.y;
          tPos[i * 3 + 2] = tailHistory[i].z - curMeteorPos.z;
        }
        meteorTail.geometry.attributes.position.needsUpdate = true;
      }
      // Act 9: Bangladesh Map Intro
      else if (elapsed >= 46.5 && elapsed < 51.5) {
        sunMesh.visible = false;
        planetMeshes.forEach(p => p.pivot.visible = false);
        earthPivot.visible = false;

        bdSceneGroup.visible = true;
        bdSceneGroup.position.set(0, 0, 0);

        const t = (elapsed - 46.5) / 5.0;

        hudTitle.innerText = "Bangladesh";
        hudTitle.style.color = "#34d399";
        hudTitle.style.textShadow = "0 0 20px rgba(52, 211, 153, 0.8)";
        hudSubtext.innerText = "MYMENSINGH - NETROKONA";
        hudSubtext.style.opacity = Math.min(1, t * 2);
        hudText.style.opacity = Math.min(1, t * 2);

        bdPlaneMat.opacity = Math.min(1.0, t * 1.5);
        gridHelper.material.opacity = Math.min(0.25, t * 0.25);
        ringMat.opacity = Math.min(0.9, t * 0.9);

        targetRing.scale.setScalar(1 + Math.sin(elapsed * 5) * 0.1);

        const camY = THREE.MathUtils.lerp(130, 75, Math.pow(t, 0.8));
        const camZ = THREE.MathUtils.lerp(65, 45, Math.pow(t, 0.8));
        camPosTarget.set(0, camY, camZ);
        camLookTarget.set(0, 0, -5);

        camera.position.lerp(camPosTarget, 0.04);
        camCurrentLook.lerp(camLookTarget, 0.04);
        camera.lookAt(camCurrentLook);

        meteorGroup.position.set(0, 9999, 0);
      }
      // Act 10: Impact Approach
      else if (elapsed >= 51.5 && elapsed < 56.5) {
        const t = (elapsed - 51.5) / 5.0;

        camPosTarget.set(1.2, 65, 30);
        camLookTarget.set(impactTargetPos.x, 0, impactTargetPos.z);
        camera.position.lerp(camPosTarget, 0.03);
        camCurrentLook.lerp(camLookTarget, 0.03);
        camera.lookAt(camCurrentLook);

        targetRing.scale.setScalar(1 + Math.sin(elapsed * 7) * 0.16);

        const startAirPos = new THREE.Vector3(30, 95, 35);
        const groundTarget = impactTargetPos.clone();

        const curMeteorPos = new THREE.Vector3().lerpVectors(startAirPos, groundTarget, Math.pow(t, 1.85));
        meteorGroup.position.copy(curMeteorPos);

        tailHistory.unshift(curMeteorPos.clone());
        if (tailHistory.length > TAIL_COUNT) tailHistory.pop();
        const tPos = meteorTail.geometry.attributes.position.array;
        for (let i = 0; i < tailHistory.length; i++) {
          tPos[i * 3] = tailHistory[i].x - curMeteorPos.x;
          tPos[i * 3 + 1] = tailHistory[i].y - curMeteorPos.y;
          tPos[i * 3 + 2] = tailHistory[i].z - curMeteorPos.z;
        }
        meteorTail.geometry.attributes.position.needsUpdate = true;
      }
      // Act 11: Blast & Whiteout
      else if (elapsed >= 56.5 && elapsed < 59.0) {
        const blastT = (elapsed - 56.5) / 2.5;

        meteorGroup.position.copy(impactTargetPos);

        blastRingMat.opacity = Math.max(0, 1 - blastT);
        const waveScale = THREE.MathUtils.lerp(1, 45, blastT);
        blastRing.scale.set(waveScale, waveScale, 1);

        const shake = (1 - blastT) * 0.45;
        camera.position.x += (Math.random() - 0.5) * shake;
        camera.position.y += (Math.random() - 0.5) * shake;

        if (blastT > 0.35) {
          const whiteT = (blastT - 0.35) / 0.65;
          whiteoutScreen.style.opacity = Math.min(1, whiteT * 1.3);
        }
      }
      // Act 12: A Legend Born Text
      else if (elapsed >= 59.0 && elapsed < 62.5) {
        whiteoutScreen.style.opacity = '1';
        hudText.style.opacity = '0';
        legendText.style.opacity = '1';

        bdSceneGroup.visible = false;
        meteorGroup.visible = false;

        hackerRoomGroup.visible = true;
        hackerRoomGroup.position.set(0, 0, 0);

        const roomCam = getWideRoomCameraPos();
        camPosTarget.copy(roomCam);
        camLookTarget.set(0, 25.5, -4);
        camera.position.copy(roomCam);
        camera.lookAt(camLookTarget);
      }
      // Act 13: Eraser Animation
      else if (elapsed >= 62.5 && elapsed < 66.0) {
        const eraseT = (elapsed - 62.5) / 3.5;

        eraserTool.style.opacity = '1';

        const shakeY = Math.sin(eraseT * 55) * 14;
        const shakeRot = Math.sin(eraseT * 55) * 18 - 15;

        const wrapperWidth = legendWrapper.offsetWidth || 400;
        const curX = eraseT * (wrapperWidth + 90) - 50;

        eraserTool.style.left = `${curX}px`;
        eraserTool.style.transform = `translateY(calc(-50% + ${shakeY}px)) rotate(${shakeRot}deg)`;

        const erasePercent = Math.min(100, Math.max(0, (eraseT * 115)));
        legendText.style.clipPath = `polygon(${erasePercent}% 0%, 100% 0%, 100% 100%, ${erasePercent}% 100%)`;

        if (eraseT > 0.70) {
          const fadeT = (eraseT - 0.70) / 0.30;
          whiteoutScreen.style.opacity = `${1 - fadeT}`;
        }
      }
      // Act 14: Hacker Room Setup
      else if (elapsed >= 66.0 && elapsed < 70.5) {
        whiteoutScreen.style.display = 'none';
        eraserTool.style.opacity = '0';

        updateHackerScreen(elapsed);

        screenGlowLight.intensity = 3.2 + Math.sin(elapsed * 6) * 0.45;
        fan1.rotation.z += 0.08;
        fan2.rotation.z += 0.08;

        const roomCam = getWideRoomCameraPos();
        camPosTarget.copy(roomCam);
        camLookTarget.set(0, 25.5, -4);

        camera.position.lerp(camPosTarget, 0.05);
        camCurrentLook.lerp(camLookTarget, 0.05);
        camera.lookAt(camCurrentLook);
      }
      // Act 15: Deep Zoom to Terminal Screen
      else if (elapsed >= 70.5 && elapsed < 74.5) {
        updateHackerScreen(elapsed);
        screenGlowLight.intensity = 3.6;
        fan1.rotation.z += 0.08;
        fan2.rotation.z += 0.08;

        const zoomProgress = (elapsed - 70.5) / 4.0;

        const roomCam = getWideRoomCameraPos();
        const zoomCamPos = new THREE.Vector3(
          THREE.MathUtils.lerp(roomCam.x, 0, Math.pow(zoomProgress, 1.5)),
          THREE.MathUtils.lerp(roomCam.y, 25.5, Math.pow(zoomProgress, 1.5)),
          THREE.MathUtils.lerp(roomCam.z, -3.1, Math.pow(zoomProgress, 2.2))
        );

        camPosTarget.copy(zoomCamPos);
        camLookTarget.set(0, 25.5, -4);

        camera.position.lerp(camPosTarget, 0.08);
        camCurrentLook.lerp(camLookTarget, 0.08);
        camera.lookAt(camCurrentLook);
      }
      // Finale: Transition to resume.html
      else {
        updateHackerScreen(elapsed);
        camera.position.set(0, 25.5, -3.1);
        camera.lookAt(0, 25.5, -4);

        transitionToResume();
      }

      renderer.render(scene, camera);
    }

    // Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Keyboard Shortcuts (Skip on Escape / Space)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' || e.key === ' ') {
        transitionToResume();
      }
    });

    // Start Animation Loop
    animate();
  </script>
</body>
</html>
