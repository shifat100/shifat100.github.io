<body>
	<x id="keydetails">
		<p id="key" class="alert alert-success"> Press Any Key or Touch To Show</p>
	</x>

	<script>
		var exit = 0;

		function handleKeyDown(evt) {
			document.getElementById('keydetails').innerHTML = 
				'<div class="alert alert-success"><center><b>Key Details</b></center></div>' +
				'<table class="table"><tbody>' +
				'<tr><td><b>Key Name:</b></td><td>' + evt.key + '</td></tr>' +
				'<tr class="danger"><td><b>Key Code:</b></td><td>' + evt.keyCode + '</td></tr>' +
				'<tr><td><b>Code:</b></td><td>' + evt.code + '</td></tr>' +
				'</tbody></table>';
			
			if (evt.key == "0") {
				exit += 1;
				if (exit == 2) { window.close(); }
			}
		}

		function handleTouch(evt) {
			const touch = evt.touches[0];
			const x = touch.clientX;
			const y = touch.clientY;

			document.getElementById('keydetails').innerHTML = 
				'<div class="alert alert-success"><center><b>Touch Position</b></center></div>' +
				'<table class="table"><tbody>' +
				'<tr><td><b>X:</b></td><td>' + x + '</td></tr>' +
				'<tr><td><b>Y:</b></td><td>' + y + '</td></tr>' +
				'</tbody></table>';
		}

		document.body.addEventListener('keydown', handleKeyDown);
		document.body.addEventListener('touchstart', handleTouch);
