<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Key Tester</title><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={ theme:{ extend:{ fontFamily:{ roboto: ['Roboto', 'sans-serif'],}, colors:{ 'cm-gray-020': '#202020', 'cm-blue-009': '#0093E0', 'cm-blue-05a': '#05AEF2', 'cm-green-00a': '#00A539',}, screens:{ 'cm-qqvga':{'max': '8rem'}, 'cm-qvga':{'min': '15rem'},}}}} </script><style>::-webkit-scrollbar{ display: none} body{ -ms-overflow-style: none; scrollbar-width: none} *:focus{ outline: none} </style></head><body class="bg-cm-gray-020 text-white font-roboto h-screen w-screen flex flex-col overflow-hidden select-none"><header class="bg-cm-blue-009 w-full flex items-center justify-center shrink-0 z-10 h-[20px] px-[4px] cm-qvga:h-[40px] cm-qvga:px-[8px]"><h1 class="text-[10px] cm-qvga:text-base font-bold truncate">Key Tester</h1></header><main class="flex-1 overflow-y-auto p-[4px] cm-qvga:p-[8px] flex flex-col items-center justify-center"><div id="keydetails" class="w-full flex flex-col gap-2"><div id="initial-msg" class="bg-cm-grey-00a rounded text-center p-[4px] text-[10px] cm-qvga:p-[8px] cm-qvga:text-sm">Press Any Key To Show </div><div id="details-view" class="hidden flex-col w-full border border-gray-600 rounded bg-black overflow-hidden"><div class="bg-[#4e5565] text-white text-center font-bold p-[4px] text-[10px] cm-qvga:p-[8px] cm-qvga:text-sm">Key Details </div><div class="flex justify-between p-[6px] text-[10px] cm-qvga:p-[8px] cm-qvga:text-sm border-b border-gray-800"><span class="text-gray-400">Name:</span><span id="val-key" class="text-white font-bold truncate ml-2">...</span></div><div class="flex justify-between p-[6px] text-[10px] cm-qvga:p-[8px] cm-qvga:text-sm border-b border-gray-800 bg-red-900/30"><span class="text-gray-400">Code:</span><span id="val-keycode" class="text-white font-bold truncate ml-2">...</span></div><div class="flex justify-between p-[6px] text-[10px] cm-qvga:p-[8px] cm-qvga:text-sm"><span class="text-gray-400">Code:</span><span id="val-code" class="text-white font-bold truncate ml-2">...</span></div></div></div></main><footer class="bg-black w-full flex items-center justify-between shrink-0 z-10 border-t border-[#333333] h-[20px] px-[4px] cm-qvga:h-[30px] cm-qvga:px-[8px]"><div class="text-[9px] cm-qvga:text-[12px] font-bold text-white uppercase truncate text-left w-1/3"></div><div class="text-[9px] cm-qvga:text-[12px] font-bold text-white uppercase truncate text-center w-1/3"></div><div class="text-[9px] cm-qvga:text-[12px] font-bold text-white uppercase truncate text-right w-1/3">Exit</div></footer>
<script>const initialMsg=document.getElementById('initial-msg'); const detailsView=document.getElementById('details-view'); const adContainer=document.getElementById('ad-container'); const valKey=document.getElementById('val-key'); const valKeyCode=document.getElementById('val-keycode'); const valCode=document.getElementById('val-code'); document.body.addEventListener('keydown', function(evt){ valKey.innerText=evt.key===' ' ? 'Space' : evt.key; valKeyCode.innerText=evt.keyCode; valCode.innerText=evt.code || 'N/A'; initialMsg.classList.add('hidden'); detailsView.classList.remove('hidden'); detailsView.classList.add('flex');});</script></body></html>
