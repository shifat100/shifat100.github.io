<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Link Visitor with Cooldown</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        .info {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            z-index: 1000;
            font-size: 14px;
        }
        iframe {
            position: absolute;
            border: 2px solid #333;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="info" id="status">Initializing...</div>

    <script>
        // ১. আপনার লিংকগুলোর অ্যারে
        const links = [
            "https://shifat100.xtgem.com/files.html",
            "https://omg10.com/4/9569147", 

            "https://matcheshonoraryunderwater.com/h3ghsxyvp?key=331819c57a0e4e6203da3f03fe993d20331819c57a0e4e6203da3f03fe993d20"
        ];

        // কোন লিংকটি শেষ কবে বন্ধ হয়েছে তা রাখার জন্য অবজেক্ট
        const lastUsed = {}; 
        const COOLDOWN_TIME = 2 * 60 * 1000; // ২ মিনিট (মিলি-সেকেন্ডে)

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function loadRandomLink() {
            const currentTime = Date.now();
            
            // ২. শুধুমাত্র সেই লিংকগুলো ফিল্টার করা হবে যাদের ২ মিনিট সময় পার হয়ে গেছে
            const availableLinks = links.filter(link => {
                if (!lastUsed[link]) return true; // যদি লিংকটি আগে ব্যবহার না হয়ে থাকে
                return (currentTime - lastUsed[link]) > COOLDOWN_TIME; // ২ মিনিট পার হলে
            });

            let selectedLink;

            if (availableLinks.length > 0) {
                // অ্যাভেইলেবল লিংক থেকে একটি রেন্ডমলি নেওয়া হবে
                selectedLink = availableLinks[Math.floor(Math.random() * availableLinks.length)];
            } else {
                // যদি সব লিংকই কুলডাউন পিরিয়ডে থাকে, তবে সামান্য অপেক্ষা করে আবার চেষ্টা করবে
                document.getElementById('status').innerText = "All links in cooldown. Waiting...";
                setTimeout(loadRandomLink, 5000); 
                return;
            }

            // রেন্ডম সাইজ এবং পজিশন
            const width = getRandomInt(300, 800);
            const height = getRandomInt(300, 600);
            const top = getRandomInt(0, window.innerHeight - height);
            const left = getRandomInt(0, window.innerWidth - width);

            // আইফ্রেম তৈরি
            const iframe = document.createElement('iframe');
            iframe.src = selectedLink;
            
            // sandbox যোগ করা হয়েছে যাতে মেইন পেজ রিডাইরেক্ট না হয়
            iframe.setAttribute('sandbox', 'allow-scripts allow-forms allow-same-origin');
            
            iframe.style.width = width + 'px';
            iframe.style.height = height + 'px';
            iframe.style.top = top + 'px';
            iframe.style.left = left + 'px';

            document.body.appendChild(iframe);

            document.getElementById('status').innerText = `Loading: ${selectedLink} | Cooldown active for others.`;

            // ৩. ৩০-৫০ সেকেন্ড পর আইফ্রেমটি বন্ধ করা
            const closeTime = getRandomInt(30000, 50000); 
            setTimeout(() => {
                document.body.removeChild(iframe);
                
                // বন্ধ হওয়ার সময়টি রেকর্ড করে রাখা হচ্ছে (Cool-down শুরু)
                lastUsed[selectedLink] = Date.now(); 
                
                console.log(`Closed ${selectedLink}. It will be available again in 2 minutes.`);
            }, closeTime);

            // ৪. পরবর্তী লিংকটি ৫-১৫ সেকেন্ড পর লোড হবে
            const nextLoadTime = getRandomInt(40000, 120000);
            setTimeout(loadRandomLink, nextLoadTime);
        }

        // স্ক্রিপ্ট শুরু
        window.onload = () => {
            loadRandomLink();
        };
    </script>
</body>
</html>
