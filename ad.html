<!DOCTYPE html>
<html>
<head>
  <title>Random Iframes</title>
  <style>
    body { margin:0; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
    }
    iframe {
      width: 100%;
      height: 150px;
      border: none;
    }
  </style>
</head>
<body>

<div class="grid">
  <iframe id="f1"></iframe>
  <iframe id="f2"></iframe>
  <iframe id="f3"></iframe>
  <iframe id="f4"></iframe>
</div>

<script>
  var links = [
    "https://matcheshonoraryunderwater.com/h3ghsxyvp?key=331819c57a0e4e6203da3f03fe993d20331819c57a0e4e6203da3f03fe993d20",
    "https://example2.com",
    "https://example3.com",
    "https://matcheshonoraryunderwater.com/h3ghsxyvp?key=331819c57a0e4e6203da3f03fe993d20331819c57a0e4e6203da3f03fe993d20",
    "https://example5.com",
    "https://shifat100.xtgem.com/files.html"
  ];

  function getRandomLink() {
    return links[Math.floor(Math.random() * links.length)];
  }

  function loadRandom() {
    document.getElementById("f1").src = getRandomLink();
    document.getElementById("f2").src = getRandomLink();
    document.getElementById("f3").src = getRandomLink();
    document.getElementById("f4").src = getRandomLink();
  }

  setInterval(loadRandom, 40000);
</script>

</body>
</html>
