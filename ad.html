<!DOCTYPE html>
<html>
<head>
  <title>Random Iframe Loader</title>
  <style>
    body { margin:0; background:#000; }
    iframe {
      width: 100%;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>

<iframe id="screen"></iframe>

<script>
  var links = [
    "https://matcheshonoraryunderwater.com/h3ghsxyvp?key=331819c57a0e4e6203da3f03fe993d20331819c57a0e4e6203da3f03fe993d20",
    "https://example2.com",
    "https://example3.com",
    "https://matcheshonoraryunderwater.com/h3ghsxyvp?key=331819c57a0e4e6203da3f03fe993d20331819c57a0e4e6203da3f03fe993d20",
    "https://example5.com"
  ];

  function randomLink() {
    return links[Math.floor(Math.random() * links.length)];
  }

  function randomTime() {
    // minimum 30 sec (30000 ms) + up to 20 sec extra randomness
    return 30000 + Math.floor(Math.random() * 20000);
  }

  function loadRandomScreen() {
    document.getElementById("screen").src = randomLink();
    setTimeout(loadRandomScreen, randomTime());
  }

  loadRandomScreen();
</script>

</body>
</html>
