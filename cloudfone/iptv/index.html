<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Touch IPTV Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* --- RESET & BASIC --- */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; outline: none; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; overflow: hidden; }

        /* --- CONTAINER --- */
        #app-container { width: 100%; height: 100%; background-color: #000; position: relative; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 0 30px rgba(0,0,0,0.8); }

        /* --- HEADER --- */
        header { height: 50px; background-color: #202020; display: flex; align-items: center; padding: 0 15px; border-bottom: 2px solid #009be5; z-index: 10; position: relative; }
        .header-title { font-size: 18px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #search-input { width: calc(100% - 20px); height: 36px; background: #fff; border: 2px solid #009be5; color: #000; font-size: 16px; padding: 0 10px; border-radius: 4px; display: none; position: absolute; left: 10px; top: 7px; right: 10px; margin: 0; z-index: 20; }

        /* --- MAIN VIEW --- */
        main { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
        
        /* List Style */
        .list-container { display: flex; flex-direction: column; padding-bottom: 20px;}
        .list-item { padding: 15px 15px; font-size: 16px; border-bottom: 1px solid #333; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: background 0.2s;}
        .list-item:active { background-color: #333; }
        .list-item.focused { background-color: #009be5; color: #fff; font-weight: 600; }
        
        /* Grid Style (using float and fixed width/height for old browser compatibility) */
        .grid-container { padding: 15px; overflow: hidden; /* Clear floats */ }
        .grid-item {
            float: left; /* Use float for grid layout */
            width: 90px; /* Fixed width */
            height: 100px; /* Fixed height */
            margin: 7.5px; /* Half of gap, for spacing */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-color: #222;
            border-radius: 8px;
            padding: 5px;
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid #333;
            overflow: hidden; /* For text ellipsis */
        }
        .grid-item:active { background-color: #333; }
        .grid-item img { width: 50px; height: 50px; object-fit: contain; border-radius: 4px; background: #fff; margin-bottom: 3px; }
        .grid-item span { font-size: 11px; color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; padding: 0 2px; }
        .grid-item.focused { background-color: #009be5; color: #fff; font-weight: 600; border-color: #009be5; }

        /* No Channels Message */
        #no-channels-message { padding: 20px; text-align: center; color: #888; font-size: 14px; }

        /* --- NATIVE PLAYER CONTAINER --- */
        #native-player-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 100; display: none; flex-direction: column; }
        
        /* Close Button for Player */
        #player-header { position: absolute; top: 0; left: 0; width: 100%; padding: 10px; z-index: 110; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); display: flex; justify-content: flex-start; pointer-events: none; }
        #btn-close-player { pointer-events: auto; background: rgba(255, 255, 255, 0.2); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(5px); }
        #btn-close-player svg { width: 24px; height: 24px; fill: white; }

        /* Video Element */
        video { width: 100%; height: 100%; display: block; object-fit: contain; }

        /* Player OSD Title */
        #player-osd-title { 
            position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 8px 15px; border-radius: 20px;
            font-size: 15px; z-index: 110; display: none; max-width: 90%;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* --- FOOTER --- */
        footer { height: 50px; background-color: #1a1a1a; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; border-top: 1px solid #333; z-index: 20; }
        .soft-btn { min-width: 50px; height: 100%; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; }
        .soft-btn:active { opacity: 0.7; }
        .soft-btn svg { fill: white; width: 26px; height: 26px; } /* SVG size for soft buttons */
        #sk-left-text, #sk-right-text { font-size: 14px; font-weight: 600; display: none; } /* Hide text, show SVG */

        /* --- MODALS --- */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
        .modal-box { background: #222; width: 85%; max-height: 70%; border-radius: 12px; overflow-y: auto; border: 1px solid #444; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-header { background: #009be5; color: white; padding: 15px; font-weight: bold; font-size: 16px; text-align: center; }
        .menu-item { padding: 15px; border-bottom: 1px solid #333; color: #eee; font-size: 15px; cursor: pointer; }
        .menu-item:active { background: #333; }
        .menu-item.focused { background: #333; color: white; border-left: 5px solid #009be5; }

        #osd { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(50,50,50,0.9); color: white; padding: 8px 20px; border-radius: 20px; font-size: 14px; z-index: 300; display: none; pointer-events: none; text-align: center; border: 1px solid #555;}
        input[type="file"] { display: none; }

        /* --- Small Screen Optimizations (240x320) --- */
        @media (max-height: 320px) { /* For 240x320 screens */
            header, footer { height: 40px; padding: 0 10px; }
            .header-title { font-size: 16px; }
            #search-input { height: 30px; font-size: 14px; top: 5px; }
            .list-item { padding: 10px; font-size: 14px; gap: 8px;}
            .list-item img { width: 30px; height: 30px; }
            .grid-item { width: 70px; height: 80px; margin: 5px; padding: 4px; border-radius: 6px; }
            .grid-item img { width: 40px; height: 40px; margin-bottom: 3px; }
            .grid-item span { font-size: 9px; }
            #btn-close-player { width: 30px; height: 30px; }
            #btn-close-player svg { width: 20px; height: 20px; }
            #player-osd-title { top: 40px; font-size: 13px; padding: 5px 10px; }
            .soft-btn svg { width: 22px; height: 22px; } /* Adjust SVG size for soft buttons */
            .modal-header { padding: 10px; font-size: 14px; }
            .menu-item { padding: 10px; font-size: 13px; }
            #osd { bottom: 60px; font-size: 12px; padding: 6px 15px; }
        }

        /* --- Tiny Screen Optimizations (128x160) --- */
        @media (max-height: 160px) { /* For 128x160 screens */
            header, footer { height: 30px; padding: 0 5px; }
            .header-title { font-size: 12px; }
            #search-input { height: 24px; font-size: 10px; top: 3px; }
            .list-item { padding: 5px; font-size: 10px; gap: 5px; height: 40px;}
            .list-item img { width: 20px; height: 20px; }
            .grid-item { width: 50px; height: 55px; margin: 2.5px; padding: 2px; border-radius: 4px; }
            .grid-item img { width: 25px; height: 25px; margin-bottom: 2px; }
            .grid-item span { font-size: 7px; }
            #btn-close-player { width: 24px; height: 24px; }
            #btn-close-player svg { width: 16px; height: 16px; }
            #player-osd-title { top: 30px; font-size: 10px; padding: 3px 8px; }
            .soft-btn svg { width: 18px; height: 18px; } /* Adjust SVG size for soft buttons */
            .modal-header { padding: 8px; font-size: 12px; }
            .menu-item { padding: 8px; font-size: 11px; }
            #osd { bottom: 40px; font-size: 10px; padding: 4px 10px; }
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- HEADER -->
        <header id="header-bar">
            <div class="header-title">IPTV Player</div>
            <input type="text" id="search-input" placeholder="Search channel...">
        </header>

        <!-- MAIN VIEW -->
        <main id="main-view"></main>

        <!-- FOOTER -->
        <footer id="footer-bar">
            <div class="soft-btn soft-left" id="sk-left">
                <svg id="sk-left-icon" viewBox="0 0 24 24" style="display: none;"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg> <!-- Menu icon -->
                <span id="sk-left-text" style="display: none;">Menu</span>
            </div>
            <div class="soft-btn soft-right" id="sk-right">
                <svg id="sk-right-icon" viewBox="0 0 24 24" style="display: none;"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg> <!-- Search icon -->
                <span id="sk-right-text" style="display: none;">Search</span>
            </div>
        </footer>

        <!-- NATIVE PLAYER UI -->
        <div id="native-player-container">
            <div id="player-header">
                <div id="btn-close-player">
                    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                </div>
            </div>
            <div id="player-osd-title" style="display: none;"></div>
            <video id="video-source" controls playsinline></video>
        </div>

        <!-- MENU/QUALITY MODAL -->
        <div id="menu-modal" class="modal-overlay">
            <div class="modal-box">
                <div class="modal-header" id="modal-title">Menu</div>
                <div id="menu-list"></div>
            </div>
        </div>

        <!-- OSD TOAST -->
        <div id="osd">Info</div>
        <input type="file" id="fileInput" accept=".m3u,.m3u8,.txt">
    </div>

    <script>
        const DEFAULT_PLAYLIST = `#EXTM3U
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/c/c5/Big_buck_bunny_poster_big.jpg",Example Channel 1
http://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8
#EXTINF:-1 tvg-logo="https://cdn.iconscout.com/icon/free/png-256/tv-channel-1447953-1221731.png",Example Channel 2 (Another)
http://qthttp.apple.com.edgesuite.net/1010qwoeiuryfg/sl.m3u8
#EXTINF:-1 tvg-logo="https://example.com/fakelogo.png",Broken Logo Channel
http://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8
#EXTINF:-1,Channel Without Logo (Long Name)
http://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8`;

        const LS_KEY = 'touch_iptv_data';
        const LS_VIEW_MODE_KEY = 'touch_iptv_view_mode';

        const State = {
            currentView: 'list', // 'list', 'player', 'menu', 'search'
            channels: [], 
            filtered: [], 
            listIdx: 0, 
            menuIdx: 0, 
            hls: null,
            osdTimer: null,
            playerOsdTimer: null,
            viewMode: localStorage.getItem(LS_VIEW_MODE_KEY) || 'list' // 'list' or 'grid'
        };

        const UI = {
            main: document.getElementById('main-view'),
            headerTitle: document.querySelector('.header-title'),
            search: document.getElementById('search-input'),
            skL: document.getElementById('sk-left'), 
            skR: document.getElementById('sk-right'),
            skLIcon: document.getElementById('sk-left-icon'), 
            skRIcon: document.getElementById('sk-right-icon'), 
            skLText: document.getElementById('sk-left-text'),
            skRText: document.getElementById('sk-right-text'),
            playerContainer: document.getElementById('native-player-container'), 
            video: document.getElementById('video-source'), 
            btnClose: document.getElementById('btn-close-player'),
            playerOsdTitle: document.getElementById('player-osd-title'),
            modal: document.getElementById('menu-modal'), 
            mList: document.getElementById('menu-list'),
            osd: document.getElementById('osd'), 
            fileIn: document.getElementById('fileInput')
        };

        window.onload = () => {
            const saved = localStorage.getItem(LS_KEY);
            parseM3U(saved ? saved : DEFAULT_PLAYLIST);
            navigateTo('list', { replace: true }); 
        };

        // --- HISTORY MANAGEMENT ---
        function navigateTo(view, data = {}, options = { replace: false, render: true }) {
            const currentHash = window.location.hash.slice(1);
            if (!options.replace && currentHash === view) {
                State.currentView = view;
                updateViewDisplay(view);
                updateFooterButtons();
                return;
            }

            const newState = { view, data };
            if (options.replace) {
                history.replaceState(newState, '', `#${view}`);
            } else {
                history.pushState(newState, '', `#${view}`);
            }
            State.currentView = view;
            if (options.render) {
                updateViewDisplay(view);
            }
            updateFooterButtons();
        }

        window.addEventListener('popstate', (event) => {
            const state = event.state;
            if (state) {
                State.currentView = state.view;
                updateViewDisplay(state.view);
                updateFooterButtons();
            } else {
                navigateTo('list', {}, { replace: true, render: true });
            }
        });

        // This function handles displaying the correct UI for the current view
        function updateViewDisplay(view) {
            UI.main.style.display = 'flex'; 
            document.getElementById('header-bar').style.display = 'flex';
            document.getElementById('footer-bar').style.display = 'flex';
            UI.playerContainer.style.display = 'none';
            UI.modal.style.display = 'none';
            UI.search.style.display = 'none';
            UI.search.blur(); 

            if (view === 'list') {
                renderList();
            } else if (view === 'player') {
                UI.main.style.display = 'none'; 
                document.getElementById('header-bar').style.display = 'none';
                document.getElementById('footer-bar').style.display = 'none';
                UI.playerContainer.style.display = 'flex';
            } else if (view === 'menu') {
                renderList(); 
                UI.modal.style.display = 'flex';
                State.menuIdx = 0; 
                renderMenu();
            } else if (view === 'search') {
                UI.search.style.display = 'block';
                UI.search.focus();
                renderList(); 
            }
        }


        // --- KEYBOARD HANDLING ---
        document.addEventListener('keydown', (e) => {
            const key = e.key;

            if (key === 'SoftLeft' || key === 'F1') {
                e.preventDefault();
                handleSoftLeft();
                return;
            }
            if (key === 'SoftRight' || key === 'F2') {
                e.preventDefault();
                handleSoftRight();
                return;
            }
            if (key === 'Backspace' || key === 'BrowserBack') {
                e.preventDefault();
                handleBack();
                return;
            }
            if (key === 'Escape') { 
                e.preventDefault();
                if (State.currentView === 'menu') {
                    navigateTo('list', { from: 'menu' });
                } else if (State.currentView === 'list') {
                    navigateTo('menu', { from: 'list' });
                } else {
                    handleBack();
                }
                return;
            }
            
            if (State.currentView === 'list') {
                if (key === 'ArrowDown') { e.preventDefault(); moveList(1); }
                if (key === 'ArrowUp') { e.preventDefault(); moveList(-1); }
                if (key === 'ArrowRight' && State.viewMode === 'grid') { e.preventDefault(); moveList(1, 'grid-h'); } 
                if (key === 'ArrowLeft' && State.viewMode === 'grid') { e.preventDefault(); moveList(-1, 'grid-h'); }
                if (key === 'Enter' && State.filtered.length > 0) {
                    e.preventDefault();
                    playChannel(State.filtered[State.listIdx]);
                }
                if (key.length === 1 && /^[a-z0-9]$/i.test(key)) {
                    navigateTo('search', { from: 'list' });
                    UI.search.value += key;
                    filterSearch(UI.search.value);
                }
            } else if (State.currentView === 'player') {
                // Player key controls removed to rely on default video controls
            } else if (State.currentView === 'menu') {
                e.preventDefault();
                const menuItems = UI.mList.children;
                if (menuItems.length === 0) return;

                if (key === 'ArrowDown') moveMenu(1);
                if (key === 'ArrowUp') moveMenu(-1);
                if (key === 'Enter') executeMenu();
            } else if (State.currentView === 'search') {
                if (key === 'ArrowDown') {
                    e.preventDefault();
                    UI.search.blur();
                    State.listIdx = 0; 
                    navigateTo('list', { from: 'search', listIdx: State.listIdx }, { render: false });
                    renderList();
                }
                if (key === 'ArrowUp') {
                    e.preventDefault();
                    UI.search.blur();
                    State.listIdx = Math.max(0, State.filtered.length - 1); 
                    navigateTo('list', { from: 'search', listIdx: State.listIdx }, { render: false });
                    renderList();
                }
            }
        });

        // --- Soft Key Handlers ---
        function handleSoftLeft() {
            if (State.currentView === 'list') navigateTo('menu', { from: 'list' });
            else if (State.currentView === 'player') { /* default player controls */ }
            else if (State.currentView === 'search') { /* no action defined for soft left in search */ }
            else if (State.currentView === 'menu') executeMenu(); 
        }

        function handleSoftRight() {
            if (State.currentView === 'list') navigateTo('search', { from: 'list' });
            else if (State.currentView === 'player') navigateTo('list', { from: 'player' });
            else if (State.currentView === 'search') navigateTo('list', { from: 'search' });
            else if (State.currentView === 'menu') navigateTo('list', { from: 'menu' });
        }

        function handleBack() {
            if (history.length > 1) {
                history.back();
            } else {
                showOSD("Press Power Key to Exit App"); 
            }
        }


        // --- PLAYER LOGIC (NATIVE) ---
        function playChannel(ch) {
            navigateTo('player', { channel: ch }); 
            showPlayerOSD(ch.name); 

            const hlsConfig = {};
            if (ch.headers && Object.keys(ch.headers).length > 0) {
                hlsConfig.xhrSetup = (xhr) => {
                    for (const [key, value] of Object.entries(ch.headers)) xhr.setRequestHeader(key, value);
                };
            }

            if (Hls.isSupported()) {
                if (State.hls) State.hls.destroy();
                State.hls = new Hls(hlsConfig);
                State.hls.loadSource(ch.url);
                State.hls.attachMedia(UI.video);
                State.hls.on(Hls.Events.MANIFEST_PARSED, () => { 
                    UI.video.play().catch(e => console.log("Autoplay blocked:", e)); 
                });
                State.hls.on(Hls.Events.ERROR, (e, data) => { 
                    if(data.fatal) showOSD("Stream Error: " + data.details); 
                    console.error("HLS error:", e, data);
                });
            } else if (UI.video.canPlayType('application/vnd.apple.mpegurl')) {
                UI.video.src = ch.url; 
                UI.video.play().catch(e => console.log("Autoplay blocked:", e));
            } else {
                showOSD("HLS not supported in this browser.");
            }
        }

        // --- LIST/GRID RENDER & NAVIGATION ---
        function renderList() {
            UI.main.innerHTML = '';
            const container = document.createElement('div');
            container.className = State.viewMode === 'list' ? 'list-container' : 'grid-container';

            if (State.filtered.length === 0) {
                const noChannelsMessage = document.createElement('div');
                noChannelsMessage.id = 'no-channels-message';
                noChannelsMessage.innerText = UI.search.style.display === 'block' ? 'No channels match your search.' : 'No channels loaded. Load a playlist from the menu.';
                UI.main.appendChild(noChannelsMessage);
            } else {
                State.filtered.forEach((ch, i) => {
                    const div = document.createElement('div');
                    div.className = (State.viewMode === 'list' ? 'list-item' : 'grid-item') + (i === State.listIdx && State.currentView === 'list' ? ' focused' : '');
                    
                    let logoSize = State.viewMode === 'list' ? '40px' : '50px'; 
                    let fontSize = State.viewMode === 'list' ? '10px' : '11px';

                    if (window.innerHeight <= 320) { 
                        if (State.viewMode === 'list') {
                            logoSize = '30px';
                            fontSize = '10px';
                        } else { 
                            logoSize = '40px';
                            fontSize = '9px';
                        }
                    }
                    if (window.innerHeight <= 160) { 
                         if (State.viewMode === 'list') {
                            logoSize = '20px';
                            fontSize = '8px';
                        } else { 
                            logoSize = '25px';
                            fontSize = '7px';
                        }
                    }

                    const logoHtml = ch.logo 
                        ? `<img src="${ch.logo}" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iIzMzMyI+PHBhdGggZD0iTTAgMGgyNHYyNEgwVjB6Ii8+PC9zdmc+'" style="width:${logoSize};height:${logoSize};">`
                        : `<div style="width:${logoSize};height:${logoSize};background:#333;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:${fontSize};color:#777">TV</div>`;
                    
                    div.innerHTML = `${logoHtml}<span>${ch.name}</span>`;
                    
                    div.onclick = () => { 
                        State.listIdx = i; 
                        renderList(); 
                        playChannel(ch); 
                    };
                    container.appendChild(div);
                });
                UI.main.appendChild(container);
                scrollToFocus(UI.main); 
            }
            updateFooterButtons();
        }

        function moveList(direction, type = 'vertical') {
            if (State.filtered.length === 0) return;

            let newIndex = State.listIdx;

            if (type === 'vertical') {
                newIndex += direction;
            } else if (type === 'grid-h') {
                const gridContainer = UI.main.querySelector('.grid-container');
                if (gridContainer) {
                    const itemElement = gridContainer.querySelector('.grid-item');
                    if (itemElement) {
                        const itemWidth = itemElement.offsetWidth + (parseFloat(window.getComputedStyle(itemElement).marginLeft) * 2); // Calculate item width including margin
                        const containerWidth = gridContainer.offsetWidth;
                        const numColumns = Math.floor(containerWidth / itemWidth);
                        
                        // Calculate next index for horizontal movement
                        let currentRowStartIdx = Math.floor(State.listIdx / numColumns) * numColumns;
                        let nextHorizontalIndex = State.listIdx + direction;

                        if (direction > 0) { // Moving right
                            if (nextHorizontalIndex >= currentRowStartIdx + numColumns || nextHorizontalIndex >= State.filtered.length) {
                                // If at end of row or end of list, wrap to next row (first item) or stay at end
                                newIndex = Math.min(currentRowStartIdx + numColumns, State.filtered.length - 1);
                                if (newIndex === State.listIdx && State.listIdx < State.filtered.length - 1) { // If already at end of current row, move to start of next
                                    newIndex = Math.min(State.listIdx + numColumns, State.filtered.length - 1);
                                } else if (newIndex === State.listIdx && State.listIdx === State.filtered.length - 1) { // If at absolute end
                                    newIndex = State.listIdx;
                                }
                            } else {
                                newIndex = nextHorizontalIndex;
                            }
                        } else { // Moving left
                            if (nextHorizontalIndex < currentRowStartIdx || nextHorizontalIndex < 0) {
                                // If at start of row or start of list, wrap to previous row (last item) or stay at start
                                newIndex = Math.max(0, currentRowStartIdx - 1);
                                if (newIndex === State.listIdx && State.listIdx > 0) { // If already at start of current row, move to end of previous
                                     newIndex = Math.max(0, State.listIdx - numColumns);
                                } else if (newIndex === State.listIdx && State.listIdx === 0) { // If at absolute start
                                    newIndex = State.listIdx;
                                }
                            } else {
                                newIndex = nextHorizontalIndex;
                            }
                        }
                    } else {
                        newIndex += direction; // Fallback to linear if no grid item found
                    }
                } else {
                    newIndex += direction; // Fallback to linear if no grid container found
                }
            }


            if (newIndex >= 0 && newIndex < State.filtered.length) {
                State.listIdx = newIndex;
                renderList();
            }
        }


        function scrollToFocus(containerElement) {
            const focusedElement = containerElement.querySelector('.focused');
            if (focusedElement) {
                focusedElement.scrollIntoView({ block: 'center', behavior: 'smooth' });
            }
        }

        // --- PARSER ---
        function parseM3U(data, save = false) {
            if (save) try { localStorage.setItem(LS_KEY, data); } catch(e){}
            State.channels = [];
            const lines = data.split('\n');
            let tempCh = {};
            for(let i=0; i<lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF')) {
                    tempCh = { headers: {} }; 
                    const logo = line.match(/tvg-logo="([^"]*)"/);
                    tempCh.logo = logo ? logo[1] : null;
                    tempCh.name = line.split(',').pop().trim();
                } else if (line.startsWith('http')) {
                    if(line.includes('|')) {
                        const p = line.split('|');
                        tempCh.url = p[0];
                        if(p[1].includes('User-Agent=')) tempCh.headers['User-Agent'] = p[1].match(/User-Agent=([^&]*)/)[1];
                    } else tempCh.url = line;
                    if(tempCh.name) State.channels.push(tempCh);
                }
            }
            State.filtered = State.channels; 
            State.listIdx = 0; 
            renderList();
        }

        // --- UI ACTIONS ---
        function renderMenu() {
            UI.mList.innerHTML = '';
            const menuOptions = [
                { t: 'Load Playlist (File)', a: () => { UI.fileIn.click(); navigateTo('list', { from: 'menu' }); } }, 
                { t: 'Reload Default Playlist', a: () => { 
                    localStorage.removeItem(LS_KEY); 
                    parseM3U(DEFAULT_PLAYLIST, true); 
                    showOSD("Default Playlist Loaded!");
                    navigateTo('list', { from: 'menu' }); 
                }},
                { t: `Toggle View (${State.viewMode === 'list' ? 'Grid' : 'List'})`, a: () => {
                    State.viewMode = State.viewMode === 'list' ? 'grid' : 'list';
                    localStorage.setItem(LS_VIEW_MODE_KEY, State.viewMode);
                    renderList();
                    navigateTo('list', { from: 'menu' }); 
                }},
                { t: 'Close Menu', a: () => navigateTo('list', { from: 'menu' }) }
            ];

            menuOptions.forEach((it, i) => {
                const d = document.createElement('div'); 
                d.className = 'menu-item' + (i === State.menuIdx ? ' focused' : '');
                d.innerText = it.t;
                d.onclick = () => {
                    State.menuIdx = i; 
                    it.a();
                };
                UI.mList.appendChild(d);
            });
            scrollToFocus(UI.mList); 
        }

        function moveMenu(direction) {
            const menuItems = UI.mList.children;
            if (menuItems.length === 0) return;
            State.menuIdx = (State.menuIdx + direction + menuItems.length) % menuItems.length;
            renderMenu();
        }

        function executeMenu() {
            if (UI.mList.children.length > 0) {
                UI.mList.children[State.menuIdx].click();
            }
        }
        
        function showOSD(m) { 
            UI.osd.innerText = m; 
            UI.osd.style.display = 'block'; 
            if (State.osdTimer) clearTimeout(State.osdTimer);
            State.osdTimer = setTimeout(()=>UI.osd.style.display='none', 2000); 
        }

        function showPlayerOSD(title) {
            UI.playerOsdTitle.innerText = title;
            UI.playerOsdTitle.style.display = 'block';
            UI.playerOsdTitle.style.maxWidth = 'calc(100% - 20px)'; 
            if (State.playerOsdTimer) clearTimeout(State.playerOsdTimer);
            State.playerOsdTimer = setTimeout(() => UI.playerOsdTitle.style.display = 'none', 3000);
        }

        // --- FOOTER BUTTONS (with SVG icons) ---
        function updateFooterButtons() {
            UI.skLIcon.style.display = 'none';
            UI.skRIcon.style.display = 'none';
            UI.skLText.style.display = 'none';
            UI.skRText.style.display = 'none';

            if (State.currentView === 'list') {
                UI.skLIcon.innerHTML = '<path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>'; // Menu icon
                UI.skLIcon.style.display = 'block';
                UI.skRIcon.innerHTML = '<path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>'; // Search icon
                UI.skRIcon.style.display = 'block';
            } else if (State.currentView === 'player') {
                UI.skLText.innerText = ''; 
                UI.skRIcon.innerHTML = '<path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>'; // Back icon
                UI.skRIcon.style.display = 'block';
            } else if (State.currentView === 'menu') {
                UI.skLIcon.innerHTML = '<path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>'; // Select (Checkmark) icon
                UI.skLIcon.style.display = 'block';
                UI.skRIcon.innerHTML = '<path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>'; // Back icon
                UI.skRIcon.style.display = 'block';
            } else if (State.currentView === 'search') {
                UI.skLText.innerText = ''; 
                UI.skRIcon.innerHTML = '<path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>'; // Cancel (Close) icon
                UI.skRIcon.style.display = 'block';
            }
        }

        // --- SEARCH LOGIC ---
        function filterSearch(term) {
            const t = term.toLowerCase();
            State.filtered = State.channels.filter(c => c.name.toLowerCase().includes(t));
            State.listIdx = 0; 
            renderList();
        }

        // --- EVENT BINDINGS (TOUCH & KEYBOARD) ---
        UI.skL.onclick = handleSoftLeft; 
        UI.skR.onclick = handleSoftRight; 
        
        UI.search.addEventListener('input', (e) => {
            filterSearch(e.target.value);
        });
        
        UI.btnClose.onclick = () => navigateTo('list', { from: 'player' }); 
        UI.fileIn.onchange = e => { 
            if (e.target.files.length > 0) {
                const r = new FileReader(); 
                r.onload = v => { 
                    parseM3U(v.target.result, true); 
                    showOSD("Playlist Loaded!");
                }; 
                r.readAsText(e.target.files[0]); 
            }
        };

    </script>
</body>
