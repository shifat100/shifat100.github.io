<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Canvas IP TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* --- RESET & BASIC --- */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; outline: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #222; display: flex; justify-content: center; align-items: center;
            height: 100vh; color: white; overflow: hidden;
        }

        /* --- CONTAINER --- */
        #app-container {
            width: 100%; height: 100%; max-width: 240px; max-height: 320px;
            background-color: #000; position: relative; overflow: hidden;
            display: flex; flex-direction: column; box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* --- HEADER & LIST STYLES --- */
        header {
            height: 28px; background-color: #202020; display: flex; align-items: center;
            padding: 0 8px; border-bottom: 2px solid #009be5; z-index: 10; position: relative;
        }
        .header-title { font-size: 14px; font-weight: 600; flex: 1; }
        #search-input {
            width: 100%; height: 22px; background: #fff; border: 2px solid #009be5;
            color: #000; font-size: 12px; padding: 0 5px; border-radius: 2px;
            display: none; position: absolute; left: 0; top: 3px; right: 0; margin: 0 4px; z-index: 20;
        }
        main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
        .list-item {
            padding: 10px 12px; font-size: 16px; border-bottom: 1px solid #222; color: #ccc;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
        }
        .list-item.focused { background-color: #009be5; color: #fff; font-weight: 600; }

        /* --- FOOTER --- */
        footer {
            height: 36px; background-color: #000; display: flex; justify-content: space-between;
            align-items: center; padding: 0 8px; border-top: 1px solid #333; z-index: 20;
        }
        .soft-btn { min-width: 30px; height: 100%; display: flex; align-items: center; color: white; font-weight: 600; font-size: 12px; }
        .soft-center { flex: 1; justify-content: center; font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px;}
        svg { fill: white; width: 20px; height: 20px; pointer-events: none; }

        /* --- PLAYER UI (CANVAS) --- */
        #player-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 100; display: none;
        }
        
        /* The real video is hidden, we draw to canvas */
        video { display: none; } 
        canvas { width: 100%; height: 100%; display: block; }

        /* --- CUSTOM VIDEO CONTROLS --- */
        #video-controls {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px; display: flex; flex-direction: column; gap: 4px;
            transition: opacity 0.3s; z-index: 110;
        }
        #video-controls.hidden { opacity: 0; pointer-events: none; }

        .ctrl-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .time-text { font-size: 10px; color: #ddd; font-variant-numeric: tabular-nums; min-width: 60px; }
        
        /* Sliders */
        input[type=range] {
            -webkit-appearance: none; width: 100%; height: 4px; background: #555; border-radius: 2px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 12px; height: 12px; background: #009be5; border-radius: 50%;
        }

        .icon-btn { width: 24px; height: 24px; padding: 2px; cursor: pointer; }

        /* Top Overlay (Back / Title) */
        #player-top {
            position: absolute; top: 0; left: 0; width: 100%; padding: 5px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
            display: flex; justify-content: space-between; z-index: 110;
            transition: opacity 0.3s;
        }
        #player-top.hidden { opacity: 0; }
        .p-title { font-size: 12px; color: #fff; font-weight: bold; text-shadow: 1px 1px 2px black; }

        /* --- MODALS --- */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 200; display: none; align-items: center; justify-content: center;
        }
        .modal-box {
            background: #1a1a1a; width: 85%; border-radius: 4px; overflow: hidden; border: 1px solid #444;
            display: flex; flex-direction: column;
        }
        .modal-header { background: #009be5; color: white; padding: 8px; font-weight: bold; font-size: 14px; text-align: center; }
        .menu-item { padding: 12px 10px; border-bottom: 1px solid #333; color: #ccc; font-size: 14px; }
        .menu-item.focused { background: #333; color: white; border-left: 4px solid #009be5; }

        #osd {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7); color: white; padding: 10px 20px; border-radius: 5px;
            font-size: 16px; z-index: 300; display: none; pointer-events: none;
        }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- HEADER -->
        <header id="header-bar">
            <div class="header-title">IP TV</div>
            <input type="text" id="search-input" placeholder="Search...">
        </header>

        <!-- MAIN LIST -->
        <main id="main-view"></main>

        <!-- FOOTER -->
        <footer id="footer-bar">
            <div class="soft-btn soft-left" id="sk-left"></div>
            <div class="soft-btn soft-center" id="sk-center"></div>
            <div class="soft-btn soft-right" id="sk-right"></div>
        </footer>

        <!-- PLAYER UI -->
        <div id="player-ui">
            <!-- Hidden Video Source -->
            <video id="video-source" playsinline crossorigin="anonymous"></video>
            
            <!-- Canvas Renderer -->
            <canvas id="video-canvas"></canvas>

            <!-- Top Overlay -->
            <div id="player-top">
                <div class="icon-btn" id="btn-back">
                    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                </div>
                <div class="p-title" id="p-title-text">Channel Name</div>
                <div class="icon-btn" id="btn-settings">
                    <svg viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98 0-.34-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.5.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98 0 .33.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
                </div>
            </div>

            <!-- Bottom Controls -->
            <div id="video-controls">
                <!-- Seek Bar -->
                <div class="ctrl-row">
                    <input type="range" id="seek-bar" value="0" min="0" max="100">
                </div>
                <!-- Buttons Row -->
                <div class="ctrl-row">
                    <div class="icon-btn" id="btn-play">
                         <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                    <div class="time-text" id="time-display">00:00 / 00:00</div>
                    
                    <div style="flex:1"></div> <!-- Spacer -->
                    
                    <!-- Volume -->
                    <svg style="width:16px; height:16px;" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                    <input type="range" id="vol-bar" value="100" min="0" max="100" style="width: 50px;">
                </div>
            </div>
        </div>

        <!-- MENU MODAL -->
        <div id="menu-modal" class="modal-overlay">
            <div class="modal-box">
                <div class="modal-header">Menu</div>
                <div id="menu-list"></div>
            </div>
        </div>

        <!-- OSD TOAST -->
        <div id="osd">Info</div>
        
        <input type="file" id="fileInput" accept=".m3u,.m3u8">
    </div>

    <script>
        // --- ASSETS & CONFIG ---
        const ICONS = {
            play: `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`,
            pause: `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`,
            menu: `<svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>`,
            search: `<svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>`,
            back: `<svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>`,
            close: `<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 17.59 13.41 12z"/></svg>`
        };

        const DEFAULT_PLAYLIST = `#EXTM3U
#EXTINF:-1,Big Buck Bunny
http://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8
#EXTINF:-1,Sintel (HLS)
https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8`;

        // --- STATE ---
        const State = {
            view: 'list', // list, menu, player, search
            channels: [], filtered: [], listIdx: 0, menuIdx: 0,
            // Player State
            pRot: 0, pZoom: 1.0, isPlaying: false, showControls: true, hls: null,
            ctrlTimeout: null
        };

        // --- DOM ELEMENTS ---
        const UI = {
            main: document.getElementById('main-view'),
            search: document.getElementById('search-input'),
            skL: document.getElementById('sk-left'),
            skC: document.getElementById('sk-center'),
            skR: document.getElementById('sk-right'),
            player: document.getElementById('player-ui'),
            video: document.getElementById('video-source'),
            canvas: document.getElementById('video-canvas'),
            ctx: document.getElementById('video-canvas').getContext('2d'),
            
            // Player Controls
            controls: document.getElementById('video-controls'),
            topBar: document.getElementById('player-top'),
            title: document.getElementById('p-title-text'),
            seekBar: document.getElementById('seek-bar'),
            volBar: document.getElementById('vol-bar'),
            btnPlay: document.getElementById('btn-play'),
            btnBack: document.getElementById('btn-back'),
            btnSet: document.getElementById('btn-settings'),
            timeDisplay: document.getElementById('time-display'),
            
            osd: document.getElementById('osd'),
            fileIn: document.getElementById('fileInput')
        };

        // --- INIT ---
        window.onload = () => {
            parseM3U(DEFAULT_PLAYLIST);
            updateSoftKeys();
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            startRenderLoop();
        };

        function resizeCanvas() {
            UI.canvas.width = UI.player.clientWidth;
            UI.canvas.height = UI.player.clientHeight;
        }

        // --- INPUT HANDLING (Unified) ---
        function handleInput(action) {
            // PLAYER MODE
            if (State.view === 'player') {
                showControlsTemp();
                if (action === 'back') closePlayer();
                if (action === 'enter') togglePlay();
                // D-Pad Player Controls
                if (action === 'right') seekVideo(10);
                if (action === 'left') seekVideo(-10);
                if (action === 'up') changeVol(0.1);
                if (action === 'down') changeVol(-0.1);
                return;
            }

            // LIST MODE
            if (State.view === 'list') {
                if (action === 'up') {
                    if (State.listIdx === 0 && UI.search.style.display === 'block') enterSearch();
                    else moveList(-1);
                }
                if (action === 'down') moveList(1);
                if (action === 'enter') playChannel(State.filtered[State.listIdx]);
                if (action === 'left') openMenu();
                if (action === 'right' || action === 'back') {
                    if (UI.search.style.display === 'block') closeSearch(); else enterSearch();
                }
            }
            
            // MENU MODE
            if (State.view === 'menu') {
                if (action === 'up') navMenu(-1);
                if (action === 'down') navMenu(1);
                if (action === 'enter') execMenu();
                if (action === 'back') closeMenu();
            }
            
            // SEARCH INPUT MODE
            if (State.view === 'search') {
                if (action === 'down' || action === 'enter') {
                    if (State.filtered.length > 0) { UI.search.blur(); State.view = 'list'; renderList(); }
                }
                if (action === 'back') closeSearch();
            }
        }

        document.addEventListener('keydown', (e) => {
            let key = e.key;
            let action = null;

            // Player Special Keys
            if (State.view === 'player') {
                if (key === '4') { State.pRot -= 90; showOSD("Rot -90"); return; }
                if (key === '6') { State.pRot += 90; showOSD("Rot +90"); return; }
                if (key === '1' || key === '*') { State.pZoom = Math.max(0.5, State.pZoom - 0.2); showOSD(`Zoom ${State.pZoom.toFixed(1)}`); return; }
                if (key === '3' || key === '#') { State.pZoom += 0.2; showOSD(`Zoom ${State.pZoom.toFixed(1)}`); return; }
            }

            if (key === 'ArrowUp') action = 'up';
            else if (key === 'ArrowDown') action = 'down';
            else if (key === 'ArrowLeft') action = 'left';
            else if (key === 'ArrowRight') action = 'right';
            else if (key === 'Enter') action = 'enter';
            else if (key === 'Escape' || key === 'F1') action = 'left';
            else if (key === 'SoftRight' || key === 'F2' || key === 'Backspace') action = 'right';
            window.addEventListener('back', function() {action = 'back'; });

            // Quick Search
            if (State.view === 'list' && key.length === 1 && /[a-z0-9]/i.test(key)) {
                enterSearch(); UI.search.value += key; triggerSearch(UI.search.value); return;
            }

            if (action) { e.preventDefault(); handleInput(action); }
        });

        // Soft Keys Touch
        UI.skL.onclick = () => handleInput('left');
        UI.skC.onclick = () => handleInput('enter');
        UI.skR.onclick = () => handleInput('right');

        // --- PLAYER LOGIC (CANVAS RENDERER) ---
        
        function startRenderLoop() {
            requestAnimationFrame(renderLoop);
        }

        function renderLoop() {
            if (State.view === 'player') {
                const ctx = UI.ctx;
                const v = UI.video;
                const cw = UI.canvas.width;
                const ch = UI.canvas.height;

                // Clear
                ctx.fillStyle = "#000";
                ctx.fillRect(0, 0, cw, ch);

                if (v.readyState >= 2) { // HAVE_CURRENT_DATA
                    // Calculate Fit
                    const vw = v.videoWidth;
                    const vh = v.videoHeight;
                    const scale = Math.min(cw / vw, ch / vh) * State.pZoom;
                    
                    const drawW = vw * scale;
                    const drawH = vh * scale;
                    const dx = (cw - drawW) / 2;
                    const dy = (ch - drawH) / 2;

                    ctx.save();
                    // Center pivot
                    ctx.translate(cw / 2, ch / 2);
                    ctx.rotate(State.pRot * Math.PI / 180);
                    ctx.translate(-cw / 2, -ch / 2);
                    
                    ctx.drawImage(v, dx, dy, drawW, drawH);
                    ctx.restore();
                }
            }
            requestAnimationFrame(renderLoop);
        }

        // --- CONTROLS LOGIC ---
        function playChannel(ch) {
            State.view = 'player';
            UI.player.style.display = 'block';
            document.getElementById('header-bar').style.display = 'none';
            document.getElementById('footer-bar').style.display = 'none';
            
            UI.title.textContent = ch.name;
            resizeCanvas();

            if (Hls.isSupported()) {
                if (State.hls) State.hls.destroy();
                State.hls = new Hls();
                State.hls.loadSource(ch.url);
                State.hls.attachMedia(UI.video);
                State.hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    UI.video.play().catch(e=>console.log(e));
                    State.isPlaying = true;
                    updatePlayBtn();
                });
            } else {
                UI.video.src = ch.url;
                UI.video.play();
                State.isPlaying = true;
                updatePlayBtn();
            }
            showControlsTemp();
        }

        function closePlayer() {
            UI.video.pause();
            UI.video.src = "";
            if(State.hls) { State.hls.destroy(); State.hls = null; }
            
            UI.player.style.display = 'none';
            document.getElementById('header-bar').style.display = 'flex';
            document.getElementById('footer-bar').style.display = 'flex';
            State.view = 'list';
            State.pZoom = 1.0; State.pRot = 0;
        }

        function togglePlay() {
            if (UI.video.paused) { UI.video.play(); State.isPlaying = true; }
            else { UI.video.pause(); State.isPlaying = false; }
            updatePlayBtn();
            showControlsTemp();
        }

        function updatePlayBtn() {
            UI.btnPlay.innerHTML = State.isPlaying ? ICONS.pause : ICONS.play;
        }

        function seekVideo(delta) {
            UI.video.currentTime += delta;
            showControlsTemp();
            showOSD((delta>0 ? ">> " : "<< ") + Math.abs(delta) + "s");
        }
        
        function changeVol(delta) {
            let v = UI.video.volume + delta;
            if (v < 0) v = 0; if (v > 1) v = 1;
            UI.video.volume = v;
            UI.volBar.value = v * 100;
            showOSD("Vol " + Math.round(v * 100) + "%");
            showControlsTemp();
        }

        // Update Slider & Time
        UI.video.addEventListener('timeupdate', () => {
            if (!isNaN(UI.video.duration)) {
                const pct = (UI.video.currentTime / UI.video.duration) * 100;
                UI.seekBar.value = pct;
                UI.timeDisplay.textContent = formatTime(UI.video.currentTime) + " / " + formatTime(UI.video.duration);
            }
        });

        // Seek Bar Input
        UI.seekBar.addEventListener('input', (e) => {
            const time = (UI.video.duration * e.target.value) / 100;
            UI.video.currentTime = time;
        });

        // Volume Bar Input
        UI.volBar.addEventListener('input', (e) => {
            UI.video.volume = e.target.value / 100;
        });

        // Show/Hide Controls
        function showControlsTemp() {
            UI.controls.classList.remove('hidden');
            UI.topBar.classList.remove('hidden');
            clearTimeout(State.ctrlTimeout);
            State.ctrlTimeout = setTimeout(() => {
                if (State.isPlaying) {
                    UI.controls.classList.add('hidden');
                    UI.topBar.classList.add('hidden');
                }
            }, 4000);
        }

        // Tap Canvas to toggle controls
        UI.canvas.addEventListener('click', () => {
            if (UI.controls.classList.contains('hidden')) showControlsTemp();
            else UI.controls.classList.add('hidden'); // Immediate hide
        });

        // UI Button Wiring
        UI.btnPlay.onclick = togglePlay;
        UI.btnBack.onclick = closePlayer;
        UI.btnSet.onclick = () => { showOSD("Settings: Use Keypad"); };

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${sec < 10 ? '0' : ''}${sec}`;
        }

        function showOSD(msg) {
            UI.osd.innerText = msg; UI.osd.style.display = 'block';
            setTimeout(() => UI.osd.style.display = 'none', 1500);
        }

        // --- LIST & MENU LOGIC (Minified) ---
        function parseM3U(d) {
            State.channels=[]; d.split('\n').forEach(l=>{
                l=l.trim(); if(l.startsWith('#EXTINF')) tempN=l.split(',')[1];
                else if(l.startsWith('http')) { State.channels.push({name:tempN||"Ch",url:l}); tempN=""; }
            }); State.filtered=State.channels; renderList();
        }
        function renderList() {
            UI.main.innerHTML=''; const c=document.createElement('div');
            State.filtered.forEach((ch,i)=>{
                const e=document.createElement('div'); e.className='list-item '+(i===State.listIdx?'focused':'');
                e.innerText=ch.name; e.onclick=()=>{State.listIdx=i;renderList();playChannel(ch);}; c.appendChild(e);
            }); UI.main.appendChild(c);
            const f=c.querySelector('.focused'); if(f) f.scrollIntoView({block:'center'});
        }
        function moveList(d) {
            const n = State.listIdx + d;
            if (n >= 0 && n < State.filtered.length) { State.listIdx = n; renderList(); }
        }
        function enterSearch() { State.view='search'; UI.search.style.display='block'; UI.search.focus(); updateSoftKeys(); }
        function closeSearch() { State.view='list'; UI.search.style.display='none'; UI.search.value=''; State.filtered=State.channels; State.listIdx=0; renderList(); updateSoftKeys(); }
        function triggerSearch(t) { State.filtered=State.channels.filter(c=>c.name.toLowerCase().includes(t.toLowerCase())); State.listIdx=0; renderList(); }
        UI.search.addEventListener('input',e=>triggerSearch(e.target.value));
        
        // Menu
        const M_ITEMS = [
            {t:'Load File',a:()=>UI.fileIn.click()},
            {t:'Reload',a:()=>parseM3U(DEFAULT_PLAYLIST)},
            {t:'About',a:()=>showOSD("Canvas Player v1")}
        ];
        function openMenu(){
            State.view='menu'; document.getElementById('menu-modal').style.display='flex';
            const l=document.getElementById('menu-list'); l.innerHTML='';
            M_ITEMS.forEach((it,i)=>{
                const d=document.createElement('div'); d.className='menu-item '+(i===0?'focused':'');
                d.innerText=it.t; d.onclick=()=>{State.menuIdx=i;execMenu();}; l.appendChild(d);
            }); State.menuIdx=0; updateSoftKeys();
        }
        function navMenu(d){
            const el=document.querySelectorAll('.menu-item'); el[State.menuIdx].classList.remove('focused');
            State.menuIdx=(State.menuIdx+d+el.length)%el.length; el[State.menuIdx].classList.add('focused');
        }
        function execMenu(){ closeMenu(); M_ITEMS[State.menuIdx].a(); }
        function closeMenu(){ State.view='list'; document.getElementById('menu-modal').style.display='none'; updateSoftKeys(); }
        
        function updateSoftKeys() {
            if(State.view==='search'){UI.skL.innerHTML="";UI.skC.innerHTML="GO";UI.skR.innerHTML=ICONS.close;}
            else if(State.view==='menu'){UI.skL.innerHTML="";UI.skC.innerHTML="OK";UI.skR.innerHTML=ICONS.back;}
            else{UI.skL.innerHTML=ICONS.menu;UI.skC.innerHTML="PLAY";UI.skR.innerHTML=UI.search.style.display==='block'?ICONS.back:ICONS.search;}
        }
