<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Touch IPTV Player (Native)</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* --- RESET & BASIC --- */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; outline: none; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; overflow: hidden; }

        /* --- CONTAINER --- */
        #app-container { width: 100%; height: 100%; max-width: 480px; background-color: #000; position: relative; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 0 30px rgba(0,0,0,0.8); }

        /* --- HEADER --- */
        header { height: 50px; background-color: #202020; display: flex; align-items: center; padding: 0 15px; border-bottom: 2px solid #009be5; z-index: 10; position: relative; }
        .header-title { font-size: 18px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #search-input { width: 100%; height: 36px; background: #fff; border: 2px solid #009be5; color: #000; font-size: 16px; padding: 0 10px; border-radius: 4px; display: none; position: absolute; left: 0; top: 7px; right: 0; margin: 0 10px; z-index: 20; }

        /* --- MAIN VIEW --- */
        main { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
        
        /* List Style */
        .list-container { display: flex; flex-direction: column; padding-bottom: 20px;}
        .list-item { padding: 15px 15px; font-size: 16px; border-bottom: 1px solid #333; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: background 0.2s;}
        .list-item:active { background-color: #333; }
        .list-item img { width: 40px; height: 40px; object-fit: contain; border-radius: 4px; background: #fff; }

        /* --- NATIVE PLAYER CONTAINER --- */
        #native-player-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 100; display: none; flex-direction: column; }
        
        /* Close Button for Player */
        #player-header { position: absolute; top: 0; left: 0; width: 100%; padding: 10px; z-index: 110; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); display: flex; justify-content: flex-start; pointer-events: none; }
        #btn-close-player { pointer-events: auto; background: rgba(255, 255, 255, 0.2); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(5px); }
        #btn-close-player svg { width: 24px; height: 24px; fill: white; }

        /* Video Element */
        video { width: 100%; height: 100%; display: block; object-fit: contain; }

        /* --- FOOTER --- */
        footer { height: 50px; background-color: #1a1a1a; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; border-top: 1px solid #333; z-index: 20; }
        .soft-btn { min-width: 50px; height: 100%; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; }
        .soft-btn:active { opacity: 0.7; }
        svg { fill: white; width: 26px; height: 26px; pointer-events: none; }

        /* --- MODALS --- */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
        .modal-box { background: #222; width: 85%; max-height: 70%; border-radius: 12px; overflow-y: auto; border: 1px solid #444; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-header { background: #009be5; color: white; padding: 15px; font-weight: bold; font-size: 16px; text-align: center; }
        .menu-item { padding: 15px; border-bottom: 1px solid #333; color: #eee; font-size: 15px; cursor: pointer; }
        .menu-item:active { background: #333; }

        #osd { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(50,50,50,0.9); color: white; padding: 8px 20px; border-radius: 20px; font-size: 14px; z-index: 300; display: none; pointer-events: none; text-align: center; border: 1px solid #555;}
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- HEADER -->
        <header id="header-bar">
            <div class="header-title">IPTV Player</div>
            <input type="text" id="search-input" placeholder="Search channel...">
        </header>

        <!-- MAIN VIEW -->
        <main id="main-view"></main>

        <!-- FOOTER -->
        <footer id="footer-bar">
            <div class="soft-btn soft-left" id="sk-left"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></div>
            <div class="soft-btn soft-right" id="sk-right"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></div>
        </footer>

        <!-- NATIVE PLAYER UI -->
        <div id="native-player-container">
            <div id="player-header">
                <div id="btn-close-player">
                    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                </div>
            </div>
            <!-- 'controls' attribute enables native player -->
            <video id="video-source" controls playsinline></video>
        </div>

        <!-- MENU/QUALITY MODAL -->
        <div id="menu-modal" class="modal-overlay">
            <div class="modal-box">
                <div class="modal-header" id="modal-title">Menu</div>
                <div id="menu-list"></div>
            </div>
        </div>

        <!-- OSD TOAST -->
        <div id="osd">Info</div>
        <input type="file" id="fileInput" accept=".m3u,.m3u8,.txt">
    </div>

    <script>
        const DEFAULT_PLAYLIST = `#EXTM3U
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/c/c5/Big_buck_bunny_poster_big.jpg",Example Channel
http://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8`;

        const LS_KEY = 'touch_iptv_data';

        const State = {
            view: 'list', 
            channels: [], filtered: [], 
            hls: null
        };

        const UI = {
            main: document.getElementById('main-view'),
            headerTitle: document.querySelector('.header-title'),
            search: document.getElementById('search-input'),
            skL: document.getElementById('sk-left'), 
            skR: document.getElementById('sk-right'),
            playerContainer: document.getElementById('native-player-container'), 
            video: document.getElementById('video-source'), 
            btnClose: document.getElementById('btn-close-player'),
            modal: document.getElementById('menu-modal'), 
            mList: document.getElementById('menu-list'),
            osd: document.getElementById('osd'), 
            fileIn: document.getElementById('fileInput')
        };

        window.onload = () => {
            const saved = localStorage.getItem(LS_KEY);
            parseM3U(saved ? saved : DEFAULT_PLAYLIST);
        };

        // --- PLAYER LOGIC (NATIVE) ---
        function playChannel(ch) {
            State.view = 'player';
            UI.playerContainer.style.display = 'flex';
            document.getElementById('header-bar').style.display = 'none';
            document.getElementById('footer-bar').style.display = 'none';
            
            const hlsConfig = {};
            if (ch.headers && Object.keys(ch.headers).length > 0) {
                hlsConfig.xhrSetup = (xhr) => {
                    for (const [key, value] of Object.entries(ch.headers)) xhr.setRequestHeader(key, value);
                };
            }

            if (Hls.isSupported()) {
                if (State.hls) State.hls.destroy();
                State.hls = new Hls(hlsConfig);
                State.hls.loadSource(ch.url);
                State.hls.attachMedia(UI.video);
                State.hls.on(Hls.Events.MANIFEST_PARSED, () => { 
                    UI.video.play().catch(e => console.log("Autoplay blocked")); 
                });
                State.hls.on(Hls.Events.ERROR, (e, data) => { if(data.fatal) showOSD("Stream Error"); });
            } else {
                // Native HLS support (Safari/iOS)
                UI.video.src = ch.url; 
                UI.video.play();
            }
        }

        function closePlayer() {
            UI.video.pause(); 
            UI.video.src = "";
            UI.video.removeAttribute('src'); // Clean cleanup
            if (State.hls) { State.hls.destroy(); State.hls = null; }
            
            UI.playerContainer.style.display = 'none';
            document.getElementById('header-bar').style.display = 'flex';
            document.getElementById('footer-bar').style.display = 'flex';
            State.view = 'list';
        }

        // --- LIST RENDER ---
        function renderList() {
            UI.main.innerHTML = '';
            const container = document.createElement('div');
            container.className = 'list-container';
            State.filtered.forEach((ch) => {
                const div = document.createElement('div');
                div.className = 'list-item';
                if(ch.logo) div.innerHTML += `<img src="${ch.logo}" onerror="this.style.display='none'">`;
                div.innerHTML += `<span>${ch.name}</span>`;
                // Simple Click to Play
                div.onclick = () => { playChannel(ch); };
                container.appendChild(div);
            });
            UI.main.appendChild(container);
        }

        // --- PARSER ---
        function parseM3U(data, save = false) {
            if (save) try { localStorage.setItem(LS_KEY, data); } catch(e){}
            State.channels = [];
            const lines = data.split('\n');
            let tempCh = {};
            for(let i=0; i<lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF')) {
                    tempCh = { headers: {} }; 
                    const logo = line.match(/tvg-logo="([^"]*)"/);
                    tempCh.logo = logo ? logo[1] : null;
                    tempCh.name = line.split(',').pop().trim();
                } else if (line.startsWith('http')) {
                    if(line.includes('|')) {
                        const p = line.split('|');
                        tempCh.url = p[0];
                        if(p[1].includes('User-Agent=')) tempCh.headers['User-Agent'] = p[1].match(/User-Agent=([^&]*)/)[1];
                    } else tempCh.url = line;
                    if(tempCh.name) State.channels.push(tempCh);
                }
            }
            State.filtered = State.channels; renderList();
        }

        // --- UI ACTIONS ---
        function openMenu() { State.view = 'menu'; UI.modal.style.display = 'flex'; renderMenu(); }
        function closeMenu() { State.view = 'list'; UI.modal.style.display = 'none'; }
        UI.modal.addEventListener('click', (e) => { if(e.target === UI.modal) closeMenu(); });

        function renderMenu() {
            UI.mList.innerHTML = '';
            [{ t: 'Load Playlist', a: () => UI.fileIn.click() }, { t: 'Reset', a: () => { localStorage.removeItem(LS_KEY); parseM3U(DEFAULT_PLAYLIST); closeMenu(); }}]
            .forEach(it => {
                const d = document.createElement('div'); d.className = 'menu-item'; d.innerText = it.t;
                d.onclick = it.a; UI.mList.appendChild(d);
            });
        }
        
        function showOSD(m) { UI.osd.innerText = m; UI.osd.style.display = 'block'; setTimeout(()=>UI.osd.style.display='none', 2000); }

        // --- EVENT BINDINGS (TOUCH ONLY) ---
        UI.skL.onclick = openMenu;
        UI.skR.onclick = () => { 
            if(UI.search.style.display === 'block') {
                UI.search.style.display = 'none';
                State.filtered = State.channels;
                renderList();
            } else {
                State.view='search'; 
                UI.search.style.display='block'; 
                UI.search.focus(); 
            }
        };
        
        UI.search.addEventListener('input', (e) => {
            const t = e.target.value.toLowerCase();
            State.filtered = State.channels.filter(c => c.name.toLowerCase().includes(t));
            renderList();
        });
        
        UI.btnClose.onclick = closePlayer;
        UI.fileIn.onchange = e => { const r=new FileReader(); r.onload=v=> { parseM3U(v.target.result, true); closeMenu(); }; r.readAsText(e.target.files[0]); };

    </script>
</body>
</html>
