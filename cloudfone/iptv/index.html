<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Canvas IP TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* --- RESET & BASIC --- */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; outline: none; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #222; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; overflow: hidden; }

        /* --- CONTAINER --- */
        #app-container { width: 100%; height: 100%; max-width: 240px; max-height: 320px; background-color: #000; position: relative; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 0 30px rgba(0,0,0,0.8); }

        /* --- HEADER --- */
        header { height: 28px; background-color: #202020; display: flex; align-items: center; padding: 0 8px; border-bottom: 2px solid #009be5; z-index: 10; position: relative; }
        .header-title { font-size: 14px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #search-input { width: 100%; height: 22px; background: #fff; border: 2px solid #009be5; color: #000; font-size: 12px; padding: 0 5px; border-radius: 2px; display: none; position: absolute; left: 0; top: 3px; right: 0; margin: 0 4px; z-index: 20; }

        /* --- MAIN VIEW (List & Grid) --- */
        main { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; scroll-behavior: smooth; }
        
        /* List Style */
        .list-container { display: flex; flex-direction: column; }
        .list-item { padding: 10px 12px; font-size: 16px; border-bottom: 1px solid #222; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
        .list-item.focused { background-color: #009be5; color: #fff; font-weight: 600; }

        /* Grid Style - Optimized for Small Screens */
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); /* Strictly 3 columns */
            gap: 2px; 
            padding: 2px; 
            width: 100%;
        }
        .grid-item { 
            background: #333; 
            aspect-ratio: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            border-radius: 3px; 
            border: 2px solid transparent; 
            cursor: pointer; 
            overflow: hidden;
            padding: 2px;
        }
        .grid-item img { 
            width: 80%; 
            height: 60%; 
            object-fit: contain; 
            margin-bottom: 2px; 
        }
        .grid-item span { 
            font-size: 9px; /* Smaller font for grid */
            text-align: center; 
            width: 100%; 
            overflow: hidden; 
            white-space: nowrap; 
            text-overflow: ellipsis; 
            line-height: 1.1;
        }
        .grid-item.focused { border-color: #009be5; background: #444; }
        .grid-placeholder { width: 30px; height: 30px; background: #555; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; color: #888; margin-bottom: 2px;}

        /* --- FOOTER --- */
        footer { height: 36px; background-color: #000; display: flex; justify-content: space-between; align-items: center; padding: 0 8px; border-top: 1px solid #333; z-index: 20; }
        .soft-btn { min-width: 30px; height: 100%; display: flex; align-items: center; color: white; font-weight: 600; font-size: 12px; }
        .soft-center { flex: 1; justify-content: center; font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        svg { fill: white; width: 20px; height: 20px; pointer-events: none; }

        /* --- PLAYER UI --- */
        #player-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 100; display: none; }
        video { display: none; } 
        canvas { width: 100%; height: 100%; display: block; }
        
        #video-controls, #player-top { position: absolute; width: 100%; background: rgba(0,0,0,0.7); z-index: 110; transition: opacity 0.3s; display: flex; }
        #video-controls { bottom: 0; left: 0; padding: 5px; flex-direction: column; gap: 4px; }
        #player-top { top: 0; left: 0; padding: 5px; justify-content: space-between; background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent); }
        .hidden { opacity: 0; pointer-events: none; }

        .ctrl-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .time-text { font-size: 10px; color: #ddd; min-width: 60px; }
        input[type=range] { -webkit-appearance: none; width: 100%; height: 4px; background: #555; border-radius: 2px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: #009be5; border-radius: 50%; }
        .icon-btn { width: 24px; height: 24px; padding: 2px; cursor: pointer; }
        .p-title { font-size: 12px; color: #fff; font-weight: bold; text-shadow: 1px 1px 2px black; }

        /* --- MODALS --- */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 200; display: none; align-items: center; justify-content: center; }
        .modal-box { background: #1a1a1a; width: 85%; max-height: 80%; border-radius: 4px; overflow-y: auto; border: 1px solid #444; display: flex; flex-direction: column; }
        .modal-header { background: #009be5; color: white; padding: 8px; font-weight: bold; font-size: 14px; text-align: center; }
        .menu-item { padding: 12px 10px; border-bottom: 1px solid #333; color: #ccc; font-size: 14px; }
        .menu-item.focused { background: #333; color: white; border-left: 4px solid #009be5; }

        #osd { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.7); color: white; padding: 10px 20px; border-radius: 5px; font-size: 16px; z-index: 300; display: none; pointer-events: none; text-align: center;}
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- HEADER -->
        <header id="header-bar">
            <div class="header-title">Canvas IP TV</div>
            <input type="text" id="search-input" placeholder="Search...">
        </header>

        <!-- MAIN VIEW (Holds List or Grid) -->
        <main id="main-view"></main>

        <!-- FOOTER -->
        <footer id="footer-bar">
            <div class="soft-btn soft-left" id="sk-left"></div>
            <div class="soft-btn soft-center" id="sk-center"></div>
            <div class="soft-btn soft-right" id="sk-right"></div>
        </footer>

        <!-- PLAYER UI -->
        <div id="player-ui">
            <video id="video-source" playsinline crossorigin="anonymous"></video>
            <canvas id="video-canvas"></canvas>

            <div id="player-top">
                <div class="icon-btn" id="btn-back"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></div>
                <div class="p-title" id="p-title-text">Channel</div>
                <div class="icon-btn" id="btn-settings"><svg viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98 0-.34-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.5.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98 0 .33.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg></div>
            </div>

            <div id="video-controls">
                <div class="ctrl-row">
                    <input type="range" id="seek-bar" value="0" min="0" max="100">
                </div>
                <div class="ctrl-row">
                    <div class="icon-btn" id="btn-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
                    <div class="time-text" id="time-display">00:00</div>
                    <div style="flex:1"></div>
                    <svg style="width:16px; height:16px;" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                    <input type="range" id="vol-bar" value="100" min="0" max="100" style="width: 50px;">
                </div>
            </div>
        </div>

        <!-- MENU/QUALITY MODAL -->
        <div id="menu-modal" class="modal-overlay">
            <div class="modal-box">
                <div class="modal-header" id="modal-title">Menu</div>
                <div id="menu-list"></div>
            </div>
        </div>

        <!-- OSD TOAST -->
        <div id="osd">Info</div>
        <input type="file" id="fileInput" accept=".m3u,.m3u8">
    </div>

    <script>
        // --- ASSETS ---
        const ICONS = {
            play: `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`,
            pause: `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`,
            menu: `<svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>`,
            search: `<svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>`,
            back: `<svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>`,
            close: `<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 17.59 13.41 12z"/></svg>`
        };

        const DEFAULT_PLAYLIST = `#EXTM3U
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/c/c5/Big_buck_bunny_poster_big.jpg",Big Buck Bunny
http://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/en/8/82/Sintel_poster.jpg",Sintel (HLS)
https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8`;

        const LS_KEY = 'canvas_iptv_data';

        // --- STATE ---
        const State = {
            view: 'list', // list, menu, player, search
            layout: 'list', // 'list' or 'grid'
            channels: [], filtered: [], listIdx: 0, menuIdx: 0,
            // Player
            pRot: 0, pZoom: 1.0, isPlaying: false, hls: null, ctrlTimeout: null
        };

        // --- DOM ---
        const UI = {
            main: document.getElementById('main-view'),
            headerTitle: document.querySelector('.header-title'),
            search: document.getElementById('search-input'),
            skL: document.getElementById('sk-left'), skC: document.getElementById('sk-center'), skR: document.getElementById('sk-right'),
            player: document.getElementById('player-ui'), video: document.getElementById('video-source'), canvas: document.getElementById('video-canvas'), ctx: document.getElementById('video-canvas').getContext('2d'),
            controls: document.getElementById('video-controls'), topBar: document.getElementById('player-top'), title: document.getElementById('p-title-text'),
            btnPlay: document.getElementById('btn-play'), btnBack: document.getElementById('btn-back'), btnSet: document.getElementById('btn-settings'),
            modal: document.getElementById('menu-modal'), mList: document.getElementById('menu-list'), mTitle: document.getElementById('modal-title'),
            osd: document.getElementById('osd'), fileIn: document.getElementById('fileInput')
        };

        // --- INIT ---
        window.onload = () => {
            // Load saved playlist if exists, else default
            const saved = localStorage.getItem(LS_KEY);
            if (saved) {
                parseM3U(saved);
                showOSD("Loaded Saved Playlist");
            } else {
                parseM3U(DEFAULT_PLAYLIST);
            }
            
            updateSoftKeys();
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            startRenderLoop();
        };

        function resizeCanvas() {
            UI.canvas.width = UI.player.clientWidth;
            UI.canvas.height = UI.player.clientHeight;
        }

        // --- GLOBAL EVENT LISTENERS ---
        window.addEventListener('back', (e) => {
            e.preventDefault();
            handleInput('back');
        });

        document.addEventListener('keydown', (e) => {
            let key = e.key;
            let action = null;

            if (State.view === 'player') {
                if (key === '4') { State.pRot -= 90; showOSD("Rot -90"); return; }
                if (key === '6') { State.pRot += 90; showOSD("Rot +90"); return; }
                if (key === '1' || key === '*') { State.pZoom = Math.max(0.5, State.pZoom - 0.2); showOSD(`Zoom ${State.pZoom.toFixed(1)}`); return; }
                if (key === '3' || key === '#') { State.pZoom += 0.2; showOSD(`Zoom ${State.pZoom.toFixed(1)}`); return; }
            }

            if (key === 'ArrowUp') action = 'up';
            else if (key === 'ArrowDown') action = 'down';
            else if (key === 'ArrowLeft') action = State.view === 'list' && State.layout === 'grid' ? 'left' : 'seekleft';
            else if (key === 'ArrowRight') action = 'right';
            else if (key === 'Enter') action = 'enter';
            else if (key === 'Escape' || key === 'Backspace') action = 'back';
            else if (key === 'SoftRight') action = 'back';
            else if (key === 'SoftLeft' || key === 'F1') action = 'menu';

            if (State.view === 'list' && key.length === 1 && /[a-z0-9]/i.test(key)) {
                enterSearch(); UI.search.value += key; triggerSearch(UI.search.value); return;
            }

            if (action) { e.preventDefault(); handleInput(action); }
        });

        // --- INPUT ROUTER ---
        function handleInput(action) {
            
            // --- PLAYER ---
            if (State.view === 'player') {
                showControlsTemp();
                if (action === 'back') closePlayer();
                if (action === 'enter') togglePlay();
                if (action === 'right') seekVideo(10);
                if (action === 'seekleft') seekVideo(-10);
                if (action === 'up') changeVol(0.1);
                if (action === 'down') changeVol(-0.1);
                if (action === 'menu') openQualityMenu(); 
                return;
            }

            // --- LIST / GRID ---
            if (State.view === 'list') {
                const isGrid = State.layout === 'grid';
                
                if (action === 'up') {
                    if (State.listIdx === 0 && UI.search.style.display === 'block') enterSearch();
                    else moveList(isGrid ? -3 : -1);
                }
                if (action === 'down') moveList(isGrid ? 3 : 1);
                
                if (action === 'left') {
                    if (isGrid) moveList(-1); 
                    else openMenu();
                }
                
                if (action === 'right') {
                     if (isGrid) moveList(1);
                     else if (UI.search.style.display === 'block') closeSearch(); else enterSearch();
                }

                if (action === 'enter') playChannel(State.filtered[State.listIdx]);
                if (action === 'menu') openMenu();
                if (action === 'back') {
                    if (UI.search.style.display === 'block') closeSearch();
                }
                return;
            }

            // --- MENUS ---
            if (State.view === 'menu' || State.view === 'quality') {
                if (action === 'up') navMenu(-1);
                if (action === 'down') navMenu(1);
                if (action === 'enter') execMenu();
                if (action === 'back') closeMenu();
                return;
            }

            // --- SEARCH ---
            if (State.view === 'search') {
                if (action === 'down' || action === 'enter') {
                    if (State.filtered.length > 0) { UI.search.blur(); State.view = 'list'; renderList(); }
                }
                if (action === 'back') closeSearch();
            }
        }

        // --- RENDER LOGIC ---
        function renderList() {
            UI.main.innerHTML = '';
            
            const container = document.createElement('div');
            container.className = State.layout === 'grid' ? 'grid-container' : 'list-container';

            State.filtered.forEach((ch, i) => {
                const div = document.createElement('div');
                const focused = i === State.listIdx;
                div.className = (State.layout === 'grid' ? 'grid-item' : 'list-item') + (focused ? ' focused' : '');
                
                if (State.layout === 'grid') {
                    // Grid Content
                    if (ch.logo) {
                        const img = document.createElement('img');
                        img.src = ch.logo;
                        div.appendChild(img);
                    } else {
                        const ph = document.createElement('div');
                        ph.className = 'grid-placeholder';
                        ph.innerText = ch.name.substring(0,1).toUpperCase();
                        div.appendChild(ph);
                    }
                    const span = document.createElement('span');
                    span.innerText = ch.name;
                    div.appendChild(span);
                } else {
                    // List Content
                    div.innerText = ch.name;
                }

                div.onclick = () => { State.listIdx = i; renderList(); playChannel(ch); };
                container.appendChild(div);
            });
            UI.main.appendChild(container);
            
            const f = container.querySelector('.focused');
            if (f) {
                f.scrollIntoView({ block: 'center' });
                // Show title in header if Grid mode
                UI.headerTitle.innerText = State.filtered[State.listIdx].name;
            }
        }

        function moveList(delta) {
            const n = State.listIdx + delta;
            if (n >= 0 && n < State.filtered.length) {
                State.listIdx = n;
                renderList();
            }
        }

        // --- MENU LOGIC ---
        function openMenu() {
            State.view = 'menu';
            UI.mTitle.innerText = "Main Menu";
            UI.modal.style.display = 'flex';
            
            const items = [
                { t: 'Toggle View (List/Grid)', a: () => { State.layout = State.layout === 'list' ? 'grid' : 'list'; closeMenu(); renderList(); } },
                { t: 'Load M3U File', a: () => UI.fileIn.click() },
                { t: 'Restore Default Playlist', a: () => { localStorage.removeItem(LS_KEY); parseM3U(DEFAULT_PLAYLIST); showOSD("Restored Default"); } },
                { t: 'About', a: () => showOSD("IPTV v2.1") }
            ];
            renderMenuOptions(items);
        }

        function openQualityMenu() {
             if (!State.hls || State.hls.levels.length === 0) {
                 showOSD("No Qualities");
                 return;
             }
             State.view = 'quality';
             UI.mTitle.innerText = "Video Quality";
             UI.modal.style.display = 'flex';
             
             const levels = State.hls.levels.map((l, i) => ({
                 t: `${l.height}p (${Math.round(l.bitrate/1000)}k)`,
                 a: () => { State.hls.currentLevel = i; showOSD("Quality: " + l.height + "p"); }
             }));
             levels.unshift({ t: "Auto", a: () => { State.hls.currentLevel = -1; showOSD("Quality: Auto"); }});
             
             renderMenuOptions(levels);
        }

        let currentMenuItems = [];
        function renderMenuOptions(items) {
            currentMenuItems = items;
            UI.mList.innerHTML = '';
            items.forEach((it, i) => {
                const d = document.createElement('div');
                d.className = 'menu-item ' + (i === 0 ? 'focused' : '');
                d.innerText = it.t; 
                d.onclick = () => { State.menuIdx = i; execMenu(); };
                UI.mList.appendChild(d);
            });
            State.menuIdx = 0;
        }

        function navMenu(d) {
            const el = document.querySelectorAll('.menu-item');
            el[State.menuIdx].classList.remove('focused');
            State.menuIdx = (State.menuIdx + d + el.length) % el.length;
            el[State.menuIdx].classList.add('focused');
        }

        function execMenu() { 
            closeMenu(); 
            currentMenuItems[State.menuIdx].a(); 
        }

        function closeMenu() { 
            State.view = State.isPlaying ? 'player' : 'list'; 
            UI.modal.style.display = 'none'; 
            updateSoftKeys(); 
        }

        // --- PLAYER LOGIC ---
        function playChannel(ch) {
            State.view = 'player';
            UI.player.style.display = 'block';
            document.getElementById('header-bar').style.display = 'none';
            document.getElementById('footer-bar').style.display = 'none';
            UI.title.textContent = ch.name;
            resizeCanvas();

            if (Hls.isSupported()) {
                if (State.hls) State.hls.destroy();
                State.hls = new Hls();
                State.hls.loadSource(ch.url);
                State.hls.attachMedia(UI.video);
                State.hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    UI.video.play().catch(e=>console.log(e));
                    State.isPlaying = true; updatePlayBtn();
                });
            } else {
                UI.video.src = ch.url; UI.video.play();
                State.isPlaying = true; updatePlayBtn();
            }
            showControlsTemp();
        }

        function closePlayer() {
            UI.video.pause(); UI.video.src = "";
            if (State.hls) { State.hls.destroy(); State.hls = null; }
            UI.player.style.display = 'none';
            document.getElementById('header-bar').style.display = 'flex';
            document.getElementById('footer-bar').style.display = 'flex';
            State.view = 'list';
            State.pZoom = 1.0; State.pRot = 0;
            UI.headerTitle.innerText = "Canvas IP TV"; 
        }

        // --- HELPERS ---
        function parseM3U(d, saveToStore = false) {
            if (saveToStore) {
                try {
                    localStorage.setItem(LS_KEY, d);
                    showOSD("Playlist Saved");
                } catch(e) { showOSD("Save Failed"); }
            }

            State.channels = [];
            let tempInf = {};
            d.split('\n').forEach(l => {
                l = l.trim();
                if (l.startsWith('#EXTINF')) {
                    const logo = l.match(/tvg-logo="([^"]*)"/);
                    tempInf.logo = logo ? logo[1] : null;
                    tempInf.name = l.split(',')[1] || "Channel";
                } else if (l.startsWith('http')) {
                    State.channels.push({ name: tempInf.name, logo: tempInf.logo, url: l });
                    tempInf = {};
                }
            });
            State.filtered = State.channels;
            renderList();
        }

        function startRenderLoop() { requestAnimationFrame(renderLoop); }
        function renderLoop() {
            if (State.view === 'player') {
                const ctx = UI.ctx;
                ctx.fillStyle = "#000"; ctx.fillRect(0,0,UI.canvas.width,UI.canvas.height);
                if (UI.video.readyState >= 2) {
                    const cw = UI.canvas.width, ch = UI.canvas.height;
                    const vw = UI.video.videoWidth, vh = UI.video.videoHeight;
                    const scale = Math.min(cw/vw, ch/vh) * State.pZoom;
                    const dw = vw * scale, dh = vh * scale;
                    ctx.save();
                    ctx.translate(cw/2, ch/2); ctx.rotate(State.pRot * Math.PI/180); ctx.translate(-cw/2, -ch/2);
                    ctx.drawImage(UI.video, (cw-dw)/2, (ch-dh)/2, dw, dh);
                    ctx.restore();
                }
            }
            requestAnimationFrame(renderLoop);
        }

        function showOSD(m) { UI.osd.innerText = m; UI.osd.style.display = 'block'; setTimeout(()=>UI.osd.style.display='none', 1500); }
        function showControlsTemp() {
            UI.controls.classList.remove('hidden'); UI.topBar.classList.remove('hidden');
            clearTimeout(State.ctrlTimeout);
            State.ctrlTimeout = setTimeout(() => { if (State.isPlaying) { UI.controls.classList.add('hidden'); UI.topBar.classList.add('hidden'); } }, 4000);
        }
        function togglePlay() { if(UI.video.paused) UI.video.play(); else UI.video.pause(); State.isPlaying = !UI.video.paused; updatePlayBtn(); showControlsTemp(); }
        function updatePlayBtn() { UI.btnPlay.innerHTML = State.isPlaying ? ICONS.pause : ICONS.play; }
        function seekVideo(d) { UI.video.currentTime += d; showControlsTemp(); }
        function changeVol(d) { UI.video.volume = Math.max(0, Math.min(1, UI.video.volume + d)); UI.volBar.value = UI.video.volume*100; showOSD("Vol "+Math.round(UI.video.volume*100)+"%"); showControlsTemp(); }
        
        UI.video.addEventListener('timeupdate', () => { if(!isNaN(UI.video.duration)) { UI.seekBar.value = (UI.video.currentTime/UI.video.duration)*100; document.getElementById('time-display').innerText = Math.floor(UI.video.currentTime/60)+":"+Math.floor(UI.video.currentTime%60); } });
        
        function updateSoftKeys() {
            if (State.view === 'search') { UI.skL.innerHTML = ""; UI.skC.innerHTML = "GO"; UI.skR.innerHTML = ICONS.close; }
            else if (State.view === 'menu' || State.view === 'quality') { UI.skL.innerHTML = ""; UI.skC.innerHTML = "OK"; UI.skR.innerHTML = ICONS.back; }
            else { UI.skL.innerHTML = ICONS.menu; UI.skC.innerHTML = "PLAY"; UI.skR.innerHTML = UI.search.style.display==='block'?ICONS.back:ICONS.search; }
        }
        
        UI.skL.onclick = () => handleInput('menu');
        UI.skC.onclick = () => handleInput('enter');
        UI.skR.onclick = () => handleInput(State.view==='list'&&UI.search.style.display!=='block'?'right':'back');
        UI.btnSet.onclick = openQualityMenu;
        UI.btnBack.onclick = closePlayer;
        
        // Handle File Input & Persistence
        UI.fileIn.onchange = e => { 
            const f=e.target.files[0]; 
            if(f){
                const r=new FileReader();
                r.onload=v => parseM3U(v.target.result, true); // True to save
                r.readAsText(f);
            } 
        };

        function enterSearch() { State.view = 'search'; UI.search.style.display='block'; UI.search.focus(); updateSoftKeys(); }
        function closeSearch() { State.view = 'list'; UI.search.style.display='none'; UI.search.value=''; State.filtered=State.channels; renderList(); updateSoftKeys(); }
        function triggerSearch(t) { State.filtered=State.channels.filter(c=>c.name.toLowerCase().includes(t.toLowerCase())); State.listIdx=0; renderList(); }
        UI.search.addEventListener('input', e=>triggerSearch(e.target.value));

    </script>
</body>
</html>
