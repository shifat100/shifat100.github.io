<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Canvas IP TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* --- RESET & BASIC --- */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; outline: none; }
        body { font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #222; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; overflow: hidden; }
        
        /* --- CONTAINER --- */
        #app-container { width: 100%; height: 100%; max-width: 240px; max-height: 320px; background-color: #000; position: relative; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 0 30px rgba(0, 0, 0, 0.8); }

        /* --- HEADER --- */
        header { height: 28px; background-color: #202020; display: flex; align-items: center; padding: 0 8px; border-bottom: 2px solid #009be5; z-index: 10; position: relative; }
        .header-title { font-size: 14px; font-weight: 600; flex: 1; }
        #search-input { width: 100%; height: 22px; background: #fff; border: 2px solid #009be5; color: #000; font-size: 12px; padding: 0 5px; border-radius: 2px; display: none; position: absolute; left: 0; top: 3px; right: 0; margin: 0 4px; z-index: 20; }

        main { flex: 1; overflow-y: auto; display: block; position: relative; }

        /* --- LIST VIEW --- */
        .list-container { display: flex; flex-direction: column; }
        .list-item { padding: 10px 12px; font-size: 16px; border-bottom: 1px solid #222; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
        .list-item.focused { background-color: #009be5; color: #fff; font-weight: 600; }

        /* --- GRID VIEW --- */
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; }
        .grid-item { background-color: #333; border: 2px solid transparent; border-radius: 4px; height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px; text-align: center; }
        .grid-item.focused { border-color: #009be5; background-color: #444; transform: scale(1.02); }
        .grid-icon { width: 32px; height: 32px; object-fit: contain; margin-bottom: 4px; background: #000; border-radius: 4px; }
        .grid-text { font-size: 10px; color: #ddd; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* --- FOOTER --- */
        footer { height: 36px; background-color: #000; display: flex; justify-content: space-between; align-items: center; padding: 0 8px; border-top: 1px solid #333; z-index: 20; }
        .soft-btn { min-width: 30px; height: 100%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 12px; }
        .soft-center { flex: 1; font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        svg { fill: white; width: 20px; height: 20px; pointer-events: none; }

        /* --- PLAYER UI --- */
        #player-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 100; display: none; }
        video { display: none; }
        canvas { width: 100%; height: 100%; display: block; }

        #video-controls { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0, 0, 0, 0.7); padding: 5px; display: flex; flex-direction: column; gap: 4px; transition: opacity 0.3s; z-index: 110; }
        #video-controls.hidden { opacity: 0; pointer-events: none; }
        .ctrl-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .time-text { font-size: 10px; color: #ddd; min-width: 60px; }
        input[type=range] { -webkit-appearance: none; width: 100%; height: 4px; background: #555; border-radius: 2px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: #009be5; border-radius: 50%; }
        .icon-btn { width: 24px; height: 24px; padding: 2px; cursor: pointer; }

        #player-top { position: absolute; top: 0; left: 0; width: 100%; padding: 5px; background: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), transparent); display: flex; justify-content: space-between; z-index: 110; transition: opacity 0.3s; }
        #player-top.hidden { opacity: 0; }
        .p-title { font-size: 12px; color: #fff; font-weight: bold; text-shadow: 1px 1px 2px black; }

        /* --- MODALS (Menu & Error) --- */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 200; display: none; align-items: center; justify-content: center; }
        .modal-box { background: #1a1a1a; width: 85%; border-radius: 4px; overflow: hidden; border: 1px solid #444; display: flex; flex-direction: column; }
        .modal-header { background: #009be5; color: white; padding: 8px; font-weight: bold; font-size: 14px; text-align: center; }
        .modal-header.error { background: #e53935; }
        
        .menu-item { padding: 5px 10px; border-bottom: 1px solid #333; color: #ccc; font-size: 14px; }
        .menu-item.focused { background: #333; color: white; border-left: 2px solid #009be5; }
        .error-msg { padding: 15px; text-align: center; font-size: 13px; color: #eee; line-height: 1.4; }

        #osd { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.7); color: white; padding: 10px 20px; border-radius: 5px; font-size: 16px; z-index: 300; display: none; pointer-events: none; }
        input[type="file"] { display: none; }

        @media screen and (max-width: 160px) {
           .modal-header {font-size: 12px; padding: 5px;}
            .menu-item {font-size: 10px;}
        }
    </style>
</head>

<body>

    <div id="app-container">
        <!-- HEADER -->
        <header id="header-bar">
            <div class="header-title">Canvas IP TV</div>
            <input type="text" id="search-input" placeholder="Search...">
        </header>

        <!-- MAIN LIST -->
        <main id="main-view"></main>

        <!-- FOOTER -->
        <footer id="footer-bar">
            <div class="soft-btn soft-left" id="sk-left"></div>
            <div class="soft-btn soft-center" id="sk-center"></div>
            <div class="soft-btn soft-right" id="sk-right"></div>
        </footer>

        <!-- PLAYER UI -->
        <div id="player-ui">
            <video id="video-source" playsinline crossorigin="anonymous"></video>
            <canvas id="video-canvas"></canvas>
            
            <div id="player-top">
                <div class="icon-btn" id="btn-back"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></div>
                <div class="p-title" id="p-title-text">Channel</div>
                <div class="icon-btn"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></div>
            </div>

            <div id="video-controls">
                <div class="ctrl-row"><input type="range" id="seek-bar" value="0" min="0" max="100"></div>
                <div class="ctrl-row">
                    <div class="icon-btn" id="btn-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
                    <div class="time-text" id="time-display">00:00 / 00:00</div>
                    <div style="flex:1"></div>
                    <input type="range" id="vol-bar" value="100" min="0" max="100" style="width: 50px;">
                </div>
            </div>
        </div>

        <!-- MENU MODAL -->
        <div id="menu-modal" class="modal-overlay">
            <div class="modal-box">
                <div class="modal-header" id="menu-title">Options</div>
                <div id="menu-list"></div>
            </div>
        </div>

        <!-- ERROR/NOTICE BOARD MODAL -->
        <div id="error-modal" class="modal-overlay">
            <div class="modal-box">
                <div class="modal-header error">Notice Board</div>
                <div class="error-msg" id="error-text">Unknown Error</div>
                <div class="menu-item focused" style="text-align:center; border-left:none; background:#333;">OK</div>
            </div>
        </div>

        <div id="osd">Info</div>
        <input type="file" id="fileInput" accept=".m3u,.m3u8">
    </div>

    <script>
        // --- CONSTANTS ---
        const ICONS = {
            play: `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`,
            pause: `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`,
            menu: `<svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>`,
            search: `<svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>`,
            back: `<svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>`,
            close: `<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 17.59 13.41 12z"/></svg>`
        };

        const DEFAULT_PLAYLIST = `#EXTM3U
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/c/c5/Big_buck_bunny_poster_big.jpg",Big Buck Bunny
http://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8
#EXTINF:-1 tvg-logo="https://durian.blender.org/wp-content/uploads/2010/06/sintel_small.png",Sintel (HLS)
https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8
#EXTINF:-1,Broken Stream Test
http://broken.link/stream.m3u8`;

        // --- STATE ---
        const State = {
            view: 'list', // list, menu, player, search, error, quality
            layout: 'list', // list, grid
            channels: [], filtered: [], listIdx: 0, menuIdx: 0,
            // Player
            pRot: 0, pZoom: 1.0, isPlaying: false, showControls: true, 
            hls: null, ctrlTimeout: null,
            // Quality
            qualities: [], currentQ: -1 // -1 is auto
        };

        const UI = {
            main: document.getElementById('main-view'),
            search: document.getElementById('search-input'),
            skL: document.getElementById('sk-left'),
            skC: document.getElementById('sk-center'),
            skR: document.getElementById('sk-right'),
            player: document.getElementById('player-ui'),
            video: document.getElementById('video-source'),
            canvas: document.getElementById('video-canvas'),
            ctx: document.getElementById('video-canvas').getContext('2d'),
            controls: document.getElementById('video-controls'),
            topBar: document.getElementById('player-top'),
            title: document.getElementById('p-title-text'),
            seekBar: document.getElementById('seek-bar'),
            volBar: document.getElementById('vol-bar'),
            btnPlay: document.getElementById('btn-play'),
            btnBack: document.getElementById('btn-back'),
            timeDisplay: document.getElementById('time-display'),
            osd: document.getElementById('osd'),
            fileIn: document.getElementById('fileInput'),
            
            // Modals
            menuModal: document.getElementById('menu-modal'),
            menuList: document.getElementById('menu-list'),
            menuTitle: document.getElementById('menu-title'),
            errorModal: document.getElementById('error-modal'),
            errorText: document.getElementById('error-text')
        };

        // --- INIT ---
        window.onload = () => {
            parseM3U(DEFAULT_PLAYLIST);
            updateSoftKeys();
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            startRenderLoop();
            setupGlobalBack();
        };

        function setupGlobalBack() {
            window.addEventListener('back', (e) => handleGlobalBack(e));
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace') handleGlobalBack(e);
            });
        }

        function handleGlobalBack(e) {
            // Priority: Error > Menu > Search > Player > List
            if (State.view === 'error') {
                e.preventDefault(); closeError();
            } else if (State.view === 'quality') {
                e.preventDefault(); openMenu('main'); // Go back to main menu
            } else if (State.view === 'menu') {
                e.preventDefault(); closeMenu();
            } else if (State.view === 'search') {
                e.preventDefault(); closeSearch();
            } else if (State.view === 'player') {
                e.preventDefault(); closePlayer();
            } else if (State.view === 'list') {
                if (UI.search.style.display === 'block') {
                    e.preventDefault(); closeSearch();
                } else {
                    // Default behavior (Exit)
                }
            }
        }

        function resizeCanvas() {
            UI.canvas.width = UI.player.clientWidth;
            UI.canvas.height = UI.player.clientHeight;
        }

        // --- INPUT HANDLING ---
        function handleInput(action) {
            if (State.view === 'error') {
                if (action === 'enter' || action === 'back') closeError();
                return;
            }

            if (State.view === 'player') {
                showControlsTemp();
                if (action === 'back') closePlayer();
                if (action === 'enter') togglePlay();
                if (action === 'right') seekVideo(10);
                if (action === 'seekleft') seekVideo(-10);
                if (action === 'up') changeVol(0.1);
                if (action === 'down') changeVol(-0.1);
                return;
            }

            if (State.view === 'list') {
                if (State.layout === 'list') {
                    if (action === 'up') {
                        if (State.listIdx === 0 && UI.search.style.display === 'block') enterSearch();
                        else moveList(-1);
                    }
                    if (action === 'down') moveList(1);
                    if (action === 'left') openMenu('main');
                    if (action === 'right') { if (UI.search.style.display === 'block') closeSearch(); else enterSearch(); }
                } else {
                    // Grid
                    const cols = 3;
                    if (action === 'up') moveList(-cols);
                    if (action === 'down') moveList(cols);
                    if (action === 'left') moveList(-1);
                    if (action === 'right') moveList(1);
                }
                if (action === 'enter') playChannel(State.filtered[State.listIdx]);
                if (action === 'Escape') openMenu('main');
            }

            if (State.view === 'menu' || State.view === 'quality') {
                if (action === 'up') navMenu(-1);
                if (action === 'down') navMenu(1);
                if (action === 'enter') execMenu();
                if (action === 'back' || action === 'softright') {
                    if (State.view === 'quality') openMenu('main'); else closeMenu();
                }
            }

            if (State.view === 'search') {
                if (action === 'down' || action === 'enter') {
                    if (State.filtered.length > 0) { UI.search.blur(); State.view = 'list'; renderList(); }
                }
                if (action === 'back') closeSearch();
            }
        }

        document.addEventListener('keydown', (e) => {
            let key = e.key;
            let action = null;
            if (State.view === 'player') {
                if (key === '1') { State.pZoom = Math.max(0.5, State.pZoom - 0.2); showOSD(`Zoom ${State.pZoom.toFixed(1)}`); return; }
                if (key === '3') { State.pZoom += 0.2; showOSD(`Zoom ${State.pZoom.toFixed(1)}`); return; }
            }
            if (key === 'ArrowUp') action = 'up';
            else if (key === 'ArrowDown') action = 'down';
            else if (key === 'ArrowLeft') action = State.view === 'player' ? 'seekleft' : 'left';
            else if (key === 'ArrowRight') action = 'right';
            else if (key === 'Enter') action = 'enter';
            else if (key === 'Escape' || key === 'F1') action = 'Escape';
            else if (key === 'SoftRight' || key === 'F2') action = 'back';
            
            if (State.view === 'list' && key.length === 1 && /[a-z0-9]/i.test(key)) {
                enterSearch(); UI.search.value += key; triggerSearch(UI.search.value); return;
            }
            if (action) { if (action !== 'back') e.preventDefault(); handleInput(action); }
        });

        UI.skL.onclick = () => handleInput('Escape');
        UI.skC.onclick = () => handleInput('enter');
        UI.skR.onclick = () => handleGlobalBack({ preventDefault: ()=>{} });

        // --- PLAYER & ERROR HANDLING ---
        function startRenderLoop() { requestAnimationFrame(renderLoop); }
        function renderLoop() {
            if (State.view === 'player') {
                const ctx = UI.ctx, v = UI.video, cw = UI.canvas.width, ch = UI.canvas.height;
                ctx.fillStyle = "#000"; ctx.fillRect(0, 0, cw, ch);
                if (v.readyState >= 2) {
                    const scale = Math.min(cw / v.videoWidth, ch / v.videoHeight) * State.pZoom;
                    const drawW = v.videoWidth * scale, drawH = v.videoHeight * scale;
                    ctx.save();
                    ctx.translate(cw / 2, ch / 2);
                    ctx.rotate(State.pRot * Math.PI / 180);
                    ctx.translate(-cw / 2, -ch / 2);
                    ctx.drawImage(v, (cw - drawW) / 2, (ch - drawH) / 2, drawW, drawH);
                    ctx.restore();
                }
            }
            requestAnimationFrame(renderLoop);
        }

        function playChannel(ch) {
            State.view = 'player';
            UI.player.style.display = 'block';
            document.getElementById('header-bar').style.display = 'none';
            document.getElementById('footer-bar').style.display = 'none';
            UI.title.textContent = ch.name;
            resizeCanvas();
            State.qualities = []; State.currentQ = -1; // Reset quality

            if (Hls.isSupported()) {
                if (State.hls) State.hls.destroy();
                State.hls = new Hls();
                State.hls.loadSource(ch.url);
                State.hls.attachMedia(UI.video);
                
                // Get Qualities
                State.hls.on(Hls.Events.MANIFEST_PARSED, (e, data) => {
                    State.qualities = State.hls.levels; // Store levels
                    UI.video.play().catch(e => console.log(e));
                    State.isPlaying = true; updatePlayBtn();
                });

                // Error Handling
                State.hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                showError("Network Error: Check connection.");
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                State.hls.recoverMediaError(); // Try recover
                                break;
                            default:
                                showError("Playback Error: " + data.details);
                                break;
                        }
                    }
                });

            } else {
                UI.video.src = ch.url;
                UI.video.onerror = () => showError("Format Not Supported / Net Error");
                UI.video.play();
                State.isPlaying = true; updatePlayBtn();
            }
            showControlsTemp();
        }

        function closePlayer() {
            UI.video.pause(); UI.video.src = "";
            if (State.hls) { State.hls.destroy(); State.hls = null; }
            UI.player.style.display = 'none';
            document.getElementById('header-bar').style.display = 'flex';
            document.getElementById('footer-bar').style.display = 'flex';
            State.view = 'list';
            updateSoftKeys();
        }

        // --- NOTICE BOARD (ERROR MODAL) ---
        function showError(msg) {
            // Close player first if open
            if(State.view === 'player') closePlayer();
            
            State.view = 'error';
            UI.errorText.innerText = msg;
            UI.errorModal.style.display = 'flex';
            updateSoftKeys();
        }

        function closeError() {
            UI.errorModal.style.display = 'none';
            State.view = 'list';
            updateSoftKeys();
        }

        // --- CONTROLS ---
        function togglePlay() { if (UI.video.paused) { UI.video.play(); State.isPlaying=true; } else { UI.video.pause(); State.isPlaying=false; } updatePlayBtn(); showControlsTemp(); }
        function updatePlayBtn() { UI.btnPlay.innerHTML = State.isPlaying ? ICONS.pause : ICONS.play; }
        function seekVideo(d) { UI.video.currentTime += d; showControlsTemp(); showOSD((d>0?">> ":"|<< ") + Math.abs(d) + "s"); }
        function changeVol(d) { let v = UI.video.volume + d; if(v<0)v=0; if(v>1)v=1; UI.video.volume = v; UI.volBar.value = v*100; showOSD("Vol " + Math.round(v*100) + "%"); showControlsTemp(); }

        UI.video.addEventListener('timeupdate', () => { if (!isNaN(UI.video.duration)) { UI.seekBar.value = (UI.video.currentTime / UI.video.duration) * 100; UI.timeDisplay.textContent = formatTime(UI.video.currentTime); }});
        UI.seekBar.addEventListener('input', (e) => UI.video.currentTime = (UI.video.duration * e.target.value) / 100);
        UI.volBar.addEventListener('input', (e) => UI.video.volume = e.target.value / 100);
        UI.canvas.addEventListener('click', () => { if(UI.controls.classList.contains('hidden')) showControlsTemp(); else UI.controls.classList.add('hidden'); });
        
        function showControlsTemp() { UI.controls.classList.remove('hidden'); UI.topBar.classList.remove('hidden'); clearTimeout(State.ctrlTimeout); State.ctrlTimeout = setTimeout(() => { if (State.isPlaying) { UI.controls.classList.add('hidden'); UI.topBar.classList.add('hidden'); } }, 4000); }
        function formatTime(s) { const m = Math.floor(s/60), sec = Math.floor(s%60); return `${m}:${sec<10?'0':''}${sec}`; }
        function showOSD(msg) { UI.osd.innerText = msg; UI.osd.style.display = 'block'; setTimeout(() => UI.osd.style.display = 'none', 1500); }

        // --- DATA & LIST ---
        function parseM3U(d) {
            State.channels = []; let tLogo = "", tName = "";
            d.split('\n').forEach(l => {
                l = l.trim();
                if (l.startsWith('#EXTINF')) {
                    const logoMatch = l.match(/tvg-logo="([^"]+)"/); tLogo = logoMatch ? logoMatch[1] : "";
                    const parts = l.split(','); tName = parts.length > 1 ? parts[parts.length - 1].trim() : "Channel";
                } else if (l.startsWith('http')) {
                    State.channels.push({ name: tName || "Channel", url: l, logo: tLogo }); tName = ""; tLogo = "";
                }
            });
            State.filtered = State.channels; renderList();
        }

        function renderList() {
            UI.main.innerHTML = '';
            if (State.layout === 'list') {
                const c = document.createElement('div'); c.className = 'list-container';
                State.filtered.forEach((ch, i) => {
                    const e = document.createElement('div'); e.className = 'list-item ' + (i === State.listIdx ? 'focused' : '');
                    e.innerText = ch.name; e.onclick = () => { State.listIdx = i; renderList(); playChannel(ch); }; c.appendChild(e);
                });
                UI.main.appendChild(c);
            } else {
                const c = document.createElement('div'); c.className = 'grid-container';
                State.filtered.forEach((ch, i) => {
                    const e = document.createElement('div'); e.className = 'grid-item ' + (i === State.listIdx ? 'focused' : '');
                    const img = document.createElement('img'); img.className = 'grid-icon';
                    img.src = ch.logo || "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0id2hpdGUiPjxwYXRoIGQ9Ik0yMSAzSDNWMjFoMThWM3ptLTIgMTZINVY1aDE0djE0eiIvPjwvc3ZnPg==";
                    img.onerror = function() { this.src = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0id2hpdGUiPjxwYXRoIGQ9Ik0yMSAzSDNWMjFoMThWM3ptLTIgMTZINVY1aDE0djE0eiIvPjwvc3ZnPg=="; };
                    const txt = document.createElement('div'); txt.className = 'grid-text'; txt.innerText = ch.name;
                    e.appendChild(img); e.appendChild(txt); e.onclick = () => { State.listIdx = i; renderList(); playChannel(ch); }; c.appendChild(e);
                });
                UI.main.appendChild(c);
            }
            const f = document.querySelector('.focused'); if (f) f.scrollIntoView({ block: 'center', behavior: 'auto' });
        }

        function moveList(d) { const n = State.listIdx + d; if (n >= 0 && n < State.filtered.length) { State.listIdx = n; renderList(); } }
        function enterSearch() { State.view = 'search'; UI.search.style.display = 'block'; UI.search.focus(); updateSoftKeys(); }
        function closeSearch() { State.view = 'list'; UI.search.style.display = 'none'; UI.search.value = ''; State.filtered = State.channels; State.listIdx = 0; renderList(); updateSoftKeys(); }
        function triggerSearch(t) { State.filtered = State.channels.filter(c => c.name.toLowerCase().includes(t.toLowerCase())); State.listIdx = 0; renderList(); }
        UI.search.addEventListener('input', e => triggerSearch(e.target.value));

        // --- MENU SYSTEM ---
        let currentMenuItems = [];

        function openMenu(type) {
            UI.menuModal.style.display = 'flex';
            UI.menuList.innerHTML = '';
            State.menuIdx = 0;

            if (type === 'main') {
                State.view = 'menu';
                UI.menuTitle.innerText = "Options";
                currentMenuItems = [
                    { t: 'Switch View', a: () => { toggleLayout(); } },
                    { t: 'Video Quality', a: () => { openMenu('quality'); } },
                    { t: 'Load Playlist', a: () => UI.fileIn.click() },
                    { t: 'Reload Default', a: () => parseM3U(DEFAULT_PLAYLIST) },
                    { t: 'About', a: () => showOSD("IPTV v3") }
                ];
            } else if (type === 'quality') {
                State.view = 'quality';
                UI.menuTitle.innerText = "Quality";
                // Generate quality list
                currentMenuItems = [{ t: 'Auto ' + (State.currentQ === -1 ? '(✓)' : ''), a: () => setQuality(-1) }];
                
                if (State.qualities && State.qualities.length > 0) {
                    State.qualities.forEach((q, index) => {
                        const isSelected = State.currentQ === index;
                        currentMenuItems.push({ 
                            t: `${q.height}p ${isSelected ? '(✓)' : ''}`, 
                            a: () => setQuality(index) 
                        });
                    });
                } else {
                    currentMenuItems.push({ t: 'Default (No selection)', a: () => {} });
                }
            }

            currentMenuItems.forEach((it, i) => {
                const d = document.createElement('div'); d.className = 'menu-item ' + (i === 0 ? 'focused' : '');
                d.innerText = it.t; d.onclick = () => { State.menuIdx = i; execMenu(); }; UI.menuList.appendChild(d);
            });
            updateSoftKeys();
        }

        function navMenu(d) {
            const el = document.querySelectorAll('.menu-item'); 
            el[State.menuIdx].classList.remove('focused');
            State.menuIdx = (State.menuIdx + d + el.length) % el.length; 
            el[State.menuIdx].classList.add('focused');
        }

        function execMenu() { 
            const action = currentMenuItems[State.menuIdx].a;
            if(State.view === 'menu') closeMenu(); // Close if main menu
            action(); 
        }

        function closeMenu() { 
            State.view = 'list'; UI.menuModal.style.display = 'none'; updateSoftKeys(); 
        }

        function toggleLayout() {
            State.layout = State.layout === 'list' ? 'grid' : 'list';
            renderList(); showOSD("View: " + State.layout.toUpperCase());
        }

        function setQuality(index) {
            if (State.hls) {
                State.hls.currentLevel = index;
                State.currentQ = index;
                showOSD(index === -1 ? "Quality: Auto" : `Quality: ${State.qualities[index].height}p`);
            } else {
                showOSD("Not available for this stream");
            }
            // Go back to main menu or close? Let's close for better UX
            closeMenu();
        }

        function updateSoftKeys() {
            if (State.view === 'search') { UI.skL.innerHTML = ""; UI.skC.innerHTML = "GO"; UI.skR.innerHTML = ICONS.close; }
            else if (State.view === 'menu') { UI.skL.innerHTML = ""; UI.skC.innerHTML = "OK"; UI.skR.innerHTML = ICONS.back; }
            else if (State.view === 'quality') { UI.skL.innerHTML = ""; UI.skC.innerHTML = "SET"; UI.skR.innerHTML = ICONS.back; }
            else if (State.view === 'error') { UI.skL.innerHTML = ""; UI.skC.innerHTML = "OK"; UI.skR.innerHTML = ICONS.back; }
            else { 
                UI.skL.innerHTML = ICONS.menu; UI.skC.innerHTML = "PLAY"; 
                UI.skR.innerHTML = UI.search.style.display === 'block' ? ICONS.back : "EXIT"; 
            }
        }

        UI.fileIn.onchange = e => { const f = e.target.files[0]; if (f) { const r = new FileReader(); r.onload = v => parseM3U(v.target.result); r.readAsText(f); } };
    </script>
</body>
</html>
