<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Touch IPTV (Cloud Fixed)</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* --- RESET & BASIC --- */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; outline: none; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; overflow: hidden; }

        /* --- CONTAINER --- */
        #app-container { width: 100%; height: 100%; background-color: #000; position: relative; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 0 30px rgba(0,0,0,0.8); }

        /* --- HEADER --- */
        header { height: 40px; background-color: #202020; display: flex; align-items: center; padding: 0 10px; border-bottom: 2px solid #009be5; z-index: 10; position: relative; }
        .header-title { font-size: 14px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #search-input { width: calc(100% - 20px); height: 28px; background: #fff; border: 2px solid #009be5; color: #000; font-size: 12px; padding: 0 8px; border-radius: 4px; display: none; position: absolute; left: 10px; top: 6px; right: 10px; margin: 0; z-index: 20; }

        /* --- MAIN VIEW --- */
        main { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
        
        /* List Style */
        .list-container { display: flex; flex-direction: column; padding-bottom: 10px; }
        .list-item { 
            padding: 8px 10px; 
            font-size: 13px; 
            border-bottom: 1px solid #333; 
            color: #ccc; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            transition: background 0.2s;
        }
        .list-item:active { background-color: #333; }
        .list-item.focused { background-color: #009be5; color: #fff; font-weight: 600; }
        
        .list-item img { width: 25px; height: 25px; object-fit: contain; border-radius: 3px; background: #fff; }
        .tv-placeholder { width: 25px; height: 25px; background: #333; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 8px; color: #777; }

        #no-channels-message { padding: 15px; text-align: center; color: #888; font-size: 12px; }

        /* --- PLAYER CONTAINER --- */
        #native-player-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 100; display: none; flex-direction: column; }
        
        #player-header { position: absolute; top: 0; left: 0; width: 100%; padding: 5px; z-index: 110; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); display: flex; justify-content: flex-start; pointer-events: none; }
        #btn-close-player { pointer-events: auto; background: rgba(255, 255, 255, 0.2); border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(5px); }
        #btn-close-player svg { width: 18px; height: 18px; fill: white; }

        /* Video & Iframe Elements */
        video { width: 100%; height: 100%; display: block; object-fit: contain; }
        iframe { width: 100%; height: 100%; border: none; display: none; background: #000; }

        /* Player OSD Title */
        #player-osd-title { 
            position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 4px 10px; border-radius: 15px;
            font-size: 12px; z-index: 110; display: none; max-width: 90%;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* --- FOOTER --- */
        footer { height: 40px; background-color: #1a1a1a; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; border-top: 1px solid #333; z-index: 20; }
        .soft-btn { min-width: 40px; height: 100%; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; }
        .soft-btn:active { opacity: 0.7; }
        svg { fill: white; width: 22px; height: 22px; pointer-events: none; }
        #sk-left-text, #sk-right-text { font-size: 12px; font-weight: 600; }

        /* --- MODALS --- */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
        .modal-box { background: #222; width: 85%; max-height: 70%; border-radius: 8px; overflow-y: auto; border: 1px solid #444; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-header { background: #009be5; color: white; padding: 10px; font-weight: bold; font-size: 14px; text-align: center; }
        .menu-item { padding: 10px; border-bottom: 1px solid #333; color: #eee; font-size: 13px; cursor: pointer; }
        .menu-item:active { background: #333; }
        .menu-item.focused { background: #333; color: white; border-left: 5px solid #009be5; }

        #osd { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); background: rgba(50,50,50,0.9); color: white; padding: 6px 15px; border-radius: 15px; font-size: 12px; z-index: 300; display: none; pointer-events: none; text-align: center; border: 1px solid #555;}
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- HEADER -->
        <header id="header-bar">
            <div class="header-title">Touch IPTV</div>
            <input type="text" id="search-input" placeholder="Search...">
        </header>

        <!-- MAIN VIEW -->
        <main id="main-view"></main>

        <!-- FOOTER -->
        <footer id="footer-bar">
            <div class="soft-btn soft-left" id="sk-left">
                <span id="sk-left-text">Menu</span>
            </div>
            <div class="soft-btn soft-right" id="sk-right">
                <span id="sk-right-text">Search</span>
            </div>
        </footer>

        <!-- PLAYER UI -->
        <div id="native-player-container">
            <div id="player-header">
                <div id="btn-close-player">
                    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                </div>
            </div>
            <div id="player-osd-title" style="display: none;"></div>
            
            <!-- Video for HLS -->
            <video id="video-source" controls playsinline></video>
            <!-- Iframe for Web/Embed links (Cloud phone fix) -->
            <iframe id="iframe-source" allowfullscreen></iframe>
        </div>

        <!-- MENU MODAL -->
        <div id="menu-modal" class="modal-overlay">
            <div class="modal-box">
                <div class="modal-header" id="modal-title">Menu</div>
                <div id="menu-list"></div>
            </div>
        </div>

        <!-- OSD TOAST -->
        <div id="osd">Info</div>
        <input type="file" id="fileInput" accept=".m3u,.m3u8,.txt">
    </div>

    <script>
        // Sources from your provided working code
        const M3U_MAIN = 'https://raw.githubusercontent.com/omnixmain/OMNIX-PLAYLIST-ZONE/refs/heads/main/playlist/RoarZoneTv.m3u';
        const M3U_BD = 'https://raw.githubusercontent.com/cctvccplc/Tv-Test/refs/heads/main/BD26.m3u8';
        
        // Manual channels (Iframe based) from your code
        const manualChannels = [
            { name: "T-Sports HD", url: "https://bongoflixbd.top/r/?watch=b0aeb53ec98c74b3b1bb5f16acf8f056", logo: "https://upload.wikimedia.org/wikipedia/en/2/2f/T_Sports_logo.png", isIframe: true },
            { name: "Star Sports 1", url: "https://bongoflixbd.top/r/?watch=339dcfaa4f761b545a5b815ee54a9bad", logo: "", isIframe: true },
            { name: "GTV (Gazi TV)", url: "https://bongoflixbd.top/r/?watch=gtv", logo: "", isIframe: true }
        ];

        const LS_KEY = 'touch_iptv_data_v2';

        const State = {
            view: 'list', 
            channels: [], 
            filtered: [], 
            listIdx: 0, 
            menuIdx: 0, 
            hls: null,
            osdTimer: null,
            playerOsdTimer: null
        };

        const UI = {
            main: document.getElementById('main-view'),
            search: document.getElementById('search-input'),
            skL: document.getElementById('sk-left'), 
            skR: document.getElementById('sk-right'),
            skLText: document.getElementById('sk-left-text'),
            skRText: document.getElementById('sk-right-text'),
            playerContainer: document.getElementById('native-player-container'), 
            video: document.getElementById('video-source'), 
            iframe: document.getElementById('iframe-source'),
            btnClose: document.getElementById('btn-close-player'),
            playerOsdTitle: document.getElementById('player-osd-title'),
            modal: document.getElementById('menu-modal'), 
            mList: document.getElementById('menu-list'),
            osd: document.getElementById('osd'), 
            fileIn: document.getElementById('fileInput')
        };

        window.onload = async () => {
            // First load manual channels
            let allChannels = [...manualChannels];
            
            // Try to load external playlists
            try {
                showOSD("Loading Channels...");
                const [r1, r2] = await Promise.all([
                    fetch(M3U_MAIN).then(r=>r.text()).catch(()=>""), 
                    fetch(M3U_BD).then(r=>r.text()).catch(()=>"")
                ]);
                
                const p1 = parseM3UContent(r1);
                const p2 = parseM3UContent(r2);
                
                allChannels = [...allChannels, ...p1, ...p2];
                State.channels = allChannels;
                State.filtered = allChannels;
                renderList();
                showOSD(`Loaded ${allChannels.length} Channels`);
            } catch (e) {
                showOSD("Error loading online lists");
                State.channels = manualChannels;
                State.filtered = manualChannels;
                renderList();
            }
            updateFooterButtons();
        };

        // --- KEYBOARD HANDLING ---
        document.addEventListener('keydown', (e) => {
            const key = e.key;

            if (key === 'SoftLeft' || key === 'F1') { e.preventDefault(); handleSoftLeft(); return; }
            if (key === 'SoftRight' || key === 'F2') { e.preventDefault(); handleSoftRight(); return; }
            if (key === 'Backspace' || key === 'Escape') { e.preventDefault(); handleBack(); return; }
            
            if (State.view === 'list') {
                if (key === 'ArrowDown') { e.preventDefault(); moveList(1); }
                if (key === 'ArrowUp') { e.preventDefault(); moveList(-1); }
                if (key === 'Enter') {
                    e.preventDefault();
                    if(State.filtered.length > 0) playChannel(State.filtered[State.listIdx]);
                }
                if (key.length === 1 && /^[a-z0-9]$/i.test(key)) {
                    openSearch();
                    UI.search.value += key;
                    filterSearch(UI.search.value);
                }
            } else if (State.view === 'player') {
                // If Iframe, keys might not work well, but we try
                if (UI.iframe.style.display === 'block') {
                    if (key === 'Backspace' || key === 'Escape') closePlayer();
                } else {
                    if (key === 'Enter' || key === 'MediaPlayPause') togglePlay();
                    if (key === 'ArrowRight') seek(15);
                    if (key === 'ArrowLeft') seek(-15);
                    if (key === 'ArrowUp') adjustVolume(0.1);
                    if (key === 'ArrowDown') adjustVolume(-0.1);
                }
            } else if (State.view === 'menu') {
                e.preventDefault();
                if (key === 'ArrowDown') moveMenu(1);
                if (key === 'ArrowUp') moveMenu(-1);
                if (key === 'Enter') executeMenu();
            } else if (State.view === 'search') {
                if (key === 'ArrowDown') {
                    e.preventDefault(); UI.search.blur(); State.view = 'list'; State.listIdx = 0; renderList();
                }
            }
        });

        // --- LOGIC ---
        function handleSoftLeft() {
            if (State.view === 'list') openMenu();
            else if (State.view === 'player' && UI.video.style.display !== 'none') togglePlay();
            else if (State.view === 'menu') executeMenu();
        }

        function handleSoftRight() {
            if (State.view === 'list') openSearch();
            else if (State.view === 'player') closePlayer();
            else if (State.view === 'search') closeSearch();
            else if (State.view === 'menu') closeMenu();
        }

        function handleBack() {
            if (State.view === 'player') closePlayer();
            else if (State.view === 'menu') closeMenu();
            else if (State.view === 'search') closeSearch();
        }

        // --- PLAY PLAYER ---
        function playChannel(ch) {
            State.view = 'player';
            UI.playerContainer.style.display = 'flex';
            document.getElementById('header-bar').style.display = 'none';
            document.getElementById('footer-bar').style.display = 'none';
            UI.playerOsdTitle.innerText = ch.name;
            showPlayerOSD(ch.name);

            // Determine if Iframe or Video
            const isIframe = ch.isIframe || ch.url.includes('bongoflix') || ch.url.includes('embed');

            if (isIframe) {
                // IFRAME MODE
                UI.video.style.display = 'none';
                UI.video.pause();
                UI.iframe.style.display = 'block';
                UI.iframe.src = ch.url;
            } else {
                // VIDEO MODE
                UI.iframe.style.display = 'none';
                UI.iframe.src = "";
                UI.video.style.display = 'block';

                const hlsConfig = {};
                if (ch.headers) {
                    hlsConfig.xhrSetup = (xhr) => {
                        for (const [key, value] of Object.entries(ch.headers)) xhr.setRequestHeader(key, value);
                    };
                }

                if (Hls.isSupported()) {
                    if (State.hls) State.hls.destroy();
                    State.hls = new Hls(hlsConfig);
                    State.hls.loadSource(ch.url);
                    State.hls.attachMedia(UI.video);
                    State.hls.on(Hls.Events.MANIFEST_PARSED, () => { 
                        UI.video.play().catch(e => showOSD("Tap to Play")); 
                    });
                    State.hls.on(Hls.Events.ERROR, (e, data) => { 
                       if(data.fatal) showOSD("Stream Error"); 
                    });
                } else if (UI.video.canPlayType('application/vnd.apple.mpegurl')) {
                    UI.video.src = ch.url; 
                    UI.video.play().catch(e => console.log(e));
                }
                UI.video.focus();
            }
        }

        function closePlayer() {
            UI.video.pause(); 
            UI.video.src = "";
            UI.video.removeAttribute('src'); 
            UI.iframe.src = ""; // Stop iframe
            if (State.hls) { State.hls.destroy(); State.hls = null; }
            
            UI.playerContainer.style.display = 'none';
            document.getElementById('header-bar').style.display = 'flex';
            document.getElementById('footer-bar').style.display = 'flex';
            State.view = 'list';
            updateFooterButtons();
        }

        function togglePlay() {
            if (UI.video.style.display === 'none') return; // Can't control iframe play/pause easily
            if (UI.video.paused) { UI.video.play(); showOSD("Playing"); }
            else { UI.video.pause(); showOSD("Paused"); }
        }
        
        function seek(s) { if(UI.video.style.display !== 'none') UI.video.currentTime += s; }
        function adjustVolume(d) { 
            if(UI.video.style.display !== 'none') {
                let v = UI.video.volume + d; 
                if(v<0)v=0; if(v>1)v=1; 
                UI.video.volume = v; showOSD("Vol: "+Math.round(v*100));
            }
        }

        // --- LIST RENDER ---
        function renderList() {
            UI.main.innerHTML = '';
            const container = document.createElement('div');
            container.className = 'list-container';

            if (State.filtered.length === 0) {
                const msg = document.createElement('div');
                msg.id = 'no-channels-message';
                msg.innerText = 'No channels found.';
                UI.main.appendChild(msg);
            } else {
                State.filtered.forEach((ch, i) => {
                    const div = document.createElement('div');
                    div.className = 'list-item' + (i === State.listIdx && State.view === 'list' ? ' focused' : '');
                    
                    const logoHtml = ch.logo 
                        ? `<img src="${ch.logo}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
                        : ``;
                    const fallbackHtml = `<div class="tv-placeholder" style="${ch.logo?'display:none':''}">TV</div>`;

                    div.innerHTML = `${logoHtml}${fallbackHtml}<span>${ch.name}</span>`;
                    div.onclick = () => { State.listIdx = i; renderList(); playChannel(ch); };
                    container.appendChild(div);
                });
                UI.main.appendChild(container);
                scrollToFocus(UI.main);
            }
        }

        function parseM3UContent(data) {
            const res = [];
            const lines = data.split('\n');
            let tempCh = {};
            for(let i=0; i<lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF')) {
                    const logo = line.match(/tvg-logo="([^"]*)"/);
                    tempCh = { logo: logo ? logo[1] : null };
                    tempCh.name = line.split(',').pop().trim();
                } else if (line.startsWith('http')) {
                    tempCh.url = line;
                    tempCh.isIframe = line.includes('bongoflix') || line.includes('embed');
                    if(tempCh.name) res.push(tempCh);
                    tempCh = {};
                }
            }
            return res;
        }

        function scrollToFocus(container) {
            const f = container.querySelector('.focused');
            if (f) f.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }

        function moveList(dir) {
            if(State.filtered.length===0) return;
            const next = State.listIdx + dir;
            if(next >= 0 && next < State.filtered.length) {
                State.listIdx = next;
                renderList();
            }
        }

        // --- MENU ---
        function openMenu() { State.view = 'menu'; UI.modal.style.display = 'flex'; State.menuIdx = 0; renderMenu(); updateFooterButtons(); }
        function closeMenu() { State.view = 'list'; UI.modal.style.display = 'none'; renderList(); updateFooterButtons(); }
        
        function renderMenu() {
            UI.mList.innerHTML = '';
            const opts = [
                { t: 'Reload Playlist', a: () => window.location.reload() },
                { t: 'Load File', a: () => { UI.fileIn.click(); closeMenu(); } },
                { t: 'Exit Menu', a: closeMenu }
            ];
            opts.forEach((o, i) => {
                const d = document.createElement('div');
                d.className = 'menu-item' + (i === State.menuIdx ? ' focused' : '');
                d.innerText = o.t;
                d.onclick = () => { State.menuIdx = i; o.a(); };
                UI.mList.appendChild(d);
            });
        }
        function moveMenu(d) {
            const l = UI.mList.children.length;
            if(l===0) return;
            State.menuIdx = (State.menuIdx + d + l) % l;
            renderMenu();
        }
        function executeMenu() { UI.mList.children[State.menuIdx].click(); }

        // --- SEARCH ---
        function openSearch() { State.view = 'search'; UI.search.style.display='block'; UI.search.focus(); State.filtered = State.channels; State.listIdx = 0; renderList(); updateFooterButtons(); }
        function closeSearch() { State.view = 'list'; UI.search.style.display='none'; UI.search.value=''; State.filtered = State.channels; State.listIdx = 0; renderList(); updateFooterButtons(); }
        function filterSearch(v) {
            State.filtered = State.channels.filter(c => c.name.toLowerCase().includes(v.toLowerCase()));
            State.listIdx = 0; renderList();
        }

        function showOSD(m) { UI.osd.innerText = m; UI.osd.style.display = 'block'; clearTimeout(State.osdTimer); State.osdTimer = setTimeout(()=>UI.osd.style.display='none', 2000); }
        function showPlayerOSD(t) { UI.playerOsdTitle.innerText = t; UI.playerOsdTitle.style.display = 'block'; clearTimeout(State.playerOsdTimer); State.playerOsdTimer = setTimeout(()=>UI.playerOsdTitle.style.display='none', 3000); }
        
        function updateFooterButtons() {
            if (State.view === 'list') { UI.skLText.innerText = 'Menu'; UI.skRText.innerText = 'Search'; }
            else if (State.view === 'player') { UI.skLText.innerText = 'Play/Pause'; UI.skRText.innerText = 'Close'; }
            else if (State.view === 'menu') { UI.skLText.innerText = 'Select'; UI.skRText.innerText = 'Back'; }
            else if (State.view === 'search') { UI.skLText.innerText = ''; UI.skRText.innerText = 'Cancel'; }
        }

        UI.skL.onclick = handleSoftLeft;
        UI.skR.onclick = handleSoftRight;
        UI.btnClose.onclick = closePlayer;
        UI.search.addEventListener('input', (e) => filterSearch(e.target.value));
        UI.fileIn.onchange = (e) => {
            if(e.target.files.length){
                const r = new FileReader();
                r.onload = v => { 
                    const p = parseM3UContent(v.target.result); 
                    State.channels = p; State.filtered = p; renderList(); 
                };
                r.readAsText(e.target.files[0]);
            }
        };

    </script>
</body>
</html>
