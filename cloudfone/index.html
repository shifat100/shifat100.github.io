<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Phone</title>
    <style>* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: sans-serif;
}

body {
    background: #000;
    color: white;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
}

.screen {
    width: 100%;
    max-width: 360px;
    min-width: 128px;
    height: 100vh;
    max-height: 480px;
    display: flex;
    flex-direction: column;
    position: relative;
}

/* ================== HOME SCREEN ================== */
#screen-home { background: #2b2b2b; }
#screen-home .top-bar { display: flex; justify-content: space-around; padding: 5px 0; background: transparent; }
#screen-home .top-btn { padding: 5px 20px; border-radius: 20px; cursor: pointer; }
#screen-home .top-btn.focused { background: #1a73e8; }
#screen-home .grid { flex: 1; overflow-y: auto; padding: 15px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-content: start; scrollbar-width: none; }
#screen-home .grid::-webkit-scrollbar { display: none; }
#screen-home .icon-box { aspect-ratio: 1/1; border-radius: 20px; background: white; display: flex; justify-content: center; align-items: center; border: 4px solid transparent; cursor: pointer; transition: transform 0.15s, border-color 0.15s; }
#screen-home .icon-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 16px; }
#screen-home .icon-box.focused { border-color: #8c8c8c; transform: scale(1.05); }
#screen-home .side-dots { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; }
#screen-home .dot { width: 6px; height: 6px; background: #555; border-radius: 50%; transition: 0.3s; }
#screen-home .dot.active { background: white; height: 12px; border-radius: 6px; }
#screen-home .bottom-bar { background: #000; padding: 12px; display: flex; justify-content: space-between; align-items: center; }

/* ================== CATEGORY SCREEN ================== */
#screen-category { background: #2e2e2e; }
#screen-category .top-bar { display: flex; justify-content: space-around; padding: 8px 0; background: #2e2e2e; }
#screen-category .nav-item { padding: 6px 18px; border-radius: 20px; cursor: pointer; }
#screen-category .nav-item.focused { background-color: #1a73e8; }
#screen-category .content { flex: 1; overflow-y: auto; padding: 0px 10px; scrollbar-width: none; }
#screen-category .content::-webkit-scrollbar { display: none; }
#screen-category .header { font-size: 14px; font-weight: bold; margin: 8px 0px; color: #ccc; padding: 5px; border-radius: 5px; cursor: pointer; display: block; }
#screen-category .header.focused { color: #fff; background: #1a73e8; border-color: #1a73e8; }
#screen-category .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
#screen-category .app-card { aspect-ratio: 1/1; background: white; border-radius: 12px; display: flex; justify-content: center; align-items: center; padding: 12%; border: 4px solid transparent; transition: transform 0.15s, border-color 0.15s; cursor: pointer; }
#screen-category .app-card img { width: 100%; height: 100%; object-fit: contain; }
#screen-category .app-card.focused { border-color: #8c8c8c; transform: scale(1.05); }
#screen-category .bottom-bar { background: #000; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
#screen-category .brand-text { font-weight: bold; font-size: 16px; color: #fff; }

/* ================== LIST SCREEN ================== */
#screen-list { background: #2b2b2b; }
#screen-list .header-bar { background-color: #000; padding: 8px 12px; font-size: 18px; font-weight: bold; }
#screen-list .list-container { flex: 1; overflow-y: auto; scrollbar-width: none; }
#screen-list .list-container::-webkit-scrollbar { display: none; }
#screen-list .list-item { display: flex; align-items: center; padding: 10px; cursor: pointer; border-bottom: 1px solid #3d3d3d; transition: background 0.1s; }
#screen-list .list-item.focused { background-color: #1a73e8 !important; }
#screen-list .list-item.focused .subtitle { color: #fff; }
#screen-list .icon-wrapper { width: 55px; height: 55px; background: #fff; border-radius: 12px; margin-right: 12px; display: flex; justify-content: center; align-items: center; flex-shrink: 0; overflow: hidden; }
#screen-list .icon-wrapper img { width: 100%; height: 100%; object-fit: contain; }
#screen-list .text-info { display: flex; flex-direction: column; overflow: hidden; }
#screen-list .title { font-size: 16px; font-weight: bold; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#screen-list .subtitle { font-size: 13px; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#screen-list .bottom-bar { background-color: #000; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
#screen-list .brand-text { font-weight: bold; font-size: 16px; }

/* ================== SETTINGS & ABOUT SCREEN ================== */
#screen-settings, #screen-about { background: #222; }
.header-bar-blue { background-color: #00aeef; padding: 12px 15px; font-size: 24px; font-weight: bold; color: white; }
.menu-list { flex: 1; }
.menu-item { padding: 10px; font-size: 22px; color: white; cursor: pointer; transition: 0.1s; }
.menu-item.focused { background-color: #00aeef; }
.about-content { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
.cloud-icon { width: 100px; height: auto; fill: white; margin-bottom: 10px; }
.app-name { font-size: 32px; font-weight: bold; margin-bottom: 15px; }
.copyright { font-size: 16px; color: #ddd; line-height: 1.5; }
.bottom-bar.flex-end { background: #000; padding: 10px 15px; display: flex; justify-content: flex-end; }
.back-btn { width: 24px; height: 24px; fill: white; cursor: pointer; }

/* Responsive adjustments */
@media (max-width: 180px) {
    .header-bar-blue { font-size: 18px; }
    .menu-item { font-size: 16px; padding: 10px; }
    .app-name { font-size: 20px; }
    .copyright { font-size: 12px; }
    .cloud-icon { width: 60px; }
    #screen-list .icon-wrapper { width: 40px; height: 40px; }
    #screen-list .title { font-size: 13px; }
    #screen-list .subtitle { font-size: 10px; }
    #screen-list .header-bar { font-size: 14px; }
}</style>

// --- SPA ROUTER ---
const router = {
    current: null,
    currentParams: null,
    history: [],
    
    navigate(screenId, params) {
        if (this.current) {
            this.history.push({ id: this.current, params: this.currentParams });
        }
        this.show(screenId, params);
    },
    
    back() {
        if (this.history.length > 0) {
            const prev = this.history.pop();
            this.show(prev.id, prev.params);
        }
    },
    
    show(screenId, params) {
        document.querySelectorAll('.screen').forEach(el => el.style.display = 'none');
        document.getElementById(`screen-${screenId}`).style.display = 'flex';
        this.current = screenId;
        this.currentParams = params;
        
        // Trigger initialization/focus refresh logic per screen
        if (screenId === 'home') homeModule.activate();
        else if (screenId === 'category') categoryModule.activate();
        else if (screenId === 'list') listModule.activate(params?.c);
        else if (screenId === 'pinned') pinnedModule.activate();
        else if (screenId === 'settings') settingsModule.activate();
        else if (screenId === 'about') aboutModule.activate();
    }
};

// --- MODULE: HOME ---
const homeModule = {
    focusList: [], currentIdx: 3, rendered: false,
    activate() {
        if (!this.rendered) {
            const grid = document.getElementById('appGrid');
            const dots = document.getElementById('dotContainer');
            let allApps = [];
            appData.forEach(s => allApps = [...allApps, ...s.apps]);

            allApps.forEach((app, i) => {
                const box = document.createElement('div');
                box.className = 'icon-box focusable';
                box.setAttribute('data-name', app.name);
                if (app.bg) box.style.backgroundColor = app.bg;
                box.innerHTML = `<img src="${app.icon}">`;
                box.onclick = () => { window.location.href = app.url; };
                grid.appendChild(box);

                if (i % 3 === 0) {
                    const d = document.createElement('div');
                    d.className = 'dot';
                    dots.appendChild(d);
                }
            });
            this.rendered = true;
        }
        
        const topBtns = document.querySelectorAll('#screen-home .top-btn.focusable');
        const gridIcons = document.querySelectorAll('#screen-home .icon-box.focusable');
        this.focusList = [...topBtns, ...gridIcons];
        this.refresh();
    },
    refresh() {
        this.focusList.forEach(f => f.classList.remove('focused'));
        const active = this.focusList[this.currentIdx];
        active.classList.add('focused');
        document.getElementById('brandLabel').innerText = active.getAttribute('data-name') || 'CloudChat';
        active.scrollIntoView({ block: "center", behavior: "smooth" });

        const dotList = document.querySelectorAll('#screen-home .dot');
        dotList.forEach(d => d.classList.remove('active'));
        const topCount = document.querySelectorAll('#screen-home .top-btn.focusable').length;
        if (this.currentIdx >= topCount) {
            const rowIdx = Math.floor((this.currentIdx - topCount) / 3);
            if (dotList[rowIdx]) dotList[rowIdx].classList.add('active');
        } else {
            if (dotList[0]) dotList[0].classList.add('active');
        }
    },
    handleKey(e) {
        const L = this.focusList.length;
        const topCount = document.querySelectorAll('#screen-home .top-btn.focusable').length;
        
        if (e.key === 'ArrowRight' && this.currentIdx < L - 1) this.currentIdx++;
        else if (e.key === 'ArrowLeft' && this.currentIdx > 0) this.currentIdx--;
        else if (e.key === 'ArrowDown') {
            if (this.currentIdx < topCount) this.currentIdx = topCount; 
            else if (this.currentIdx + 3 < L) this.currentIdx += 3;
            else this.currentIdx = L - 1;
        } else if (e.key === 'ArrowUp') {
            if (this.currentIdx >= topCount && this.currentIdx < topCount + 3) this.currentIdx = 0; 
            else if (this.currentIdx - 3 >= topCount) this.currentIdx -= 3;
            else this.currentIdx = 0;
        } else if (e.key === 'Backspace') router.back();
        else if (e.key === 'Escape') router.navigate('settings');
        else if (e.key === 'Enter') this.focusList[this.currentIdx].click();
        
        this.refresh();
    }
};

// --- MODULE: CATEGORY ---
const categoryModule = {
    focusables: [], currentIndex: 0, rendered: false,
    activate() {
        if (!this.rendered) {
            const container = document.getElementById('appContent');
            appData.forEach(sec => {
                const h = document.createElement('div');
                h.className = 'header focusable';
                h.innerText = sec.category + ' >';
                h.setAttribute('data-name', sec.category);
                h.onclick = () => router.navigate('list', {c: sec.category});
                container.appendChild(h);

                const g = document.createElement('div'); g.className = 'grid';
                sec.apps.forEach(app => {
                    const card = document.createElement('div');
                    card.className = 'app-card focusable';
                    card.setAttribute('data-name', app.name);
                    if (app.bg) card.style.backgroundColor = app.bg;
                    card.innerHTML = `<img src="${app.icon}" alt="${app.name}">`;
                    card.onclick = () => { window.location.href = app.url; };
                    g.appendChild(card);
                });
                container.appendChild(g);
            });
            this.rendered = true;
        }
        this.focusables = document.querySelectorAll('#screen-category .focusable');
        this.refresh();
    },
    refresh() {
        this.focusables.forEach(el => el.classList.remove('focused'));
        const active = this.focusables[this.currentIndex];
        active.classList.add('focused');
        document.getElementById('catBrandText').innerText = active.getAttribute('data-name');
        active.scrollIntoView({ block: "center", behavior: "smooth" });
    },
    handleKey(e) {
        const total = this.focusables.length;
        if (e.key === 'ArrowRight') {
            if (this.currentIndex < total - 1) this.currentIndex++;
        } else if (e.key === 'ArrowLeft') {
            if (this.currentIndex > 0) this.currentIndex--;
        } else if (e.key === 'ArrowDown') {
            if (this.currentIndex < 3) this.currentIndex = 3; 
            else if (this.currentIndex + 3 < total) this.currentIndex += 3;
            else this.currentIndex = total - 1;
        } else if (e.key === 'ArrowUp') {
            if (this.currentIndex >= 3 && this.currentIndex <= 5) this.currentIndex = 0; 
            else if (this.currentIndex - 3 >= 3) this.currentIndex -= 3;
            else this.currentIndex = 0;
        } else if (e.key === 'Enter') {
            this.focusables[this.currentIndex].click();
        } else if (e.key === 'Backspace') {
            router.back();
        } else if (e.key === 'Escape') {
            router.navigate('settings');
        }
        this.refresh();
    }
};

// --- MODULE: LIST ---
const listModule = {
    focusables: [], activeIdx: 0,
    activate(categoryParam) {
        this.focusables = [];
        this.activeIdx = 0;
        const listArea = document.getElementById('listArea');
        const pageTitle = document.getElementById('pageTitle');
        listArea.innerHTML = '';

        if (!categoryParam) {
            pageTitle.innerText = "Categories";
            appData.forEach(item => {
                const el = this.createItem(item.category, "Browse apps in this category", "https://cdn-icons-png.flaticon.com/512/707/707675.png", item.category, true);
                listArea.appendChild(el);
                this.focusables.push(el);
            });
        } else {
            const foundCat = appData.find(s => s.category.toLowerCase() === categoryParam.toLowerCase());
            if (foundCat) {
                pageTitle.innerText = foundCat.category;
                foundCat.apps.forEach(app => {
                    const el = this.createItem(app.name, "Open " + app.name, app.icon, app.url, false, app.bg);
                    listArea.appendChild(el);
                    this.focusables.push(el);
                });
            } else {
                listArea.innerHTML = "<p style='padding:20px;'>Category not found!</p>";
            }
        }
        if(this.focusables.length > 0) this.refresh();
    },
    createItem(title, sub, icon, actionData, isCategory, bgColor) {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.setAttribute('data-name', title);
        div.innerHTML = `
            <div class="icon-wrapper" style="background:${bgColor || '#fff'}"><img src="${icon}" alt=""></div>
            <div class="text-info"><div class="title">${title}</div><div class="subtitle">${sub}</div></div>
        `;
        div.onclick = () => {
            if (isCategory) router.navigate('list', {c: actionData});
            else window.location.href = actionData; // external app url navigation
        };
        return div;
    },
    refresh() {
        this.focusables.forEach(i => i.classList.remove('focused'));
        if (this.focusables.length === 0) return;
        const active = this.focusables[this.activeIdx];
        active.classList.add('focused');
        document.getElementById('listFooterText').innerText = active.getAttribute('data-name');
        active.scrollIntoView({ block: "nearest", behavior: "smooth" });
    },
    handleKey(e) {
        if (this.focusables.length === 0) {
            if(e.key === 'Backspace' || e.key === 'Escape') router.back();
            return;
        }
        if (e.key === 'ArrowDown' && this.activeIdx < this.focusables.length - 1) this.activeIdx++;
        else if (e.key === 'ArrowUp' && this.activeIdx > 0) this.activeIdx--;
        else if (e.key === 'Enter') this.focusables[this.activeIdx].click();
        else if (e.key === 'Backspace' || e.key === 'Escape') router.back();
        this.refresh();
    }
};

// --- MODULE: SETTINGS ---
const settingsModule = {
    items: null, idx: 0,
    activate() {
        this.items = document.querySelectorAll('#screen-settings .focusable');
        this.refresh();
    },
    refresh() {
        this.items.forEach(i => i.classList.remove('focused'));
        this.items[this.idx].classList.add('focused');
    },
    handleKey(e) {
        if(e.key === 'ArrowDown' && this.idx < this.items.length - 1) this.idx++;
        else if(e.key === 'ArrowUp' && this.idx > 0) this.idx--;
        else if(e.key === 'Enter') this.items[this.idx].click();
        else if(e.key === 'Backspace' || e.key === 'Escape') router.back();
        this.refresh();
    }
};

// --- MODULE: ABOUT ---
const aboutModule = {
    activate() {},
    handleKey(e) {
        if(e.key === 'Backspace' || e.key === 'Escape') router.back();
    }
};

// --- MODULE: PINNED ---
const pinnedModule = {
    activate() {},
    handleKey(e) {
        if(e.key === 'Backspace' || e.key === 'Escape') router.back();
    }
};

// --- GLOBAL KEY LISTENER ---
window.onkeydown = (e) => {
    if (router.current === 'home') homeModule.handleKey(e);
    else if (router.current === 'category') categoryModule.handleKey(e);
    else if (router.current === 'list') listModule.handleKey(e);
    else if (router.current === 'settings') settingsModule.handleKey(e);
    else if (router.current === 'about') aboutModule.handleKey(e);
    else if (router.current === 'pinned') pinnedModule.handleKey(e);
};

// START APP
window.onload = () => router.navigate('home');</script>
</body>
