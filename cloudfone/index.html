        /**
         * 1. <app-card>: The App Icon Component
         */
        class AppCard extends HTMLElement {
            constructor() {
                super();
                this.attachShadow({ mode: 'open' });
            }

            connectedCallback() {
                const name = this.getAttribute('name');
                const url = this.getAttribute('url');
                const path = this.getAttribute('path');
                const color = this.getAttribute('color');
                const delay = this.getAttribute('delay') || '0s';

                this.shadowRoot.innerHTML = `
                    <style>
                        :host { 
                            display: block; 
                            opacity: 0;
                            transform: translateY(20px) scale(0.9);
                            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
                            animation-delay: ${delay};
                        }
                        
                        @keyframes popIn {
                            to { opacity: 1; transform: translateY(0) scale(1); }
                        }

                        a {
                            display: flex;
                            flex-direction: column;
                            align-items: center;
                            justify-content: flex-start;
                            text-decoration: none;
                            gap: 8px;
                            outline: none;
                        }
                        
                        .icon-box {
                            width: 64px; 
                            height: 64px;
                            border-radius: 24%; /* Premium Squircle Look */
                            display: flex; 
                            align-items: center; 
                            justify-content: center;
                            background: linear-gradient(135deg, ${color}cc, ${color});
                            box-shadow: 0 8px 16px ${color}40, inset 0 1px 1px rgba(255,255,255,0.3);
                            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
                            position: relative;
                        }
                        
                        a:hover .icon-box, a:focus .icon-box {
                            transform: scale(1.08) translateY(-2px);
                        }
                        
                        a:active .icon-box { 
                            transform: scale(0.95); 
                        }
                        
                        svg {
                            width: 30px; 
                            height: 30px;
                            fill: #ffffff;
                            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
                        }

                        .title {
                            color: #ffffff;
                            font-size: 12px;
                            font-weight: 500;
                            text-align: center;
                            letter-spacing: 0.3px;
                            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
                            white-space: nowrap;
                            overflow: hidden;
                            text-overflow: ellipsis;
                            max-width: 80px;
                        }
                    </style>
                    <a href="${url}" target="_blank">
                        <div class="icon-box">
                            <svg viewBox="0 0 24 24">
                                <path d="${path}"/>
                            </svg>
                        </div>
                        <span class="title">${name}</span>
                    </a>
                `;
            }
        }
        customElements.define('app-card', AppCard);

        /**
         * 2. <cloud-header>: The Status Bar
         */
        class CloudHeader extends HTMLElement {
            constructor() {
                super();
                this.attachShadow({ mode: 'open' });
            }
            connectedCallback() {
                this.shadowRoot.innerHTML = `
                    <style>
                        header {
                            height: 48px;
                            display: flex;
                            align-items: center;
                            justify-content: space-between;
                            padding: 0 24px;
                            background: rgba(15, 17, 21, 0.3);
                            backdrop-filter: blur(20px);
                            -webkit-backdrop-filter: blur(20px);
                            position: sticky; top: 0; z-index: 10;
                            box-shadow: 0 1px 0 rgba(255,255,255,0.05);
                        }
                        .brand { display: flex; align-items: center; gap: 8px; }
                        h1 { font-size: 15px; color: white; margin: 0; font-weight: 600; letter-spacing: 0.5px; }
                        
                        .right-side { display: flex; align-items: center; gap: 16px; }
                        .time { color: white; font-size: 14px; font-weight: 500; }
                        .status { 
                            display: flex; align-items: center; gap: 6px;
                            font-size: 11px; color: #10b981; 
                            font-weight: 700; letter-spacing: 0.5px;
                        }
                        .dot { width: 6px; height: 6px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }
                    </style>
                    <header>
                        <div class="brand">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="#3b82f6"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
                            <h1>CloudFone</h1>
                        </div>
                        <div class="right-side">
                            <span class="time" id="clock">00:00</span>
                            <div class="status"><div class="dot"></div> ONLINE</div>
                        </div>
                    </header>
                `;

                this.updateClock();
                setInterval(() => this.updateClock(), 1000);
            }

            updateClock() {
                const now = new Date();
                const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                this.shadowRoot.getElementById('clock').textContent = timeStr;
            }
        }
        customElements.define('cloud-header', CloudHeader);

        /**
         * 3. <startup-modal>: The Prompt
         */
        class StartupModal extends HTMLElement {
            constructor() {
                super();
                this.attachShadow({ mode: 'open' });
            }

            connectedCallback() {
                this.shadowRoot.innerHTML = `
                    <style>
                        .overlay {
                            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                            background: rgba(0,0,0,0.6);
                            backdrop-filter: blur(16px);
                            -webkit-backdrop-filter: blur(16px);
                            display: flex; align-items: center; justify-content: center;
                            z-index: 999;
                            transition: opacity 0.4s ease;
                        }
                        .modal {
                            background: rgba(30, 34, 41, 0.65);
                            padding: 32px 24px;
                            border-radius: 24px;
                            width: 85%; max-width: 340px;
                            text-align: center;
                            border: 1px solid rgba(255,255,255,0.1);
                            box-shadow: 0 24px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
                            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
                        }
                        
                        .icon-circle {
                            width: 60px; height: 60px; 
                            background: linear-gradient(135deg, #3b82f6, #2563eb);
                            border-radius: 50%; margin: 0 auto 20px;
                            display: flex; align-items: center; justify-content: center;
                            box-shadow: 0 8px 16px rgba(59, 130, 246, 0.4);
                        }
                        .icon-circle svg { fill: #ffffff; width: 28px; height: 28px; }
                        
                        h2 { margin: 0 0 10px 0; color: white; font-size: 22px; font-weight: 600; }
                        p { margin: 0 0 30px 0; color: #9ca3af; font-size: 15px; line-height: 1.5; }
                        
                        .btn-group { display: flex; gap: 14px; flex-direction: column; }
                        
                        button {
                            border: none; padding: 16px; border-radius: 14px;
                            font-size: 16px; font-weight: 600; cursor: pointer;
                            transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 10px;
                        }
                        
                        .btn-primary { 
                            background: white; 
                            color: #0f1115; 
                        }
                        
                        .btn-secondary { 
                            background: rgba(255,255,255,0.08); 
                            border: 1px solid rgba(255,255,255,0.05); 
                            color: #ffffff; 
                        }
                        
                        button:active { transform: scale(0.96); }
                        .btn-primary:hover { background: #e5e7eb; }
                        .btn-secondary:hover { background: rgba(255,255,255,0.15); }

                        @keyframes slideUp {
                            from { opacity: 0; transform: scale(0.9) translateY(30px); }
                            to { opacity: 1; transform: scale(1) translateY(0); }
                        }
                    </style>
                    <div class="overlay" id="overlay">
                        <div class="modal">
                            <div class="icon-circle">
                                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                            </div>
                            <h2>Welcome to OS</h2>
                            <p>Choose your destination to initialize the workspace.</p>
                            <div class="btn-group">
                                <button class="btn-primary" id="btn-apps">
                                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
                                    Open App Grid
                                </button>
                                <button class="btn-secondary" id="btn-login">
                                    Access Portal
                                </button>
                            </div>
                        </div>
                    </div>
                `;

                this.shadowRoot.getElementById('btn-apps').onclick = () => {
                    const overlay = this.shadowRoot.getElementById('overlay');
                    overlay.style.opacity = '0';
                    setTimeout(() => {
                        this.dispatchEvent(new CustomEvent('choice', { detail: 'apps' }));
                        this.remove(); 
                    }, 400);
                };

                this.shadowRoot.getElementById('btn-login').onclick = () => {
                    this.dispatchEvent(new CustomEvent('choice', { detail: 'login' }));
                };
            }
        }
        customElements.define('startup-modal', StartupModal);

        /**
         * 4. <cloud-os>: Main Container
         */
        class CloudOS extends HTMLElement {
            constructor() {
                super();
                this.attachShadow({ mode: 'open' });
            }

            connectedCallback() {
                this.render();
                this.setupLogic();
            }

            setupLogic() {
                const modal = this.shadowRoot.querySelector('startup-modal');
                const appsContainer = this.shadowRoot.querySelector('.apps-container');
                
                modal.addEventListener('choice', (e) => {
                    if (e.detail === 'apps') {
                        appsContainer.style.display = 'block'; // Reveal apps to trigger CSS animations
                        document.title = "Apps Grid - Cloudfone";
                    } else {
                        document.body.innerHTML = `
                            <div style="display:flex;height:100vh;justify-content:center;align-items:center;color:white;flex-direction:column;text-align:center;">
                                <svg width="60" height="60" fill="#3b82f6" viewBox="0 0 24 24" style="margin-bottom:20px; animation: pulse 1s infinite alternate;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                                <h3 style="font-family:sans-serif;margin-bottom:10px;font-size:20px;">Port 8000</h3>
                                <p style="color:#aaa;font-family:sans-serif;">Redirecting to Login Portal...</p>
                                <style>@keyframes pulse { from { transform: scale(1); opacity: 0.8; } to { transform: scale(1.1); opacity: 1; } }</style>
                            </div>`;
                        setTimeout(() => {
                             window.location.href = 'https://www.cloudfone.com/auth/sign-in';
                        }, 1200);
                    }
                });
            }

            render() {
                // Generate App Cards with staggered animation delays
                const cardsHtml = APPS_DATA.map((app, index) => {
                    const delay = (index * 0.05) + 's';
                    return `<app-card name="${app.name}" url="${app.url}" path="${app.icon}" color="${app.color}" delay="${delay}"></app-card>`;
                }).join('');

                this.shadowRoot.innerHTML = `
                    <style>
                        :host { display: block; height: 100%; }
                        .apps-container {
                            max-width: 900px;
                            margin: 0 auto;
                            padding: 40px 20px;
                            height: calc(100vh - 48px);
                            overflow-y: auto;
                            display: none; /* Hidden until modal choice */
                        }
                        .apps-grid {
                            display: grid;
                            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
                            column-gap: 20px;
                            row-gap: 32px;
                            padding-bottom: 50px;
                        }
                        
                        /* Custom responsive tweaks */
                        @media (min-width: 600px) {
                            .apps-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); row-gap: 40px; }
                        }
                    </style>

                    <cloud-header></cloud-header>
                    <div class="apps-container">
                        <div class="apps-grid">
                            ${cardsHtml}
                        </div>
                    </div>
                    <startup-modal></startup-modal>
                `;
            }
        }
        customElements.define('cloud-os', CloudOS);

    </script>
