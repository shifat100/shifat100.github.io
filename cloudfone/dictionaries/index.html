<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Dictionaries</title>


    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        
        body {
            background-color: #000; /* Dark background outside screen */
            color: white;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .screen {
            width: 100%;
            max-width: 360px;
            min-width: 128px;
            height: 100vh;
            max-height: 480px;
            display: flex;
            flex-direction: column;
            background-color: #2b2b2b;
            border: 1px solid #444;
            position: relative;
        }

        /* Header */
        .header-bar {
            background-color: #000;
            padding: 8px 12px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }

        /* List Container */
        .list-container {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .list-container::-webkit-scrollbar { display: none; }

        /* List Item UI */
        .list-item {
            display: flex;
            align-items: center;
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #3d3d3d;
            transition: background 0.1s;
        }

        /* Icon Square */
        .icon-wrapper {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            margin-right: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            overflow: hidden;
            font-size: 20px;
            font-weight: bold;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Custom Icon Gradients */
        .bg-arabic { background: linear-gradient(135deg, #0ea5e9, #2563eb); }
        .bg-1 { background: linear-gradient(135deg, #10b981, #059669); }
        .bg-2 { background: linear-gradient(135deg, #f59e0b, #ea580c); }
        .bg-3 { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
        .bg-4 { background: linear-gradient(135deg, #ef4444, #b91c1c); }


        /* Text Area */
        .text-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-grow: 1;
        }
        .title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .subtitle {
            font-size: 13px;
            color: #ccc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Focused State */
        .list-item.focused {
            background-color: #1a73e8 !important;
        }
        .list-item.focused .subtitle { color: #fff; }

        /* Bottom Bar */
        .bottom-bar {
            background-color: #000;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .bottom-bar svg { width: 22px; height: 22px; fill: white; }
        .brand-text { font-weight: bold; font-size: 16px; }

        /* Responsiveness for extreme small screens */
        @media (max-width: 180px) {
            .icon-wrapper { width: 40px; height: 40px; font-size: 14px; }
            .title { font-size: 13px; }
            .subtitle { font-size: 10px; }
            .header-bar { font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="screen">
    <div class="header-bar" id="pageTitle">Dictionaries</div>

    <div class="list-container" id="listArea">
        
        <div class="list-item focusable" data-name="Arabic Dictionary" data-url="English Arbic">
            <div class="icon-wrapper bg-arabic">Ar</div>
            <div class="text-info">
                <div class="title">Arabic Dictionary</div>
                <div class="subtitle">English ⇄ Arabic</div>
            </div>
        </div>

        <div class="list-item focusable" data-name="Bangla Dictionary" data-url="English Bangla">
            <img class="icon-wrapper" src="https://shifat100.github.io/cloudfone/dictionaries/English%20Bangla/icons/ic-128.png">
            <div class="text-info">
                <div class="title">Bangla Dictionary</div>
                <div class="subtitle">English ⇄ Bangla</div>
            </div>
        </div>

        <div class="list-item focusable" data-name="Hindi Dictionary" data-url="English Hindi">
            <img class="icon-wrapper" src="https://shifat100.github.io/cloudfone/dictionaries/English%20Hindi/icons/ic-128.png">
            <div class="text-info">
                <div class="title">Hindi Dictionary</div>
                <div class="subtitle">English ⇄ Hindi</div>
            </div>
        </div>

        <div class="list-item focusable" data-name="Tamil Dictionary" data-url="English Tamil">
           <img class="icon-wrapper" src="https://shifat100.github.io/cloudfone/dictionaries/English%20Tamil/icons/ic_112.png">
            <div class="text-info">
                <div class="title">Tamil Dictionary</div>
                <div class="subtitle">English ⇄ Tamil</div>
            </div>
        </div>

        <div class="list-item focusable" data-name="B2B Dictionary" data-url="B2B Dictionary">
            <img class="icon-wrapper" src="https://shifat100.github.io/cloudfone/dictionaries/B2B%20Dictionary/icon.png">
            <div class="text-info">
                <div class="title">B2B Dictionary</div>
                <div class="subtitle">Bangla ⇄ Bangla</div>
            </div>
        </div>

    </div>

    <div class="bottom-bar">
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        <span class="brand-text" id="footerText">Select App</span>
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </div>
</div>

<script>
    let focusableItems = document.querySelectorAll('.focusable');
    let activeIdx = 0;
    const footer = document.getElementById('footerText');

    function launchApp(url) {
        // Using window.open to replicate target="_blank" from original code
        window.open(url, '_blank');
    }

    function refreshFocus() {
        focusableItems.forEach(i => i.classList.remove('focused'));
        if(focusableItems.length === 0) return;
        
        const active = focusableItems[activeIdx];
        active.classList.add('focused');
        footer.innerText = active.getAttribute('data-name');
        active.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }

    // Assign click events to each list item
    focusableItems.forEach((item, index) => {
        item.onclick = () => {
            activeIdx = index; // Update focus on touch/click
            refreshFocus();
            launchApp(item.getAttribute('data-url'));
        };
    });

    // Keyboard Navigation
    window.onkeydown = (e) => {
        if (focusableItems.length === 0) return;
        
        if (e.key === 'ArrowDown' && activeIdx < focusableItems.length - 1) {
            activeIdx++;
        } else if (e.key === 'ArrowUp' && activeIdx > 0) {
            activeIdx--;
        } else if (e.key === 'Enter') {
            launchApp(focusableItems[activeIdx].getAttribute('data-url'));
        } else if (e.key === 'Backspace' || e.key === 'Escape') {
            window.history.back(-1); // Go back like the original list UI
        }
        
        refreshFocus();
    };

    // Initialize focus on load
    refreshFocus();
</script>
</body>
</html>
