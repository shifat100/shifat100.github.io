<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Bangla Dictionary</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={ theme:{ extend:{ colors:{ 'cm-gray-020': '#202020', 'cm-blue-009': '#0093E0', 'cm-blue-05a': '#05AEF2', 'cm-green-00a': '#00A539',}, screens:{ 'cm-qvga':{ 'min': '15rem'}, 'cm-qqvga':{ 'max': '8rem'},}, fontFamily:{ sans: ['Roboto', 'bangla', 'sans-serif'],}}}} </script><style>@font-face{ font-family: 'bangla'; src: url('font.ttf')} *{ box-sizing: border-box; -webkit-user-select: none; user-select: none} ::-webkit-scrollbar{ width: 0px; background: transparent} .focusable:focus .focus-text-white{ color: #ffffff !important} </style></head><body class="bg-black text-white h-screen w-screen overflow-hidden flex flex-col"><div id="loader" class="absolute inset-0 z-50 bg-black/90 flex items-center justify-center"><div class="text-white text-[10px] cm-qvga:text-base font-bold animate-pulse">Loading Dictionary...</div></div><div class="shrink-0 bg-cm-blue-009 text-white flex items-center justify-center w-full cm-qqvga:h-[20px] cm-qvga:h-[40px] shadow-md z-10"><h1 class="m-0 font-bold cm-qqvga:text-[10px] cm-qvga:text-base truncate px-2">Bangla Dictionary</h1></div><div class="shrink-0 bg-cm-gray-020 cm-qqvga:p-1 cm-qvga:p-2 border-b border-gray-700"><input type="text" id="userinput" class="w-full bg-black text-white border border-gray-600 rounded-sm cm-qqvga:px-1 cm-qvga:px-2 py-1 cm-qqvga:text-[10px] cm-qvga:text-sm focus:bg-cm-blue-05a focus:font-bold focus:outline-none placeholder-gray-500" tabindex="0" placeholder="Search or select a letter..."></div><div class="content flex-grow overflow-y-auto relative cm-qqvga:p-[4pt] cm-qvga:p-[8pt]"><div id="app" class="flex flex-col w-full"></div><div id="definition" class="hidden flex-col gap-2 w-full"></div></div><div class="shrink-0 bg-cm-gray-020 flex justify-between items-center text-white f <script>var state={ currentView: "",}; var CloudAd=null; let previousActiveElement=null; let alertKeyupHandler=null; function customAlert(message, title="Alert"){ if (document.getElementById("custom-alert-overlay")){ closeCustomAlert();} previousActiveElement=document.activeElement; const overlay=document.createElement("div"); overlay.id="custom-alert-overlay"; overlay.className="fixed inset-0 z-[9999] bg-black/90 flex flex-col items-center justify-center p-[4pt] cm-qvga:p-[8pt]"; overlay.innerHTML=` <div class="bg-cm-gray-020 border border-gray-600 rounded-sm w-full flex flex-col shadow-lg overflow-hidden max-h-full"><div class="bg-cm-blue-009 text-white font-bold px-2 py-1 cm-qqvga:text-[10px] cm-qvga:text-sm text-center truncate shrink-0">${title} </div><div class="p-2 cm-qqvga:p-1 text-center text-white cm-qqvga:text-[10px] cm-qvga:text-sm overflow-y-auto max-h-[80px] cm-qvga:max-h-[160px]">${message} </div><div class="bg-cm-gray-020 border-t border-gray-700 flex justify-center items-center px-1 cm-qvga:px-2 py-1 shrink-0 h-[20px] cm-qvga:h-[30px]"><div class="text-cm-blue-05a font-bold cm-qqvga:text-[10px] cm-qvga:text-sm uppercase">OK</div></div></div>`; document.body.appendChild(overlay); alertKeyupHandler=function (e){ e.preventDefault(); e.stopPropagation(); if (e.key==="Enter" || e.key==="SoftLeft" || e.key==="SoftRight" || e.key==="F1" || e.key==="F2" || e.key==="Escape"){ closeCustomAlert();}}; document.addEventListener("keyup", alertKeyupHandler, true);} function closeCustomAlert(){ const overlay=document.getElementById("custom-alert-overlay"); if (overlay){ overlay.remove();} if (alertKeyupHandler){ document.removeEventListener("keyup", alertKeyupHandler, true); alertKeyupHandler=null;} if (previousActiveElement && typeof previousActiveElement.focus==='function'){ previousActiveElement.focus();}} window.alert=function (message){ customAlert(message, "App Info");}; function nl2br(e){ return "string" !=typeof e ? "" : e.replace(/\n/g, "<br>")} var app=document.getElementById("app"), userinput=document.getElementById("userinput"), definitionDiv=document.getElementById("definition"), f1=document.getElementById("softkey-left"), f3=document.getElementById("softkey-right"), loader=document.getElementById("loader"), dictionary=[], letterCounts={}, uniqueLetters=[], currentFocusInList=null, xhttp=new XMLHttpRequest; function switchKeyHandler(mode){ document.body.removeEventListener("keyup", keyupApp); document.body.removeEventListener("keyup", keyupDefinitionView); if (mode==='app'){ document.body.addEventListener("keyup", keyupApp);} else if (mode==='definition'){ document.body.addEventListener("keyup", keyupDefinitionView);}} xhttp.onreadystatechange=function (){ if (4===xhttp.readyState){ if (200===xhttp.status){ try{ dictionary=JSON.parse(xhttp.responseText); dictionary.forEach(d=>{ if (d.word){ let firstChar=d.word.charAt(0); letterCounts[firstChar]=(letterCounts[firstChar] || 0) + 1;}}); uniqueLetters=Object.keys(letterCounts).sort();} catch (e){ app.innerHTML='<div class="text-center text-red-500 py-4 font-bold">Error: Could not load dictionary file.</div>'; return;} loader.style.display="none"; showLettersView(); userinput.focus();} else{ app.innerHTML='<div class="text-center text-red-500 py-4 font-bold">Error: Dictionary file not found.</div>';}}}; xhttp.open("GET", "data.json", !0); xhttp.send(); function showLettersView(){ definitionDiv.style.display="none"; app.style.display="flex"; let r=''; r +='<div class="grid grid-cols-3 cm-qvga:grid-cols-4 gap-1 cm-qvga:gap-2">'; uniqueLetters.forEach((letter, index)=>{ r +=`<div class="focusable letter flex flex-col items-center justify-center border border-gray-700 rounded bg-cm-gray-020 focus:bg-cm-blue-05a focus:font-bold focus:outline-none focus:text-white" tabindex="${index + 1}" data-letter="${letter}"><span class="cm-qqvga:text-sm cm-qvga:text-lg font-bold">${letter}</span><span class="text-gray-400 focus-text-white cm-qqvga:text-[5px] cm-qvga:text-[8px] mt-1">${letterCounts[letter]} Words</span></div>`;}); r +='</div>'; app.innerHTML=r; document.querySelectorAll(".letter").forEach(el=>{ el.addEventListener("click", function (){ userinput.value=this.getAttribute("data-letter"); displayResults(userinput.value);});}); f1.innerHTML="About"; f3.innerHTML="Exit"; switchKeyHandler('app'); state.currentView="letters";} function displayResults(e){ let val=e.trim().toLowerCase(); if (val===""){ showLettersView(); return;} var n=dictionary.filter(function (item){ return item.word.toLowerCase().startsWith(val)}), r=""; if (0===n.length){ r='<div class="text-center text-gray-400 cm-qqvga:text-[10px] cm-qvga:text-sm py-4">No Word Found...</div>';} else{ for (var o=0; o < Math.min(100, n.length); o++){ if (o >0 && o % 10===0){ r +=`<div class="focusable ad-wrapper w-full flex justify-center p-1 my-1 border border-gray-700 rounded bg-cm-gray-020 focus:bg-cm-blue-05a focus:outline-none" tabindex="${o + 1}" id="inline-ad-wrapper-${o}"></div>`;} if (n[o].definition){ var i=n[o].definition.replace(/"/g, "&quot;"); if (-1==i.indexOf("<a href=")){ let encodedDef=encodeURIComponent(nl2br(i.replace(/<\/em>/gi, "</em><br>").replace(/Bengali definition/gi, ""))); r +=`<div class="focusable word w-full border-b border-gray-700 truncate cm-qqvga:p-1 cm-qvga:p-2 cm-qqvga:text-[10px] cm-qvga:text-sm focus:bg-cm-blue-05a focus:font-bold focus:outline-none focus:text-white" tabindex="${o + 1}" data-word="${n[o].word}" data-definition="${encodedDef}">${n[o].word} </div>`;}}}} app.innerHTML=r; document.querySelectorAll(".word").forEach(function (e){ e.addEventListener("click", showDefinition)}); document.querySelectorAll(".ad-wrapper").forEach((el, idx)=>{ getCloudAd({ publisher: "080b82ab-b33a-4763-a498-50f464567e49", app: "b2b_dictionary", slot: "inline-ad-" + idx, h: 50, w: 240, container: el, onerror: e=>{}, onready: e=>{ CloudAd=e; e.call("display",{ tabindex: -1, display: "block"});}});}); f1.innerHTML="Search"; f3.innerHTML="Clear"; switchKeyHandler('app'); var a=document.querySelector(".focusable"); if (a && document.activeElement !==userinput) a.focus();state.currentView="results";} function showDefinition(e){ var t=e.currentTarget || document.activeElement; if (t.classList.contains("word")){ currentFocusInList=t; var n=t.getAttribute("data-word"), r=decodeURIComponent(t.getAttribute("data-definition")); definitionDiv.innerHTML=` <div class="font-bold text-white cm-qqvga:text-sm cm-qvga:text-lg mb-1">${n}</div><div class="text-gray-300 cm-qqvga:text-[10px] cm-qvga:text-sm leading-relaxed whitespace-pre-wrap">${r}</div>`; app.style.display="none"; definitionDiv.style.display="flex"; f1.innerHTML=""; f3.innerHTML="Back"; switchKeyHandler('definition');}} function hideDefinition(){ definitionDiv.style.display="none"; app.style.display="flex"; f1.innerHTML="Search"; f3.innerHTML="Clear"; switchKeyHandler('app'); if (currentFocusInList){ currentFocusInList.focus(); currentFocusInList.scrollIntoView({ block: "center"});}} function resetSearch(){ userinput.value=""; showLettersView(); userinput.focus();} function focusNext(dir){ var items=document.querySelectorAll(".focusable"); if (!items || items.length===0) return; var index=Array.prototype.indexOf.call(items, document.activeElement) + dir; if (index >=items.length) index=items.length - 1; if (index < 0) index=0; items[index].focus(); items[index].scrollIntoView({ block: "center"});} function keyupApp(e){ if (document.activeElement===userinput){ switch (e.key){ case "SoftRight": case "F2": if (userinput.value.trim()==="") window.close(); else resetSearch(); break; case "F1": case "Escape": e.preventDefault(); alert("A Bengali Dictionary App By Shifat100"); break; case "ArrowDown": var firstItem=document.querySelector(".focusable"); if (firstItem){ firstItem.focus(); firstItem.scrollIntoView({ block: "center"});} e.preventDefault(); break; case "Enter": e.preventDefault(); displayResults(userinput.value); break;}} else{ var items=document.querySelectorAll(".focusable"); var currentIndex=Array.prototype.indexOf.call(items, document.activeElement); var isGrid=document.activeElement.classList.contains("letter"); var cols=isGrid ? (window.innerWidth >=240 ? 4 : 3) : 1; switch (e.key){ case "ArrowDown": focusNext(cols); e.preventDefault(); break; case "ArrowUp": if (currentIndex < cols){ userinput.focus();} else{ focusNext(-cols);} e.preventDefault(); break; case "ArrowRight": if (isGrid){ focusNext(1); e.preventDefault();} break; case "ArrowLeft": if (isGrid){ focusNext(-1); e.preventDefault();} break; case "Enter": e.preventDefault(); if (document.activeElement.classList.contains("letter") || document.activeElement.classList.contains("word")){ document.activeElement.click();} else if (document.activeElement.classList.contains("ad-wrapper")){ let adElement=document.activeElement.querySelector('a, [role="button"], [tabindex]'); if (adElement) adElement.click();} break; case "SoftRight": case "F2": if (userinput.value==="") window.close(); else resetSearch(); break; case "Escape": case "F1": if(state.currentView=="letters"){ alert("A Bengali Dictionary App By Shifat100");} else{ userinput.focus();} break;}}} function keyupDefinitionView(e){ if ("SoftRight"===e.key || "F2"===e.key){ hideDefinition();} else if ("ArrowUp"===e.key){ document.querySelector(".content").scrollBy(0, -40);} else if ("ArrowDown"===e.key){ document.querySelector(".content").scrollBy(0, 40);} else if ("Escape"===e.key){ CloudAd.call('click');}} userinput.addEventListener("change", function (){ displayResults(this.value);}); window.addEventListener("back", (event)=>{ event.preventDefault(); simulateNaturalPress('SoftRight', 0);}); getCloudAd({ publisher: "080b82ab-b33a-4763-a498-50f464567e49", app: "b2b_dictionary", slot: "showdefination", onerror: e=>{}, onready: e=>{ e.call("display")}});</script></body></html>
