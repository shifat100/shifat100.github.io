<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaiOS Player</title>
    <style>
        /* Base Styling for Smart Feature Phones (QVGA standard sizing) */
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* UI Overlays */
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.8) 100%);
            box-sizing: border-box;
            padding: 10px;
        }

        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #app-title {
            font-size: 14px;
            font-weight: bold;
            color: #ff9800;
        }

        #channel-info {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 8px 15px;
            border-radius: 20px;
            margin: 0 auto;
        }

        /* Directional Channel Arrows */
        .arrow {
            font-size: 20px;
            color: #ff9800;
            margin: 0 15px;
            display: inline-block;
            transition: transform 0.1s ease, color 0.1s ease;
        }

        /* Click pulse/scale animation */
        .arrow-animate {
            color: #ffffff !important;
            transform: scale(1.4);
        }

        #channel-name {
            font-size: 16px;
            font-weight: bold;
        }

        #play-state-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        #play-state-indicator.show {
            opacity: 1;
        }

        #play-state-indicator svg {
            width: 30px;
            height: 30px;
            fill: #fff;
        }

        /* Softkey bar styling */
        #softkey-bar {
            height: 30px;
            background-color: #222;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            box-sizing: border-box;
            padding: 0 10px;
            z-index: 3;
            border-top: 1px solid #333;
        }

        .softkey-label {
            width: 33.33%;
        }

        .softkey-label.left {
            text-align: left;
        }

        .softkey-label.center {
            text-align: center;
        }

        .softkey-label.right {
            text-align: right;
            color: #ff3b30;
        }
    </style>
</head>
<body>

    <div id="video-container">
        <!-- Add a fallback video; plays in loop -->
        <video id="player" autoplay loop>
            <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
        </video>
    </div>

    <!-- UI Overlay -->
    <div id="ui-overlay">
        <div id="header">
            <span id="app-title">LIVE TV</span>
        </div>

        <!-- Channel Display -->
        <div id="channel-info">
            <span id="prev-arrow" class="arrow">&larr;</span>
            <span id="channel-name">Channel 1</span>
            <span id="next-arrow" class="arrow">&rarr;</span>
        </div>

        <!-- Center Play/Pause Indicator HUD -->
        <div id="play-state-indicator">
            <svg id="indicator-icon" viewBox="0 0 24 24"></svg>
        </div>

        <div></div> <!-- Spacing spacer -->
    </div>

    <!-- Bottom Softkey Indicators -->
    <div id="softkey-bar">
        <span class="softkey-label left"></span>
        <span class="softkey-label center">Play/Pause</span>
        <span class="softkey-label right">Back</span>
    </div>

    <script>
        // Sample channels list
        const channels = [
            { name: "Big Buck Bunny", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" },
            { name: "Elephants Dream", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" },
            { name: "For Bigger Blazes", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" },
            { name: "Sintel Project", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4" }
        ];

        let currentChannelIndex = 0;
        const player = document.getElementById('player');
        const channelNameEl = document.getElementById('channel-name');
        const prevArrow = document.getElementById('prev-arrow');
        const nextArrow = document.getElementById('next-arrow');
        const indicator = document.getElementById('play-state-indicator');
        const indicatorIcon = document.getElementById('indicator-icon');

        // SVG Icons
        const playIconPath = '<path d="M8 5v14l11-7z"/>';
        const pauseIconPath = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

        // Load channel stream
        function loadChannel(index) {
            if (index < 0) {
                currentChannelIndex = channels.length - 1;
            } else if (index >= channels.length) {
                currentChannelIndex = 0;
            } else {
                currentChannelIndex = index;
            }
            
            const activeChannel = channels[currentChannelIndex];
            channelNameEl.textContent = activeChannel.name;
            
            player.src = activeChannel.url;
            player.load();
            player.play().catch(err => console.log("Stream autoplay state change:", err));
        }

        // Initialize with default channel
        loadChannel(currentChannelIndex);

        // Play and Pause Toggle
        function togglePlayPause() {
            if (player.paused) {
                player.play();
                showIndicator(playIconPath);
            } else {
                player.pause();
                showIndicator(pauseIconPath);
            }
        }

        // Action HUD Display Helper
        let indicatorTimeout;
        function showIndicator(iconPath) {
            indicatorIcon.innerHTML = iconPath;
            indicator.classList.add('show');
            clearTimeout(indicatorTimeout);
            indicatorTimeout = setTimeout(() => {
                indicator.classList.remove('show');
            }, 800);
        }

        // Click animations on directional UI elements
        function animateArrow(direction) {
            const targetArrow = direction === 'prev' ? prevArrow : nextArrow;
            targetArrow.classList.add('arrow-animate');
            setTimeout(() => {
                targetArrow.classList.remove('arrow-animate');
            }, 150);
        }

        // Fallback Volume control for testing in a PC browser (without volumeManager APIs)
        function fallbackVolumeAdjust(amount) {
            let newVolume = player.volume + amount;
            if (newVolume > 1) newVolume = 1;
            if (newVolume < 0) newVolume = 0;
            player.volume = newVolume;
        }

        // Exit / Back Event handler for SoftRight Key
        function handleBackAction() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.close(); // Standard app exit command on KaiOS
            }
        }

        // Central Keyboard Input Event Listener
        document.addEventListener('keydown', function(e) {
            switch (e.key) {
                // SoftRight Key mapping (with F2 for browser debugging)
                case 'SoftRight':
                case 'F2':
                    e.preventDefault();
                    handleBackAction();
                    break;

                // Left Arrow (Channel Back)
                case 'ArrowLeft':
                    e.preventDefault();
                    animateArrow('prev');
                    loadChannel(currentChannelIndex - 1);
                    break;

                // Right Arrow (Channel Forward)
                case 'ArrowRight':
                    e.preventDefault();
                    animateArrow('next');
                    loadChannel(currentChannelIndex + 1);
                    break;

                // Enter Key (Play / Pause Toggle)
                case 'Enter':
                case 'Select':
                    e.preventDefault();
                    togglePlayPause();
                    break;

                // Volume Control (Up)
                case 'ArrowUp':
                    e.preventDefault();
                    if (navigator.volumeManager) {
                        navigator.volumeManager.requestUp();
                    } else {
                        fallbackVolumeAdjust(0.1); // Fallback for local testing
                    }
                    break;

                // Volume Control (Down)
                case 'ArrowDown':
                    e.preventDefault();
                    if (navigator.volumeManager) {
                        navigator.volumeManager.requestDown();
                    } else {
                        fallbackVolumeAdjust(-0.1); // Fallback for local testing
                    }
                    break;
                
                default:
                    break;
            }
        });
    </script>
</body>
</html>
