<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudAds SDK Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .demo-container {
            max-width: 500px;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .ad-slot {
            width: 100%;
            min-height: 60px;
            background: #eee;
            margin: 20px 0;
            border: 2px dashed #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        button {
            background: #0093E0;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background: #007bb8;
        }
        code {
            background: #272822;
            color: #f8f8f2;
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .label {
            font-weight: bold;
            color: #666;
            margin-bottom: 10px;
            display: block;
        }
    </style>

    <!-- 1. Load the Library via path -->
    <script src="cloud.v1.ads-min.js"></script>
</head>
<body>

    <div class="demo-container">
        <h1>CloudAds SDK Demo</h1>
        <p>This page demonstrates how to implement Banner and Fullscreen ads.</p>

        <hr>

        <!-- Banner Ad Section -->
        <span class="label">Banner Ad Format:</span>
        <div id="banner-container" class="ad-slot">
            Ad will load here...
        </div>
        <button onclick="showBannerAd()">Reload Banner Ad</button>

        <hr>

        <!-- Fullscreen Ad Section -->
        <span class="label">Interstitial Format:</span>
        <p>Click the button below to trigger a fullscreen experience.</p>
        <button onclick="showFullscreenAd()">Show Fullscreen Ad</button>
    </div>

    <script>
        window.getCloudAd =  function (config) {
        processAdRequest(config);
    };
        /**
         * NOTE: In the provided library, window.getCloudAd is an empty function.
         * The library processes ads via window.cloudAdsQueue.
         * We push the config to the queue to trigger the ads.
         */

        // --- BANNER AD IMPLEMENTATION ---
        function showBannerAd() {
            const bannerConfig = {
                publisher: 'pub-12345', // Required: Publisher ID
                container: document.getElementById('banner-container'), // Target Element
                w: '100%', // Optional: Width
                h: '60',    // Optional: Height
                onready: function(ad) {
                    console.log("Banner ready!");
                    // Call display to actually show the ad
                    ad.call('display', { tabindex: 0 });
                },
                onerror: function(err) {
                    console.error("Banner Error:", err.error);
                }
            };

            // Push to queue as per SDK architecture
            window.cloudAdsQueue.push(bannerConfig);
            
            // Since the library processes the queue on load, 
            // we manually call the internal process function if available,
            // or just re-trigger the queue loop.
            // Because the library loop only runs once at the start, 
            // for a demo, we simulate the call.
            processAdRequestManual(bannerConfig);
        }

        // --- FULLSCREEN AD IMPLEMENTATION ---
        function showFullscreenAd() {
            const fsConfig = {
                publisher: 'pub-12345', // Required
                // No container = Fullscreen mode
                onready: function(ad) {
                    console.log("Fullscreen ready!");
                    ad.call('display');
                },
                onerror: function(err) {
                    console.error("FS Error:", err.error);
                }
            };

            window.cloudAdsQueue.push(fsConfig);
            processAdRequestManual(fsConfig);
        }

        /**
         * Helper function because the original library's 
         * window.getCloudAd was commented out.
         * This mimics the library's internal 'processAdRequest' 
         * by accessing the logic if we were to modify the SDK.
         */
        function processAdRequestManual(config) {
            // Since processAdRequest is private inside the IIFE in cloudads.js,
            // to make this demo work without changing your JS file, 
            // you should uncomment 'processAdRequest(config);' inside 
            // window.getCloudAd in your cloudads.js file.
            
            if (window.getCloudAd) {
                window.getCloudAd(config);
            } else {
                alert("Please uncomment 'processAdRequest(config);' inside the getCloudAd function in cloudads.js to enable manual triggers.");
            }
        }

        // Load a banner on page start
        window.onload = showBannerAd;
    </script>
</body>
</html>
