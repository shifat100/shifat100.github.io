<!DOCTYPE html><html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Browser</title>
  <style>
    :root {
      --primary-bg: #f0f2f5;
      --secondary-bg: #ffffff;
      --header-bg: #2c3e50;
      --header-text: #ffffff;
      --text-color: #333;
      --border-color: #dcdcdc;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background-color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .phone {
      width: 100%;
      max-width: 240px;
      aspect-ratio: 3/4;
      border: 4px solid #333;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      background-color: var(--primary-bg);
      overflow: hidden;
    }
    .top-bar {
      background-color: var(--header-bg);
      color: var(--header-text);
      text-align: center;
      padding: 4px;
      font-size: 14px;
      font-weight: bold;
    }
    .address-container {
      background-color: var(--secondary-bg);
      padding: 5px;
      border-bottom: 1px solid var(--border-color);
      position: relative;
    }
    .url-bar-input {
      width: calc(100% - 30px);
      padding: 5px 8px;
      border: 1px solid var(--border-color);
      border-radius: 15px;
      font-size: 12px;
    }
    .add-bookmark {
      position: absolute;
      right: 8px;
      top: 7px;
      background: #2ecc71;
      color: white;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 14px;
      line-height: 18px;
      text-align: center;
      cursor: pointer;
    }
    .search-engine-list, .url-suggestions {
      display: none;
      position: absolute;
      top: 38px;
      left: 5px;
      width: calc(100% - 10px);
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 5px;
      z-index: 10;
      padding: 3px;
      text-align: center;
    }
    .search-engine-list span,
    .url-suggestions span {
      display: inline-block;
      background: #eee;
      padding: 2px 6px;
      margin: 2px;
      border-radius: 10px;
      font-size: 10px;
      cursor: pointer;
    }
    .browser-content {
      flex-grow: 1;
      padding: 8px;
      overflow-y: auto;
    }
    .quick-links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
      gap: 6px;
    }
    .grid-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--text-color);
      font-size: 10px;
    }
    .grid-item img {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      background: white;
      border: 1px solid var(--border-color);
    }
    .bookmark-list {
      margin-top: 10px;
    }
    .bookmark-list h4 {
      font-size: 12px;
      margin-bottom: 4px;
      text-align: center;
    }
    .bookmark-item {
      font-size: 10px;
      margin: 2px 0;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
    }
    .bookmark-item a {
      color: #2c3e50;
      text-decoration: none;
      max-width: 80%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .delete-btn {
      background: red;
      color: white;
      border: none;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      font-size: 12px;
      line-height: 16px;
      cursor: pointer;
    }
    .bottom-nav {
      background-color: var(--header-bg);
      display: flex;
      justify-content: space-around;
      padding: 4px 0;
    }
    .bottom-nav a {
      color: white;
      font-size: 16px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="top-bar">X Browser</div>
    <div class="address-container">
      <input type="text" class="url-bar-input" placeholder="URL বা সার্চ করুন..." autocomplete="off">
      <button class="add-bookmark">+</button>
      <div class="search-engine-list">
        <span data-engine="google">Google</span>
        <span data-engine="bing">Bing</span>
        <span data-engine="yahoo">Yahoo</span>
      </div>
      <div class="url-suggestions">
        <span data-suffix=".com">.com</span>
        <span data-suffix=".bd">.bd</span>
        <span data-suffix=".net">.net</span>
        <span data-suffix=".org">.org</span>
        <span data-suffix=".xyz">.xyz</span>
      </div>
    </div>
    <div class="browser-content">
      <div class="quick-links-grid">
        <a href="https://www.google.com" class="grid-item"><img src="https://www.google.com/s2/favicons?domain=google.com"><span>Google</span></a>
        <a href="https://www.facebook.com" class="grid-item"><img src="https://www.google.com/s2/favicons?domain=facebook.com"><span>Facebook</span></a>
        <a href="https://www.youtube.com" class="grid-item"><img src="https://www.google.com/s2/favicons?domain=youtube.com"><span>YouTube</span></a>
        <a href="https://www.wikipedia.org" class="grid-item"><img src="https://www.google.com/s2/favicons?domain=wikipedia.org"><span>Wikipedia</span></a>
      </div>
      <div class="bookmark-list">
        <h4>বুকমার্ক</h4>
        <div id="bookmarks"></div>
      </div>
    </div>
    <div class="bottom-nav">
      <a href="#"></a>
      <a href="#">OK</a>
      <a href="#">Exit</a>
    </div>
  </div>  <script>
    const input = document.querySelector('.url-bar-input');
    const engineList = document.querySelector('.search-engine-list');
    const suffixList = document.querySelector('.url-suggestions');
    const bookmarkBtn = document.querySelector('.add-bookmark');
    const bookmarkContainer = document.getElementById('bookmarks');

    function loadBookmarks() {
      const saved = JSON.parse(localStorage.getItem('bookmarks') || '[]');
      bookmarkContainer.innerHTML = '';
      saved.forEach((url, index) => {
        const div = document.createElement('div');
        div.className = 'bookmark-item';
        div.innerHTML = `<a href="${url}" target="_blank">${url}</a> <button class="delete-btn" data-index="${index}">×</button>`;
        bookmarkContainer.appendChild(div);
      });
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const i = parseInt(btn.dataset.index);
          saved.splice(i, 1);
          localStorage.setItem('bookmarks', JSON.stringify(saved));
          loadBookmarks();
        });
      });
    }

    input.addEventListener('input', () => {
      const value = input.value.trim();
      engineList.style.display = 'none';
      suffixList.style.display = 'none';
      if (value.includes(' ') || /^[^\s.]+$/.test(value)) {
        engineList.style.display = 'block';
      } else if (/\.$/.test(value)) {
        suffixList.style.display = 'block';
      }
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleInput();
    });

    function handleInput() {
      const query = input.value.trim();
      if (!query) return;

      if (query.includes(' ') || /^[^\s.]+$/.test(query)) {
        engineList.style.display = 'block';
      } else if (/\.$/.test(query)) {
        suffixList.style.display = 'block';
      } else if (/\./.test(query)) {
        let url = query;
        if (!/^https?:\/\//.test(url)) url = 'https://' + url;
        window.location.href = url;
      }
    }

    engineList.addEventListener('click', (e) => {
      if (e.target.tagName === 'SPAN') {
        const engine = e.target.dataset.engine;
        const query = input.value.trim();
        let url = '';
        if (engine === 'google') url = 'https://www.google.com/search?q=' + encodeURIComponent(query);
        else if (engine === 'bing') url = 'https://www.bing.com/search?q=' + encodeURIComponent(query);
        else if (engine === 'yahoo') url = 'https://search.yahoo.com/search?p=' + encodeURIComponent(query);
        window.location.href = url;
      }
    });

    suffixList.addEventListener('click', (e) => {
      if (e.target.tagName === 'SPAN') {
        let base = input.value.replace(/\.+$/, '');
        const suffix = e.target.dataset.suffix;
        const url = 'https://' + base + suffix;
        window.location.href = url;
      }
    });

    bookmarkBtn.addEventListener('click', () => {
      const value = input.value.trim();
      if (!value) return;
      let url = value;
      if (!/^https?:\/\//.test(url)) url = 'https://' + url;
      const saved = JSON.parse(localStorage.getItem('bookmarks') || '[]');
      if (!saved.includes(url)) {
        saved.push(url);
        localStorage.setItem('bookmarks', JSON.stringify(saved));
        loadBookmarks();
      }
    });

    loadBookmarks();
  </script></body>
    </html>
