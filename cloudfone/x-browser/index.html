<!DOCTYPE html><html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Browser</title>
  <style>
    :root {
      --primary-bg: #f0f2f5;
      --secondary-bg: #ffffff;
      --header-bg: #2c3e50;
      --header-text: #ffffff;
      --text-color: #333;
      --border-color: #dcdcdc;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background-color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .phone {
      width: 100%;
      max-width: 240px;
      aspect-ratio: 3/4;
      border: 0px solid #333;
      border-radius: 0px;
      display: flex;
      flex-direction: column;
      background-color: var(--primary-bg);
      overflow: hidden;
    }
    .top-bar {
      background-color: var(--header-bg);
      color: var(--header-text);
      text-align: center;
      padding: 4px;
      font-size: 14px;
      font-weight: bold;
    }
    .address-container {
      background-color: var(--secondary-bg);
      padding: 5px;
      border-bottom: 1px solid var(--border-color);
      position: relative;
    }
    .url-bar-input {
      width: calc(100% - 30px);
      padding: 5px 8px;
      border: 1px solid var(--border-color);
      border-radius: 15px;
      font-size: 12px;
    }
    .add-bookmark {
      position: absolute;
      right: 8px;
      top: 7px;
      background: #2ecc71;
      color: white;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 14px;
      line-height: 18px;
      text-align: center;
      cursor: pointer;
    }
    .search-engine-list, .url-suggestions {
      display: none;
      position: absolute;
      top: 38px;
      left: 5px;
      width: calc(100% - 10px);
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 5px;
      z-index: 10;
      padding: 3px;
      text-align: center;
    }
    .search-engine-list span,
    .url-suggestions span {
      display: inline-block;
      background: #eee;
      padding: 2px 6px;
      margin: 2px;
      border-radius: 10px;
      font-size: 10px;
      cursor: pointer;
    }
    .browser-content {
      flex-grow: 1;
      padding: 8px;
      overflow-y: auto;
    }
    .quick-links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
      gap: 12px 6px; /* Increased row gap for better spacing */
    }
    .grid-item {
      position: relative; /* CHANGED: Added for positioning the delete button */
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--text-color);
      font-size: 10px;
    }
    .grid-item img {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      background: white;
      border: 1px solid var(--border-color);
    }
    /* CHANGED: Added style for the text to handle overflow */
    .grid-item span {
        width: 100%;
        text-align: center;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        margin-top: 2px;
    }
    .bookmark-list {
      margin-top: 10px;
    }
    .bookmark-list h4 {
      font-size: 12px;
      padding-bottom: 10px;
      text-align: center;
      font-weight: bold;
    }
    
    /* REMOVED: Old .bookmark-item styles are no longer needed */

    /* CHANGED: Updated delete button style for corner positioning */
    .delete-btn {
      position: absolute;
      top: -5px;
      right: -5px;
      background: red;
      color: white;
      border: 1px solid white;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      font-size: 12px;
      line-height: 16px;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bottom-nav {
      background-color: var(--header-bg);
      display: flex;
      justify-content: space-around;
      padding: 4px 0;
    }
    .bottom-nav a {
      color: white;
      font-size: 16px;
      text-decoration: none;
      /* NEW: Added for better button appearance */
      min-width: 50px;
      text-align: center;
      cursor: pointer;
    }
  </style>

  <script>
    const input = document.querySelector('.url-bar-input');
    const engineList = document.querySelector('.search-engine-list');
    const suffixList = document.querySelector('.url-suggestions');
    const bookmarkBtn = document.querySelector('.add-bookmark');
    const bookmarkContainer = document.getElementById('bookmarks');
    // --- NEW: Reference to the "Go" button ---
    const goBtn = document.querySelector('.bottom-nav a:first-child');

    function loadBookmarks() {
      const saved = JSON.parse(localStorage.getItem('bookmarks') || '[]');
      if(saved.length <1) {bookmarkContainer.innerHTML = '<small style="background: #ddd; padding:8px 4px; border-radius: 5px; font-size: 10px; text-align: center">No Bookmark</small>';} else {
      bookmarkContainer.innerHTML = '';
      saved.forEach((url, index) => {
        const linkCard = document.createElement('a');
        linkCard.className = 'grid-item';
        linkCard.href = url;
        linkCard.target = '_blank';
        const hostname = new URL(url).hostname.replace(/^www\./, '');
        linkCard.innerHTML = `
          <img src="https://www.google.com/s2/favicons?domain=${hostname}" alt="${hostname}">
          <span>${hostname}</span>
          <button class="delete-btn" data-index="${index}">×</button>
        `;
        bookmarkContainer.appendChild(linkCard);
      });
      }
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const i = parseInt(btn.dataset.index);
          const currentBookmarks = JSON.parse(localStorage.getItem('bookmarks') || '[]');
          currentBookmarks.splice(i, 1);
          localStorage.setItem('bookmarks', JSON.stringify(currentBookmarks));
          loadBookmarks();
        });
      });
    }

    // --- UPDATED: Input listener to control the "Go" button text ---
    input.addEventListener('input', () => {
      const value = input.value.trim();
      engineList.style.display = 'none';
      suffixList.style.display = 'none';
      goBtn.innerText = ''; // Reset button text

      if (!value) return;

      if (value.includes(' ') || /^[^\s.]+$/.test(value)) {
        engineList.style.display = 'block';
      } else if (/\.$/.test(value)) {
        suffixList.style.display = 'block';
      } else if (value.includes('.') && !value.includes(' ')) {
        // If it looks like a URL, show the "Go" button
        goBtn.innerText = 'Go';
      }
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleInput();
    });

    // --- NEW: Added listener for F1 key to open the link/search ---
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            e.preventDefault(); // Prevent browser's default help action
            handleInput();
        }
    });

    // --- FUNCTION UPDATED: More robust navigation logic ---
    function handleInput() {
      const query = input.value.trim();
      if (!query) return;

      // If the query contains a dot and no spaces, treat it as a URL
      if (/\./.test(query) && !query.includes(' ')) {
        let url = query;
        if (!/^https?:\/\//.test(url)) url = 'https://' + url;
        window.location.href = url;
      } else {
        // Otherwise, perform a default search with Google
        const searchUrl = 'https://www.google.com/search?q=' + encodeURIComponent(query);
        window.location.href = searchUrl;
      }
    }

    engineList.addEventListener('click', (e) => {
      if (e.target.tagName === 'SPAN') {
        const engine = e.target.dataset.engine;
        const query = input.value.trim();
        let url = '';
        if (engine === 'google') url = 'https://www.google.com/search?q=' + encodeURIComponent(query);
        else if (engine === 'bing') url = 'https://www.bing.com/search?q=' + encodeURIComponent(query);
        else if (engine === 'yahoo') url = 'https://search.yahoo.com/search?p=' + encodeURIComponent(query);
        window.location.href = url;
      }
    });

    suffixList.addEventListener('click', (e) => {
      if (e.target.tagName === 'SPAN') {
        let base = input.value.replace(/\.+$/, '');
        const suffix = e.target.dataset.suffix;
        const url = 'https://' + base + suffix;
        window.location.href = url;
      }
    });

    bookmarkBtn.addEventListener('click', () => {
      const value = input.value.trim();
      if (!value || !value.includes('.')) { 
        alert("Please enter a valid URL to bookmark.");
        return;
      };
      let url = value;
      if (!/^https?:\/\//.test(url)) url = 'https://' + url;
      const saved = JSON.parse(localStorage.getItem('bookmarks') || '[]');
      if (!saved.includes(url)) {
        saved.push(url);
        localStorage.setItem('bookmarks', JSON.stringify(saved));
        loadBookmarks();
      }
    });
    
    // --- NEW: Make the "Go" button clickable ---
    goBtn.addEventListener('click', (e) => {
        e.preventDefault();
        handleInput();
    });

    loadBookmarks();
  </script>
