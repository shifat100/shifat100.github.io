<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaiOS অ্যাপ স্টোর</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        /* সার্চ বার স্টাইল */
        .search-container {
            margin-bottom: 30px;
            width: 100%;
            max-width: 500px;
        }

        #searchBar {
            width: 100%;
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 25px;
            outline: none;
            transition: border-color 0.3s;
        }

        #searchBar:focus {
            border-color: var(--accent-color);
        }

        /* অ্যাপ লিস্ট স্টাইল */
        #app-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        .app-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: transform 0.2s;
        }

        .app-card:hover {
            transform: translateY(-5px);
        }

        .app-icon {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .app-name {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin: 10px 0 5px 0;
        }

        .app-subtitle {
            font-size: 14px;
            color: #666;
            font-style: italic;
            margin-bottom: 10px;
        }

        .app-description {
            font-size: 14px;
            color: #777;
            margin-bottom: 20px;
            line-height: 1.4;
            height: 40px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .manifest-btn {
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .manifest-btn:hover {
            background-color: #2980b9;
        }

        .no-result {
            text-align: center;
            font-size: 18px;
            color: #888;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <h1>KaiOS অ্যাপ লাইব্রেরি</h1>

    <div class="search-container">
        <input type="text" id="searchBar" placeholder="অ্যাপের নাম দিয়ে সার্চ করুন..." onkeyup="filterApps()">
    </div>

    <div id="app-list">
        <!-- ডাটা এখানে লোড হবে -->
        <p style="text-align: center; grid-column: 1/-1;">লোড হচ্ছে...</p>
    </div>

    <script>
        let allApps = []; // সব অ্যাপ ডাটা এখানে জমা থাকবে

        // XHR ব্যবহার করে JSON ফাইল লোড করা
        function loadApps() {
            const xhr = new XMLHttpRequest();
            xhr.open('GET', 'app_list.txt', true); // আপনার ফাইলের নাম app_list.txt

            xhr.onload = function() {
                if (this.status === 200) {
                    try {
                        const response = JSON.parse(this.responseText);
                        allApps = response.data; // JSON এর 'data' অ্যারেটি নেওয়া হচ্ছে
                        displayApps(allApps);
                    } catch (e) {
                        console.error("JSON পার্স করতে সমস্যা হয়েছে:", e);
                        document.getElementById('app-list').innerHTML = "ডাটা লোড করতে সমস্যা হয়েছে।";
                    }
                } else {
                    document.getElementById('app-list').innerHTML = "ফাইলটি খুঁজে পাওয়া যায়নি।";
                }
            };

            xhr.onerror = function() {
                document.getElementById('app-list').innerHTML = "নেটওয়ার্ক সমস্যা হয়েছে।";
            };

            xhr.send();
        }

        // অ্যাপগুলো স্ক্রিনে দেখানোর ফাংশন
        function displayApps(apps) {
            const container = document.getElementById('app-list');
            container.innerHTML = ''; // আগের কন্টেন্ট পরিষ্কার করা

            if (apps.length === 0) {
                container.innerHTML = '<p class="no-result">কোনো অ্যাপ পাওয়া যায়নি!</p>';
                return;
            }

            apps.forEach(app => {
                const card = document.createElement('div');
                card.className = 'app-card';

                card.innerHTML = `
                    <img src="${app.thumbnail_url}" alt="${app.name}" class="app-icon">
                    <div class="app-name">${app.name}</div>
                    <div class="app-subtitle">${app.summary || 'কোন সাবটাইটেল নেই'}</div>
                    <div class="app-description">${app.description}</div>
                    <a href="${app.manifest_url}" target="_blank" class="manifest-btn">Manifest URL</a>
                `;
                container.appendChild(card);
            });
        }

        // সার্চ ফিল্টার ফাংশন
        function filterApps() {
            const searchTerm = document.getElementById('searchBar').value.toLowerCase();
            const filtered = allApps.filter(app => 
                app.name.toLowerCase().includes(searchTerm) || 
                (app.summary && app.summary.toLowerCase().includes(searchTerm))
            );
            displayApps(filtered);
        }

        // পেজ লোড হলে ডাটা কল করা
        window.onload = loadApps;
    </script>
</body>
</html>
