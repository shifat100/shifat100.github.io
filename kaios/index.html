<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Optimized for QVGA (240x320) and QQVGA (128x160) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KaiOS App Hub</title>
    <style>
        /* OLD BROWSER CSS - No Grid, No Flex Gap, No CSS Variables */
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 0;
            font-size: 12px;
        }

        /* Header - Professional Purple Theme from Source Code */
        header {
            background-color: #6f02b5;
            color: #ffffff;
            padding: 12px 5px;
            text-align: center;
            border-bottom: 3px solid #4a0084;
        }

        .logo {
            font-size: 16px;
            font-weight: bold;
            display: block;
            text-transform: uppercase;
        }

        /* Controls Area */
        .controls {
            background-color: #ffffff;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .search-box, .sort-box {
            width: 100%;
            margin-bottom: 8px;
        }

        input[type="text"], select {
            width: 94%;
            padding: 6px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fafafa;
        }

        /* App List Container */
        .main-content {
            padding: 8px;
        }

        /* App Card - Float based for old Gecko engines */
        .app-card {
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 12px;
            padding: 10px;
            overflow: hidden; /* Clearfix */
            display: block;
        }

        /* App Icon */
        .app-icon {
            width: 50px;
            height: 50px;
            float: left;
            margin-right: 10px;
            border: 1px solid #eee;
            border-radius: 8px;
            background: #fff;
        }

        /* Info Area */
        .app-info {
            float: left;
            width: calc(100% - 65px);
            overflow: hidden;
        }

        .app-name {
            font-weight: bold;
            font-size: 14px;
            display: block;
            color: #6f02b5;
            margin-bottom: 2px;
        }

        .app-subtitle {
            font-size: 11px;
            color: #888;
            display: block;
            margin-bottom: 4px;
        }

        .app-description {
            font-size: 11px;
            color: #666;
            display: block;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        /* Install Button - Linking to Manifest URL */
        .install-btn {
            background-color: #6f02b5;
            color: #ffffff;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 4px;
            display: inline-block;
            text-align: center;
            border: 1px solid #4a0084;
        }

        .install-btn:active {
            background-color: #4a0084;
        }

        /* Status Message */
        .status-msg {
            text-align: center;
            padding: 30px 10px;
            color: #999;
        }

        /* Clearfix helper */
        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }

        /* QQVGA (128x160) Extreme Optimization */
        @media screen and (max-width: 140px) {
            .app-icon {
                width: 36px;
                height: 36px;
            }
            .app-info {
                width: calc(100% - 50px);
            }
            .logo { font-size: 13px; }
            body { font-size: 11px; }
            .app-name { font-size: 12px; }
        }
    </style>
</head>
<body>

    <header>
        <span class="logo">KaiOS App Store</span>
    </header>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchBar" placeholder="Search apps..." onkeyup="handleUpdate()">
        </div>
        <div class="sort-box">
            <select id="sortSelect" onchange="handleUpdate()">
                <option value="name-asc">Name (A-Z)</option>
                <option value="name-desc">Name (Z-A)</option>
                <option value="size-asc">Size (Smallest)</option>
                <option value="size-desc">Size (Largest)</option>
                <option value="date-desc">Newest First</option>
            </select>
        </div>
    </div>

    <div class="main-content" id="app-container">
        <div class="status-msg">Loading apps...</div>
    </div>

    <script>
        var allApps = [];

        function fetchApps() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'app_list.txt', true);

            xhr.onload = function() {
                if (xhr.status === 200) {
                    try {
                        var response = JSON.parse(xhr.responseText);
                        allApps = response.data;
                        handleUpdate();
                    } catch (e) {
                        showStatus("JSON Parse Error.");
                    }
                } else {
                    showStatus("App list not found.");
                }
            };

            xhr.onerror = function() { showStatus("Network Error."); };
            xhr.send();
        }

        function handleUpdate() {
            var apps = allApps.slice();

            // Filter (indexOf for old browser support)
            var searchTerm = document.getElementById('searchBar').value.toLowerCase();
            apps = apps.filter(function(app) {
                var name = app.name.toLowerCase();
                var summary = (app.summary || "").toLowerCase();
                return name.indexOf(searchTerm) !== -1 || summary.indexOf(searchTerm) !== -1;
            });

            // Sort
            var sortVal = document.getElementById('sortSelect').value;
            apps.sort(function(a, b) {
                if (sortVal === 'name-asc') return a.name.localeCompare(b.name);
                if (sortVal === 'name-desc') return b.name.localeCompare(a.name);
                if (sortVal === 'size-asc') return a.size - b.size;
                if (sortVal === 'size-desc') return b.size - a.size;
                if (sortVal === 'date-desc') return b.release_date - a.release_date;
                return 0;
            });

            render(apps);
        }

        function render(apps) {
            var container = document.getElementById('app-container');
            container.innerHTML = '';

            if (apps.length === 0) {
                showStatus("No apps found.");
                return;
            }

            for (var i = 0; i < apps.length; i++) {
                var app = apps[i];
                var card = document.createElement('div');
                card.className = 'app-card clearfix';

                /* 
                   Correct Logic based on source and KaiOS:
                   The source code used bundle_id to go to a detail page.
                   To trigger an INSTALL, we must point the browser to the manifest_url.
                */
                var installLink = app.manifest_url;

                card.innerHTML = 
                    '<img src="' + app.thumbnail_url + '" class="app-icon">' +
                    '<div class="app-info">' +
                        '<span class="app-name">' + app.name + '</span>' +
                        '<span class="app-subtitle">' + (app.summary || 'Application') + '</span>' +
                        '<span class="app-description">' + app.description + '</span>' +
                        '<a href="' + installLink + '" class="install-btn">Install</a>' +
                    '</div>';
                
                container.appendChild(card);
            }
        }

        function showStatus(msg) {
            document.getElementById('app-container').innerHTML = '<div class="status-msg">' + msg + '</div>';
        }

        window.onload = fetchApps;
    </script>
</body>
</html>
