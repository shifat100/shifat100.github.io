<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Essential for mobile zooming and fit -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KaiOS Hub</title>
    <style>
        /* OLD BROWSER COMPATIBLE CSS - No Grid, No Gap, No Vars */
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f0f0f0;
            color: #333;
            margin: 0;
            padding: 0;
            font-size: 12px; /* Smaller base font for tiny screens */
        }

        /* Header */
        header {
            background-color: #4f46e5;
            color: #ffffff;
            padding: 10px;
            text-align: center;
            border-bottom: 2px solid #333;
        }

        .logo {
            font-size: 16px;
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
        }

        /* Controls Section */
        .controls {
            background-color: #fff;
            padding: 8px;
            border-bottom: 1px solid #ccc;
        }

        .search-box, .sort-box {
            width: 100%;
            margin-bottom: 8px;
        }

        input[type="text"], select {
            width: 95%;
            padding: 5px;
            font-size: 12px;
            border: 1px solid #999;
            background: #fff;
        }

        /* Layout Containers */
        .main-content {
            padding: 5px;
        }

        /* APP CARD - Using Block/Float for old browser support */
        .app-card {
            background-color: #ffffff;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            padding: 8px;
            overflow: hidden; /* Clearfix */
            display: block;
        }

        /* QQVGA/QVGA Optimized Image */
        .app-icon {
            width: 48px;
            height: 48px;
            float: left;
            margin-right: 10px;
            border: 1px solid #ddd;
            background: #eee;
        }

        .app-info {
            float: left;
            width: calc(100% - 65px); /* Subtract icon width + margin */
            overflow: hidden;
        }

        .app-name {
            font-weight: bold;
            font-size: 13px;
            display: block;
            color: #000;
        }

        .app-subtitle {
            font-size: 11px;
            color: #666;
            display: block;
            margin-bottom: 4px;
        }

        .app-description {
            font-size: 11px;
            color: #777;
            display: block;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        /* Install Button */
        .install-btn {
            background-color: #4f46e5;
            color: #ffffff;
            text-decoration: none;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 3px;
            display: inline-block;
            text-align: center;
        }

        .install-btn:active {
            background-color: #333;
        }

        /* Status Message */
        .status-msg {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        /* CLEARFIX for floats */
        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }

        /* QQVGA Specific Override (128px width) */
        @media screen and (max-width: 140px) {
            .app-icon {
                width: 32px;
                height: 32px;
            }
            .app-info {
                width: calc(100% - 42px);
            }
            .logo { font-size: 12px; }
            body { font-size: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <span class="logo">KaiOS Apps</span>
    </header>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchBar" placeholder="Search..." onkeyup="handleUpdate()">
        </div>
        <div class="sort-box">
            <select id="sortSelect" onchange="handleUpdate()">
                <option value="name-asc">A-Z</option>
                <option value="name-desc">Z-A</option>
                <option value="size-asc">Smallest</option>
                <option value="size-desc">Largest</option>
                <option value="date-desc">Newest</option>
            </select>
        </div>
    </div>

    <div class="main-content" id="app-container">
        <div class="status-msg">Loading...</div>
    </div>

    <script>
        var allApps = [];

        function fetchApps() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'app_list.txt', true);

            xhr.onload = function() {
                if (xhr.status === 200) {
                    try {
                        var response = JSON.parse(xhr.responseText);
                        allApps = response.data;
                        handleUpdate();
                    } catch (e) {
                        showStatus("Error loading data.");
                    }
                } else {
                    showStatus("File not found.");
                }
            };

            xhr.onerror = function() { showStatus("Network error."); };
            xhr.send();
        }

        function handleUpdate() {
            var apps = allApps.slice(); // Clone array

            // Filter
            var searchTerm = document.getElementById('searchBar').value.toLowerCase();
            apps = apps.filter(function(app) {
                return app.name.toLowerCase().indexOf(searchTerm) !== -1 || 
                       (app.summary && app.summary.toLowerCase().indexOf(searchTerm) !== -1);
            });

            // Sort
            var sortVal = document.getElementById('sortSelect').value;
            apps.sort(function(a, b) {
                if (sortVal === 'name-asc') return a.name.localeCompare(b.name);
                if (sortVal === 'name-desc') return b.name.localeCompare(a.name);
                if (sortVal === 'size-asc') return a.size - b.size;
                if (sortVal === 'size-desc') return b.size - a.size;
                if (sortVal === 'date-desc') return b.release_date - a.release_date;
                return 0;
            });

            render(apps);
        }

        function render(apps) {
            var container = document.getElementById('app-container');
            container.innerHTML = '';

            if (apps.length === 0) {
                showStatus("No apps found.");
                return;
            }

            for (var i = 0; i < apps.length; i++) {
                var app = apps[i];
                var card = document.createElement('div');
                card.className = 'app-card clearfix';

                // IMPORTANT: The link is changed to kaios-store://app/[id] 
                // to open the store and start the installation process.
                var storeLink = 'kaios-store://app/' + app.id;

                card.innerHTML = 
                    '<img src="' + app.thumbnail_url + '" class="app-icon">' +
                    '<div class="app-info">' +
                        '<span class="app-name">' + app.name + '</span>' +
                        '<span class="app-subtitle">' + (app.summary || '') + '</span>' +
                        '<span class="app-description">' + app.description + '</span>' +
                        '<a href="' + storeLink + '" class="install-btn">Install</a>' +
                    '</div>';
                
                container.appendChild(card);
            }
        }

        function showStatus(msg) {
            document.getElementById('app-container').innerHTML = '<div class="status-msg">' + msg + '</div>';
        }

        window.onload = fetchApps;
    </script>
</body>
</html>
