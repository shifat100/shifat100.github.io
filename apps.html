<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shifat100</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ddd;
      color: #000;
    }
    header {
      padding: 20px;
      text-align: center;
      background: #fff;
    }
    h1 {
      margin: 0;
      font-size: 1.8em;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      background: #eee;
      padding: 10px;
    }
    nav button {
      background: none;
      border: none;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      font-size: 1em;
    }
    nav button:hover {
      text-decoration: underline;
    }
    section {
      padding: 30px 10px;
      text-align: center;
    }
    section h2 {
      color: #000;
      margin-bottom: 10px;
    }
    .filters {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .filters button {
      background: #262626;
      color: #fff;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 5px;
    }
    .filters button:hover {
      background: #03dac6;
      color: #000;
    }
    .search-box {
      margin-bottom: 20px;
    }
    .search-box input {
      padding: 5px;
      width: 80%;
      max-width: 400px;
      border: none;
      border-radius: 5px;
    }
    .app-list {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .app {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
      text-align: center;
    }
    .app img {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .app h3 {
      margin: 5px 0;
    }
    .app p {
      font-size: 0.9em;
      color: #aaa;
    }
    .app a {
      display: inline-block;
      margin-top: 10px;
      color: #ffffff;
      background: #000;
      padding: 5px 10px;
      border-radius: 5px;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Shifat100</h1>
  </header>

  <nav>
    <button onclick="window.location.href='index.html';">KaiOS</button>
    <button onclick="showSection('kaios')">KaiOS</button>
    <button onclick="showSection('cloudfone')">CloudFone</button>
  </nav>

  <section id="kaios">
    <h2>KaiOS Apps</h2>
    <div class="search-box">
      <input type="text" id="search-kaios" onkeyup="filterApps('kaios')" placeholder="Search KaiOS apps...">
    </div>
    <div class="filters">
      <button onclick="setFilter('kaios', 'all')">All</button>
      <button onclick="setFilter('kaios', 'app')">Apps</button>
      <button onclick="setFilter('kaios', 'game')">Games</button>
    </div>
    <div class="app-list" id="kaios-list"></div>
  </section>

  <section id="cloudfone" style="display: none;">
    <h2>CloudFone (Android) Apps</h2>
    <div class="search-box">
      <input type="text" id="search-cloudfone" onkeyup="filterApps('cloudfone')" placeholder="Search CloudFone apps...">
    </div>
    <div class="filters">
      <button onclick="setFilter('cloudfone', 'all')">All</button>
      <button onclick="setFilter('cloudfone', 'app')">Apps</button>
      <button onclick="setFilter('cloudfone', 'game')">Games</button>
    </div>
    <div class="app-list" id="cloudfone-list"></div>
  </section>

  <script>
    var allApps = [];
    var currentFilter = {
      kaios: 'all',
      cloudfone: 'all'
    };

    function loadApps() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'apps.json', true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4 && xhr.status === 200) {
          var result = JSON.parse(xhr.responseText);
          allApps = result.apps || [];
          filterApps('kaios');
        }
      };
      xhr.send();
    }

    function setFilter(platform, type) {
      currentFilter[platform] = type;
      filterApps(platform);
    }

    function filterApps(platform) {
      var listId = platform + '-list';
      var inputId = 'search-' + platform;
      var container = document.getElementById(listId);
      var searchValue = document.getElementById(inputId).value.toLowerCase();
      container.innerHTML = '';

      var i, app;
      for (i = 0; i < allApps.length; i++) {
        app = allApps[i];
        if (
          app.platform === platform &&
          (currentFilter[platform] === 'all' || app.type === currentFilter[platform]) &&
          app.name.toLowerCase().indexOf(searchValue) !== -1
        ) {
          var appEl = document.createElement('div');
          appEl.className = 'app';

          var html = '';
          html += '<img src="' + app.icon + '" alt="' + app.name + ' Icon" />';
          html += '<h3>' + app.name + '</h3>';
          html += '<p>' + app.description + '</p>';
          html += '<a href="' + app.link + '">View App</a>';

          appEl.innerHTML = html;
          container.appendChild(appEl);
        }
      }
    }

    function showSection(section) {
      document.getElementById('kaios').style.display = section === 'kaios' ? 'block' : 'none';
      document.getElementById('cloudfone').style.display = section === 'cloudfone' ? 'block' : 'none';
      filterApps(section);
    }

    window.onload = function () {
      loadApps();
      showSection('kaios');
    };
  </script>

</body>
</html>
