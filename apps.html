<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shifat100</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ddd;
      color: #000000;
    }
    header {
      padding: 20px;
      text-align: center;
      background: #fff;
    }
    h1 {
      margin: 0;
      font-size: 1.8em;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      background: #eee;
      padding: 10px;
    }
    nav a {
      color: #000;
      text-decoration: none;
      font-weight: bold;
    }
  nav button {
  background: none;
  border: none;
  color: #000;
  font-weight: bold;
  cursor: pointer;
  font-size: 1em;
}
nav button:hover {
  text-decoration: underline;
}
    section {
      padding: 30px 10px;
      text-align: center;
    }
    section h2 {
      color: #000;
      margin-bottom: 20px;
    }
    .app-list {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .app {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
      text-align: center;
    }
    .app img {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .app h3 {
      margin: 5px 0;
    }
    .app p {
      font-size: 0.9em;
      color: #aaa;
    }
    .app a {
      display: inline-block;
      margin-top: 10px;
      color: #ffffff;
      background: #000;
      padding: 5px 10px;
      border-radius: 5px;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Shifat100</h1>
  </header>

  <nav>
    <a href="index.html">Home</a>
  <button onclick="showSection('kaios')">KaiOS</button>
  <button onclick="showSection('cloudfone')">CloudFone</button>
</nav>

<section id="kaios">
  <h2>KaiOS Apps</h2>
  <div class="app-list" id="kaios-list"></div>
</section>

<section id="cloudfone" style="display: none;">
  <h2>CloudFone (Android) Apps</h2>
  <div class="app-list" id="cloudfone-list"></div>
</section>

 <script>
  function loadApps() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'apps.json', true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4 && xhr.status === 200) {
        var data = JSON.parse(xhr.responseText);
        var kaiosList = document.getElementById('kaios-list');
        var cloudfoneList = document.getElementById('cloudfone-list');

        for (var i = 0; i < data.apps.length; i++) {
          var app = data.apps[i];
          var appEl = document.createElement('div');
          appEl.className = 'app';

          var html = '<img loading="lazy" src="' + app.icon + '" alt="' + app.name + ' Icon" />';
          html += '<h3>' + app.name + '</h3>';
          html += '<p>' + app.description + '</p>';
          html += '<a href="' + app.link + '">View App</a>';
          appEl.innerHTML = html;

          if (app.platform === 'kaios') {
            kaiosList.appendChild(appEl);
          } else if (app.platform === 'cloudfone') {
            cloudfoneList.appendChild(appEl);
          }
        }
      }
    };
    xhr.send();
  }

  function showSection(section) {
    document.getElementById('kaios').style.display = section === 'kaios' ? 'block' : 'none';
    document.getElementById('cloudfone').style.display = section === 'cloudfone' ? 'block' : 'none';
    document.getElementById(section).scrollIntoView({ behavior: 'smooth' });
  }

  window.onload = function () {
    loadApps();
    showSection('kaios'); // Default to KaiOS on load
  };
</script>

</body>
</html>
