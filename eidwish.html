<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Camera Error 0x00F...</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,900;1,900&family=Cinzel:wght@700&display=swap" rel="stylesheet"><style>*{ box-sizing: border-box; margin: 0; padding: 0; user-select: none;} body{ background-color: #030305; color: #fff; overflow: hidden; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Montserrat', sans-serif; perspective: 1200px;} #start-screen{ position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #050505; z-index: 3000; cursor: pointer; overflow: hidden;} .oled-line{ position: absolute; top: 0; height: 100%; box-shadow: 0 0 8px currentColor; z-index: 3050; transition: opacity 0.2s;} @keyframes oledFlicker{ 0%, 100%{ opacity: 1;} 50%{ opacity: 0.3;} 70%{ opacity: 0.8;}} .fake-camera-ui{ position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3010; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 50px;} .camera-text-row{ display: flex; justify-content: center; gap: 20px; font-size: 12px; font-weight: bold; letter-spacing: 1px; margin-bottom: 20px; text-shadow: 0 0 5px #000;} .camera-text-row span{ color: rgba(255, 255, 255, 0.7);} .camera-text-row .active{ color: #ffd700;} .camera-shutter{ width: 70px; height: 70px; border-radius: 50%; border: 4px solid #fff; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);} .camera-shutter-inner{ width: 50px; height: 50px; border-radius: 50%; background: rgba(255, 255, 255, 0.9);} #tap-instruction{ position: absolute; top: 40%; width: 100%; text-align: center; color: #fff; font-size: 1.5rem; font-weight: 900; z-index: 3020; text-shadow: 0 0 15px #000, 0 0 5px #000; animation: pulseText 1s infinite alternate; pointer-events: none;} @keyframes pulseText{ to{ transform: scale(1.1); opacity: 0.5;}} #stage{ position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; flex-wrap: wrap; align-content: center; gap: 15px; padding: 20px;} .shake{ animation: screenShake 0.4s cubic-bezier(.36, .07, .19, .97) both;} @keyframes screenShake{ 0%, 100%{ transform: translate3d(0, 0, 0);} 20%{ transform: translate3d(-15px, 10px, 0) scale(1.02);} 40%{ transform: translate3d(15px, -10px, 0) scale(1.02);} 60%{ transform: translate3d(-10px, 15px, 0) scale(1.02);} 80%{ transform: translate3d(10px, -15px, 0) scale(1.02);}} .kinetic-word{ font-size: 10vw; line-height: 1; text-transform: uppercase; opacity: 0; text-align: center; transform-style: preserve-3d; animation: stompIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;} @keyframes stompIn{ 0%{ transform: scale(4) translateZ(400px); opacity: 0; filter: blur(10px);} 100%{ transform: scale(1) translateZ(0); opacity: 1; filter: blur(0px);}} .svg-mandala{ width: 80vmin; height: 80vmin; fill: none; stroke-width: 3; animation: rotateMandala 6s linear infinite;} .draw-path{ stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: drawLine 3s ease-out forwards;} @keyframes drawLine{ to{ stroke-dashoffset: 0;}} @keyframes rotateMandala{ to{ transform: rotate(360deg) scale(1.1);}} .neon-moon{ width: 60vmin; height: 60vmin; fill: none; stroke-width: 4; animation: glitchNeon 4s forwards;} @keyframes glitchNeon{ 0%{ opacity: 0; transform: scale(0.8) skewX(20deg); filter: drop-shadow(0 0 0px var(--color));} 5%, 15%{ opacity: 1; transform: scale(1.1) skewX(-10deg); filter: drop-shadow(0 0 50px var(--color));} 10%, 20%{ opacity: 0;} 25%, 100%{ opacity: 1; transform: scale(1) skewX(0); filter: drop-shadow(0 0 30px var(--color)) drop-shadow(0 0 60px var(--color));}} .rocket-lantern{ position: absolute; width: 12vmin; animation: shootAcross 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;} @keyframes shootAcross{ 0%{ transform: translate(var(--startX), var(--startY)) scale(0.5) rotate(var(--rot)); opacity: 1; filter: drop-shadow(0 0 20px var(--color));} 100%{ transform: translate(var(--endX), var(--endY)) scale(2) rotate(var(--rot)); opacity: 0;}} .svg-burst{ position: absolute; width: 40vmin; height: 40vmin; animation: explodeBurst 1.5s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;} @keyframes explodeBurst{ 0%{ transform: scale(0); opacity: 1; filter: drop-shadow(0 0 50px var(--color));} 100%{ transform: scale(2.5); opacity: 0; filter: drop-shadow(0 0 0px var(--color));}} .svg-mosque{ width: 90vmin; height: 90vmin; fill: none; stroke-width: 2; animation: mosqueReveal 4s forwards;} @keyframes mosqueReveal{ 0%{ opacity: 0; transform: translateY(50px) scale(0.9);} 20%, 100%{ opacity: 1; transform: translateY(0) scale(1); filter: drop-shadow(0 0 20px var(--color));}} #end-banner{ position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #112a38 0%, #030a0f 100%); z-index: 2000; display: none; justify-content: center; align-items: center; opacity: 0; transition: opacity 1.5s ease; overflow: hidden;} .gold-star{ position: absolute; width: 4px; height: 4px; background: #ffd700; border-radius: 50%; box-shadow: 0 0 10px #ffd700; animation: fall linear infinite; opacity: 0.6;} @keyframes fall{ to{ transform: translateY(100vh); opacity: 0;}} .banner-content{ background: rgba(10, 15, 25, 0.85); border: 2px solid #d4af37; box-shadow: 0 0 30px rgba(212, 175, 55, 0.2), inset 0 0 20px rgba(212, 175, 55, 0.1); padding: 40px 30px; border-radius: 15px; text-align: center; width: 90%; max-width: 450px; z-index: 10; position: relative; transform: scale(0.8); transition: transform 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); backdrop-filter: blur(10px);} .banner-content::before, .banner-content::after{ content: ''; position: absolute; width: 40px; height: 40px; border: 2px solid #d4af37;} .banner-content::before{ top: 10px; left: 10px; border-right: none; border-bottom: none;} .banner-content::after{ bottom: 10px; right: 10px; border-left: none; border-top: none;} .banner-icon{ width: 80px; height: 80px; margin-bottom: 15px; fill: #d4af37; filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.5));} .banner-content h1{ font-family: 'Cinzel', serif; color: #ffd700; font-size: 2.2rem; margin-bottom: 15px; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8); letter-spacing: 2px;} .banner-content p{ font-family: 'Montserrat', sans-serif; font-size: 1.1rem; font-weight: 400; line-height: 1.6; color: #e0e0e0; margin-bottom: 30px;} .invite-btn{ background: linear-gradient(135deg, #d4af37, #aa8000); color: #000; font-size: 1.1rem; font-weight: 900; border: none; padding: 15px 35px; border-radius: 5px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4); transition: all 0.3s ease;} </style></head><body><div id="start-screen" onclick="startExperience()"><div id="tap-instruction">TAP TO START</div></div><div id="stage"></div><div id="end-banner"><div class="banner-content" id="banner-box"><svg class="banner-icon" viewBox="0 0 100 100"><path d="M50,10 C60,10 75,25 75,45 L75,90 L25,90 L25,45 C25,25 40,10 50,10 Z M50,20 L50,90 M35,40 L35,90 M65,40 L65,90" fill="none" stroke="#d4af37" stroke-width="2" /><path d="M40,30 A20,20 0 1,0 60,50 A15,15 0 1,1 40,30 Z" fill="#d4af37" /></svg><h1>EID MUBARAK!</h1><p>You survived the glitch!<br><br>Now, you are officially invited over to celebrate. Good vibes, amazing desserts, and fresh Biryani are waiting for you.</p><button class="invite-btn" onclick="acceptInvite()">I'll Be There!</button></div></div><script>function gup(name, loc=window.location.href){ name=name.replace(/[\[]/, "\\\[").replace(/[\]]/, "\\\]"); var regexS="[\\?&]" + name + "=([^&#]*)"; var regex=new RegExp(regexS); var results=regex.exec(loc); if (results==null) return ""; else return results[1]} //==========================================// ⚙️ SETTING: GENDER OF YOUR BEST FRIEND ⚙️ var FRIEND_GENDER='male'; // 'male' or 'female' //==========================================if (gup('to')=='mitu' || gup('g')=='f'){ FRIEND_GENDER='female'} const stage=document.getElementById('stage'); const body=document.body; //===1. DYNAMIC BROKEN OLED LINE GENERATOR (1 to 25 Max)===const startScreen=document.getElementById('start-screen'); const MAX_LINES=25; let activeLines=[]; function makefullscreen(){ // 1. AUTO FULLSCREEN REQUEST let elem=document.documentElement; if (elem.requestFullscreen){ elem.requestFullscreen().catch(e=>console.log(e))} else if (elem.webkitRequestFullscreen){ elem.webkitRequestFullscreen()} else if (elem.msRequestFullscreen){ elem.msRequestFullscreen()}} function generateLine(){ const line=document.createElement('div'); line.className='oled-line'; line.style.left=Math.random() * 100 + 'vw'; line.style.width=(Math.random() * 4 + 1) + 'px'; // 1px to 5px thick const randColor=Math.random(); if (randColor < 0.70){ line.style.backgroundColor='#00ff00'; // Green line.style.color='#00ff00'} else if (randColor < 0.90){ line.style.backgroundColor='#ff00ff'; // Magenta line.style.color='#ff00ff'} else{ line.style.backgroundColor='#ffffff'; // White line.style.color='#ffffff'} if (Math.random() >0.4){ line.style.animation=`oledFlicker ${Math.random() * 0.5 + 0.1}s infinite alternate`} startScreen.appendChild(line); return line} // Logic to randomly increase/decrease the lines over time function fluctuateLines(){ const action=Math.random(); // 60% chance to add a line (if below max) if (action >0.4 && activeLines.length < MAX_LINES){ const linesToAdd=Math.floor(Math.random() * 3) + 1; for (let i=0; i < linesToAdd; i++){ if (activeLines.length >=MAX_LINES) break; activeLines.push(generateLine())}} // 40% chance to remove a line (if lines exist) else if (action <=0.4 && activeLines.length >2){ const linesToRemove=Math.floor(Math.random() * 2) + 1; for (let i=0; i < linesToRemove; i++){ let oldLine=activeLines.shift(); if (oldLine && oldLine.parentNode) oldLine.parentNode.removeChild(oldLine)}}} // Start fluctuating the lines every 150 milliseconds let lineInterval=setInterval(fluctuateLines, 150); //===🎵 AUDIO ENGINE 🎵===let audioCtx; let noiseBuffer; function initAudio(){ audioCtx=new (window.AudioContext || window.webkitAudioContext)(); const bufferSize=audioCtx.sampleRate * 2; noiseBuffer=audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate); const output=noiseBuffer.getChannelData(0); for (let i=0; i < bufferSize; i++) output[i]=Math.random() * 2 - 1} function playSound(type){ if (!audioCtx) return; const osc=audioCtx.createOscillator(); const gain=audioCtx.createGain(); const filter=audioCtx.createBiquadFilter(); if (type==='slam'){ osc.type='sine'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); gain.gain.setValueAtTime(1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4); osc.connect(gain).connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.5)} else if (type==='shoot'){ osc.type='triangle'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.3); gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.connect(gain).connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.3)} else if (type==='glitch'){ osc.type='square'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); osc.frequency.setValueAtTime(2000, audioCtx.currentTime + 0.05); osc.frequency.setValueAtTime(400, audioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15); osc.connect(gain).connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.2)} else if (type==='explosion'){ const noiseSrc=audioCtx.createBufferSource(); noiseSrc.buffer=noiseBuffer; filter.type='lowpass'; filter.frequency.setValueAtTime(2000, audioCtx.currentTime); filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.5); gain.gain.setValueAtTime(0.8, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5); noiseSrc.connect(filter).connect(gain).connect(audioCtx.destination); noiseSrc.start(); noiseSrc.stop(audioCtx.currentTime + 0.5)} else if (type==='sweep'){ osc.type='sawtooth'; osc.frequency.setValueAtTime(50, audioCtx.currentTime); filter.type='bandpass'; filter.frequency.setValueAtTime(100, audioCtx.currentTime); filter.frequency.exponentialRampToValueAtTime(3000, audioCtx.currentTime + 2); gain.gain.setValueAtTime(0, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 1); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 3); osc.connect(filter).connect(gain).connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 3)}} //===🗣️ TEXT-TO-SPEECH ENGINE===function speakWord(text){ if ('speechSynthesis' in window){ let utterance=new SpeechSynthesisUtterance(text); utterance.rate=1.3; // Speak slightly fast to match animation utterance.pitch=1.1; window.speechSynthesis.speak(utterance)}} //===TEXT GENERATOR===function getTexts(gender){ const common=[ ["EID", "MUBARAK", "BESTIE!"], ["GET READY", "FOR THE", "FOOD COMA"], ["STAY AWESOME", "TODAY &", "ALWAYS"] ]; const specific=gender==='male' ? [ ["TO MY", "FAVORITE", "BROTHER"], ["LOOKING", "HANDSOME", "TODAY!"], ["MY GUY,", "EID", "MUBARAK!"] ] : [ ["TO MY", "FAVORITE", "SISTER"], ["LOOKING", "GORGEOUS", "TODAY!"], ["MY QUEEN,", "EID", "MUBARAK!"] ]; return [...common, ...specific].sort(()=>Math.random() - 0.5)} //===SVG LIBRARY===const SVGS={ mandala: `<svg class="svg-mandala" viewBox="0 0 200 200"><polygon class="draw-path" points="100,10 120,70 190,50 140,100 190,150 120,130 100,190 80,130 10,150 60,100 10,50 80,70" /><circle class="draw-path" cx="100" cy="100" r="45" style="animation-delay: 0.5s"/><rect class="draw-path" x="65" y="65" width="70" height="70" transform="rotate(45 100 100)" style="animation-delay: 1s"/></svg>`, moon: `<svg class="neon-moon" viewBox="0 0 100 100"><path d="M65,10 A40,40 0 1,0 95,65 A30,30 0 1,1 65,10 Z" /></svg>`, lantern: `<svg class="rocket-lantern" viewBox="0 0 50 100"><polygon points="25,0 45,25 40,80 25,100 10,80 5,25" fill="var(--color)"/><rect x="20" y="25" width="10" height="55" fill="#fff" /><circle cx="25" cy="12" r="4" fill="#fff"/></svg>`, burst: `<svg class="svg-burst" viewBox="0 0 100 100"><g stroke="var(--color)" stroke-width="3" stroke-linecap="round"><line x1="50" y1="10" x2="50" y2="40" /><line x1="50" y1="90" x2="50" y2="60" /><line x1="10" y1="50" x2="40" y2="50" /><line x1="90" y1="50" x2="60" y2="50" /><line x1="20" y1="20" x2="40" y2="40" /><line x1="80" y1="80" x2="60" y2="60" /><line x1="80" y1="20" x2="60" y2="40" /><line x1="20" y1="80" x2="40" y2="60" /></g></svg>`, mosque: `<svg class="svg-mosque" viewBox="0 0 200 200"><path class="draw-path" d="M100,40 Q130,80 140,120 L140,180 L60,180 L60,120 Q70,80 100,40 Z" /><rect class="draw-path" x="30" y="90" width="15" height="90" style="animation-delay: 0.5s"/><polygon class="draw-path" points="25,90 50,90 37.5,50" style="animation-delay: 0.5s"/><rect class="draw-path" x="155" y="90" width="15" height="90" style="animation-delay: 0.8s"/><polygon class="draw-path" points="150,90 175,90 162.5,50" style="animation-delay: 0.8s"/></svg>`}; function getRandomNeon(){ const hues=[0, 45, 180, 280, 320, 150]; return `hsl(${hues[Math.floor(Math.random() * hues.length)]}, 100%, 60%)`} function clearStage(){ stage.innerHTML=''; body.classList.remove('shake')} //===SCENE RENDERING===function sceneText(wordData){ clearStage(); const themeColor=getRandomNeon(); wordData.forEach((word, index)=>{ setTimeout(()=>{ body.classList.remove('shake'); void body.offsetWidth; body.classList.add('shake'); playSound('slam'); speakWord(word); // 🗣️ READ THE WORD OUT LOUD! const span=document.createElement('div'); span.className='kinetic-word'; span.innerText=word; span.style.color=index % 2===0 ? '#fff' : themeColor; span.style.textShadow=`3px 3px 0px ${themeColor}, -2px -2px 15px ${themeColor}`; stage.appendChild(span)}, index * 400)}); return (wordData.length * 400) + 2000} const graphicScenes=[ function sceneMandala(){ clearStage(); stage.innerHTML=SVGS.mandala; stage.firstElementChild.style.stroke=getRandomNeon(); playSound('sweep'); return 3000}, function sceneMoon(){ clearStage(); stage.innerHTML=SVGS.moon; const color=getRandomNeon(); stage.firstElementChild.style.stroke=color; stage.firstElementChild.style.setProperty('--color', color); body.classList.add('shake'); setTimeout(()=>playSound('glitch'), 0); setTimeout(()=>playSound('glitch'), 200); setTimeout(()=>playSound('slam'), 1000); return 2500}, function sceneFireworks(){ clearStage(); for (let i=0; i < 6; i++){ setTimeout(()=>{ playSound('explosion'); const wrap=document.createElement('div'); wrap.innerHTML=SVGS.burst; const burst=wrap.firstElementChild; burst.style.left=(Math.random() * 80) + 'vw'; burst.style.top=(Math.random() * 80) + 'vh'; burst.style.setProperty('--color', getRandomNeon()); stage.appendChild(burst)}, i * 200)} return 2000}, function sceneLanterns(){ clearStage(); const isGoingUp=Math.random() >0.5; for (let i=0; i < 12; i++){ setTimeout(()=>{ playSound('shoot'); const wrap=document.createElement('div'); wrap.innerHTML=SVGS.lantern; const lantern=wrap.firstElementChild; lantern.style.setProperty('--startX', `${Math.random() * 100}vw`); lantern.style.setProperty('--startY', isGoingUp ? '120vh' : '-20vh'); lantern.style.setProperty('--endX', `${Math.random() * 100}vw`); lantern.style.setProperty('--endY', isGoingUp ? '-20vh' : '120vh'); lantern.style.setProperty('--rot', `${(Math.random() * 60) - 30}deg`); lantern.style.setProperty('--color', getRandomNeon()); stage.appendChild(lantern)}, i * 100)} return 2000}, function sceneMosque(){ clearStage(); stage.innerHTML=SVGS.mosque; const color=getRandomNeon(); stage.firstElementChild.style.stroke=color; stage.firstElementChild.style.setProperty('--color', color); playSound('sweep'); return 3000} ]; //===ENGINE LOGIC===let availableTexts=getTexts(FRIEND_GENDER); let availableGraphics=[...graphicScenes].sort(()=>Math.random() - 0.5); let isTextNext=true; function startExperience(){ // Stop generating green lines clearInterval(lineInterval); makefullscreen(); // 2. Hide Glitch Screen & Start document.getElementById('start-screen').style.display='none'; document.title="Eid Mubarak! ✨"; // Unlock Audio & TTS initAudio(); playSound('glitch'); if ('speechSynthesis' in window){ // Silent utterance to unlock iOS speech synthesis on first tap window.speechSynthesis.speak(new SpeechSynthesisUtterance(''))} setTimeout(playNextScene, 500)} function playNextScene(){ if (availableTexts.length===0 && isTextNext){ showEndBanner(); return} let duration; if (isTextNext){ const words=availableTexts.shift(); duration=sceneText(words)} else{ if (availableGraphics.length===0) availableGraphics=[...graphicScenes].sort(()=>Math.random() - 0.5); const graphicFunction=availableGraphics.shift(); duration=graphicFunction()} isTextNext=!isTextNext; setTimeout(playNextScene, duration)} //===THE FINALE GRAPHICAL BANNER===function showEndBanner(){ clearStage(); playSound('sweep'); const banner=document.getElementById('end-banner'); const box=document.getElementById('banner-box'); banner.style.display='flex'; for (let i=0; i < 30; i++){ let star=document.createElement('div'); star.className='gold-star'; star.style.left=Math.random() * 100 + 'vw'; star.style.top=(Math.random() * -100) + 'vh'; star.style.animationDuration=(Math.random() * 3 + 2) + 's'; banner.appendChild(star)} setTimeout(()=>{ banner.style.opacity='1'; box.style.transform='scale(1)'}, 100)} function acceptInvite(){ if (document.exitFullscreen) document.exitFullscreen(); else if (document.webkitExitFullscreen) document.webkitExitFullscreen(); alert("Awesome! See you soon. Eid Mubarak! 🌙")} </script></body></html>
