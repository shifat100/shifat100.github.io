<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Doc Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: sans-serif;
      margin: 0;
      display: flex;
      flex-direction: row;
      background: #f4f4f4;
    }
    #sidebar {
      width: 240px;
      background: #1a73e8;
      color: white;
      padding: 15px;
      height: 100vh;
      overflow-y: auto;
    }
    #sidebar h2, #doc-select-container { /* Changed #doc-select to #doc-select-container for styling */
      margin-top: 0;
      margin-bottom: 10px;
    }
    #sidebar ul {
      list-style: none;
      padding: 0;
    }
    #sidebar li {
      margin: 8px 0;
      cursor: pointer;
      padding: 6px;
    }
    #sidebar li:hover,
    #sidebar li.active {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }
    #doc-container {
      flex: 1;
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }
    h1 { color: #333; }
    .step {
      background: #fff;
      padding: 15px;
      margin: 15px 0;
      border-left: 4px solid #2196F3;
      position: relative;
    }
    .step h2 {
      margin-top: 0;
    }
    pre {
      background: #eee;
      padding: 10px;
      overflow-x: auto;
      position: relative;
    }
    .copy-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #2196F3;
      color: white;
      border: none;
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }
    .nav-buttons button {
      background: #1a73e8;
      color: white;
      border: none;
      padding: 10px 15px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
    }
    .nav-buttons button:disabled {
      background: #ccc;
      cursor: default;
    }

    /* Custom Select Box Styles */
    #doc-select-container {
      position: relative;
      margin-bottom: 15px; /* Added some margin */
    }
    #doc-select {
      appearance: none; /* Remove default arrow */
      -webkit-appearance: none;
      -moz-appearance: none;
      background-color: white;
      border: 1px solid #ccc;
      padding: 8px 30px 8px 10px; /* Space for custom arrow */
      font-size: 14px;
      border-radius: 4px;
      width: 100%;
      cursor: pointer;
      color: #333; /* Text color for select */
    }
    /* Custom arrow using pseudo-element */
    #doc-select-container::after {
      content: '▼';
      font-size: 12px;
      color: #555;
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none; /* So it doesn't interfere with select click */
    }


    @media (max-width: 768px) {
      body { flex-direction: column; }
      #sidebar { width: 100%; height: auto; }
       #doc-container {
     width: 100%; word-warp: break-word; word-break: keep-all;
    }
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>Docs</h2>
    <!-- Container for custom select styling -->
    <div id="doc-select-container">
      <select id="doc-select"></select>
    </div>
    <ul id="step-list"></ul>
  </div>

  <div id="doc-container">
    <h1 id="doc-title"></h1>
    <div id="step-content"></div>
    <div class="nav-buttons">
      <button id="prev-btn">← Previous</button>
      <button id="next-btn">Next →</button>
    </div>
  </div>

  <script>
    /*
Here's how it works:
When the page loads, it first populates the <select> dropdown with all available documents.
Then, it checks for a docfile parameter in the URL (e.g., yourpage.html?docfile=ebook-crafter-kaios).
If a valid docfile parameter is found (meaning it matches one of the file names in your docs array), that document will be loaded and the dropdown will be set to it.
If the docfile parameter is missing, invalid, or blank, it will default to loading the first document in the docs array.*/
    
    const docs = [
      { name: "Ebook Crafter Kaios", file: "ebook-crafter-kaios.json" }
    ];

    const stepsPerPage = 10;
    var currentDoc = null;
    var currentPage = 0;

    const docSelect = document.getElementById('doc-select');
    const stepList = document.getElementById('step-list');
    const stepContent = document.getElementById('step-content');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const docTitle = document.getElementById('doc-title');

    // --- Populating select options ---
    docs.forEach(doc => {
      const opt = document.createElement("option");
      opt.value = doc.file;
      opt.textContent = doc.name;
      docSelect.appendChild(opt);
    });

    docSelect.onchange = () => {
      loadDoc(docSelect.value);
      // Optional: Update URL when user changes selection
      // const newUrl = `${window.location.pathname}?docfile=${docSelect.value}`;
      // window.history.pushState({path:newUrl}, '', newUrl);
    };

    prevBtn.onclick = () => {
      if (currentPage > 0) {
        currentPage--;
        renderSteps();
      }
    };

    nextBtn.onclick = () => {
      if ((currentPage + 1) * stepsPerPage < currentDoc.steps.length) {
        currentPage++;
        renderSteps();
      }
    };

    function loadDoc(file) {
      

      const xhr = new XMLHttpRequest();
      xhr.open('GET', file, true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            try {
                const jsonData = JSON.parse(xhr.responseText);
                processDocData(jsonData);
            } catch (e) {
                console.error("Error parsing JSON from file:", file, e);
                alert("Error loading document: Invalid JSON format.");
                // Fallback to a default or clear state
                if (docs.length > 0 && file !== docs[0].file) { // Avoid infinite loop if first doc is also bad
                    docSelect.value = docs[0].file;
                    loadDoc(docs[0].file);
                } else {
                    docTitle.textContent = "Error Loading Document";
                    stepContent.innerHTML = "<p>Could not load the selected document. It might be missing or corrupted.</p>";
                    stepList.innerHTML = "";
                    updateNavButtons();
                }
            }
          } else {
            console.error("Error loading file:", file, "Status:", xhr.status);
            alert(`Error loading document: ${file} (Status: ${xhr.status}). Check if the file exists and is accessible.`);
            // Fallback to a default or clear state
            if (docs.length > 0 && file !== docs[0].file) { // Avoid infinite loop if first doc is also bad
                docSelect.value = docs[0].file;
                loadDoc(docs[0].file);
            } else {
                docTitle.textContent = "Error Loading Document";
                stepContent.innerHTML = `<p>Could not load the document: ${file}. Please check the console for more details.</p>`;
                stepList.innerHTML = "";
                updateNavButtons();
            }
          }
        }
      };
      xhr.onerror = function () {
          console.error("Network error or file not found for:", file);
          alert(`Failed to load ${file}. Please check your network connection or if the file exists at the specified path.`);
           if (docs.length > 0 && file !== docs[0].file) {
                docSelect.value = docs[0].file;
                loadDoc(docs[0].file);
            } else {
                docTitle.textContent = "Error Loading Document";
                stepContent.innerHTML = `<p>Could not load the document: ${file} due to a network error or file not found.</p>`;
                stepList.innerHTML = "";
                updateNavButtons();
            }
      };
      xhr.send();
    }

    // Helper function to process document data once fetched/parsed
    function processDocData(data) {
        currentDoc = data;
        currentPage = 0;
        docTitle.textContent = currentDoc.title || "Untitled Document";
        renderSidebar();
        renderSteps();
    }

    // Dummy fileExists check for local testing without a server
    // In a real server environment, a 404 would be handled by xhr.status
    function fileExists(filename) {
        // This is a very basic check and won't work reliably for all scenarios,
        // especially without a server. For this example, we'll assume files
        // might not exist and rely on the dummy data fallback in loadDoc.
        // If you are running this with a local server, the XHR 404 will be the primary check.
        return false; // Set to true if you have the files locally and want to skip dummy data.
    }


    function renderSidebar() {
      stepList.innerHTML = '';
      if (!currentDoc || !currentDoc.steps) {
        console.warn("Cannot render sidebar: currentDoc or currentDoc.steps is undefined.");
        return;
      }
      const pages = Math.ceil(currentDoc.steps.length / stepsPerPage);
      for (var i = 0; i < pages; i++) {
        const li = document.createElement("li");
        li.textContent = `Page ${i + 1}`;
        li.onclick = (function(pageIndex) { // Use a closure to capture 'i'
          return function() {
            currentPage = pageIndex;
            renderSteps();
          };
        })(i);
        stepList.appendChild(li); // Append first
      }
      updateActiveSidebarPage();
    }

    function updateActiveSidebarPage() {
        const listItems = stepList.getElementsByTagName("li");
        for (var j = 0; j < listItems.length; j++) {
            listItems[j].classList.toggle("active", j === currentPage);
        }
    }


    function renderSteps() {
      stepContent.innerHTML = '';
      if (!currentDoc || !currentDoc.steps) {
        console.warn("Cannot render steps: currentDoc or currentDoc.steps is undefined.");
        stepContent.innerHTML = "<p>No steps to display for this document.</p>";
        updateNavButtons();
        updateActiveSidebarPage(); // Ensure sidebar active state is correct
        return;
      }
      const start = currentPage * stepsPerPage;
      const end = Math.min(start + stepsPerPage, currentDoc.steps.length);

      if (currentDoc.steps.length === 0) {
        stepContent.innerHTML = "<p>This document has no steps.</p>";
      } else {
        for (var i = start; i < end; i++) {
          const step = currentDoc.steps[i];
          if (!step) continue; // Skip if a step is undefined/null

          const div = document.createElement("div");
          div.className = "step";

          if (step.title) {
            const h2 = document.createElement("h2");
            h2.innerHTML = step.title;
            div.appendChild(h2);
          }

          if (step.description) {
            const p = document.createElement("p");
            p.innerHTML = step.description; // Using textContent for safety
            div.appendChild(p);
          }

          if (step.code) {
            const pre = document.createElement("pre");
            const code = document.createElement("code");
            code.textContent = step.code;
            pre.appendChild(code);

            const btn = document.createElement("button");
            btn.className = "copy-btn";
            btn.textContent = "Copy";

            btn.onclick = (function(codeToCopy) { // Closure to capture step.code
              return function() {
                const currentButton = this; // 'this' refers to the button clicked
                if (navigator.clipboard && navigator.clipboard.writeText) {
                  navigator.clipboard.writeText(codeToCopy).then(() => {
                    currentButton.textContent = "Copied!";
                    setTimeout(() => currentButton.textContent = "Copy", 1500);
                  }).catch(err => {
                    console.error('Failed to copy with Clipboard API: ', err);
                    fallbackCopyTextToClipboard(codeToCopy, currentButton);
                  });
                } else {
                  fallbackCopyTextToClipboard(codeToCopy, currentButton);
                }
              };
            })(step.code);

            pre.appendChild(btn);
            div.appendChild(pre);
          }
          stepContent.appendChild(div);
        }
      }
      // renderSidebar(); // Called from loadDoc and after page change, not needed inside renderSteps directly
      updateActiveSidebarPage(); // Update active page in sidebar
      updateNavButtons();
    }

    function fallbackCopyTextToClipboard(text, buttonElement) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed"; // Prevent scrolling to bottom of page
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      try {
        document.execCommand("copy");
        if (buttonElement) {
            buttonElement.textContent = "Copied!";
            setTimeout(() => buttonElement.textContent = "Copy", 1500);
        }
      } catch (err) {
        alert("Copy failed. Please copy manually.");
        console.error("Fallback copy failed: ", err);
      }
      document.body.removeChild(textarea);
    }

    function updateNavButtons() {
      if (!currentDoc || !currentDoc.steps) {
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        return;
      }
      prevBtn.disabled = currentPage === 0;
      nextBtn.disabled = (currentPage + 1) * stepsPerPage >= currentDoc.steps.length;
    }

    // --- Initial Load Logic ---
    function initializeApp() {
      const urlParams = new URLSearchParams(window.location.search);
      const docFileFromUrl = urlParams.get('docfile')+'.json';
      var fileToLoad = null;

      if (docFileFromUrl) {
        // Check if the file from URL exists in our docs array
        const foundDoc = docs.find(doc => doc.file === docFileFromUrl);
        if (foundDoc) {
          fileToLoad = docFileFromUrl;
        } else {
          console.warn(`Document file "${docFileFromUrl}" from URL not found in configuration. Loading default.`);
        }
      }

      // If no valid file from URL, or URL param not present, load the first doc
      if (!fileToLoad && docs.length > 0) {
        fileToLoad = docs[0].file;
      }

      if (fileToLoad) {
        docSelect.value = fileToLoad; // Set dropdown to the selected file
        loadDoc(fileToLoad);
      } else {
        console.error("No documents configured or found to load.");
        docTitle.textContent = "No Documents Available";
        stepContent.innerHTML = "<p>Please configure documents to view.</p>";
        updateNavButtons();
      }
    }

    // Call initialization function when the DOM is ready
    // (though for scripts at the end of body, it's usually fine directly)
    document.addEventListener('DOMContentLoaded', initializeApp);

  </script>
</body>
</html>
