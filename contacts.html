<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Manager</title>
    <style>
        /* Light Theme (default) & Dark Theme Variables */
        :root {
            --primary-color: #6200EE;
            --secondary-color: #03DAC6;
            --on-primary-color: #FFFFFF;
            --on-secondary-color: #000000;
            --background-color: #F5F5F5;
            --surface-color: #FFFFFF;
            --surface-hover-color: #EEEEEE;
            --on-surface-color: #000000;
            --on-surface-variant-color: #5f6368;
            --error-color: #B00020;
            --shadow-color: rgba(0, 0, 0, 0.2);
            --hover-overlay-color: rgba(0, 0, 0, 0.08);
            --input-background-color: #E8E8E8;
            --border-color: #DADCE0;
        }

        html[data-theme='dark'] {
            --primary-color: #BB86FC;
            --secondary-color: #03DAC6;
            --on-primary-color: #000000;
            --on-secondary-color: #000000;
            --background-color: #121212;
            --surface-color: #1E1E1E;
            --surface-hover-color: #2C2C2C;
            --on-surface-color: #FFFFFF;
            --on-surface-variant-color: #B0B0B0;
            --error-color: #CF6679;
            --shadow-color: rgba(0, 0, 0, 0.7);
            --hover-overlay-color: rgba(255, 255, 255, 0.08);
            --input-background-color: #333333;
            --border-color: #3c4043;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--on-surface-color);
            line-height: 1.5;
            transition: background-color 0.2s, color 0.2s;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* App Bar */
        .app-bar {
            background-color: var(--surface-color);
            color: var(--on-surface-color);
            padding: 1rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 4px var(--shadow-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-bar-title {
            font-size: 1.5rem;
            font-weight: 500;
        }

        .app-bar-actions .menu-btn {
            background: none;
            border: none;
            color: var(--on-surface-variant-color);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
        }
         .app-bar-actions .menu-btn:hover {
            background-color: var(--hover-overlay-color);
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 1.5rem;
            top: 4rem;
            background-color: var(--surface-color);
            border-radius: 4px;
            box-shadow: 0 2px 10px var(--shadow-color);
            overflow: hidden;
            z-index: 101;
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-item {
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .dropdown-item:hover {
            background-color: var(--primary-color);
            color: var(--on-primary-color);
        }

        main {
            padding: 1.5rem;
        }

        /* Filter Controls */
        .filter-controls {
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--input-background-color);
            color: var(--on-surface-color);
            font-size: 1rem;
        }
        
        #category-filter {
             max-width: 250px;
        }
        
        .category-manage-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--on-surface-variant-color);
            cursor: pointer;
            padding: 0.75rem;
            border-radius: 4px;
            white-space: nowrap;
        }
         .category-manage-btn:hover {
             background-color: var(--hover-overlay-color);
         }


        /* Contact List */
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .contact-card {
            background-color: var(--surface-color);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: background-color 0.2s;
        }
        
        .contact-card:hover {
            background-color: var(--surface-hover-color);
        }

        .contact-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--on-primary-color);
            text-transform: uppercase;
        }

        .contact-info {
            flex-grow: 1;
        }

        .contact-info h3 {
            font-size: 1.1rem;
            font-weight: 500;
        }

        .contact-info p {
            color: var(--on-surface-variant-color);
        }

        .contact-actions {
            display: flex;
            gap: 0.5rem;
        }
        
        .btn-icon {
            background: none;
            border: none;
            color: var(--on-surface-variant-color);
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }
        
        .btn-icon:hover {
            background-color: var(--hover-overlay-color);
            color: var(--on-surface-color);
        }

        /* FAB */
        .fab-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 100;
        }

        .fab {
            background-color: var(--secondary-color);
            color: var(--on-secondary-color);
            border: none;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            box-shadow: 0 4px 8px var(--shadow-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .fab:hover {
            transform: scale(1.05);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background-color: var(--surface-color);
            padding: 1.5rem;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 20px var(--shadow-color);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .modal-header h2 {
            font-size: 1.25rem;
        }

        .close-btn {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--on-surface-variant-color);
        }
        
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        
        .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
        }
        .btn-primary {
             background-color: var(--primary-color);
             color: var(--on-primary-color);
        }
        
        #category-management-list li {
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
        }

    </style>
</head>
<body>

    <header class="app-bar">
        <h1 class="app-bar-title">Contacts</h1>
        <div class="app-bar-actions">
            <button class="menu-btn" id="menu-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
                  <path d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/>
                </svg>
            </button>
            <div id="dropdown-menu" class="dropdown-menu">
                <div class="dropdown-item" id="toggle-theme-btn">Toggle Theme</div>
                <div class="dropdown-item" id="export-vcf-btn">Export Contacts (.vcf)</div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="filter-controls">
            <div class="form-group" style="flex-grow:1; margin-bottom: 0;">
                 <select id="category-filter" aria-label="Filter by category"></select>
            </div>
             <button id="manage-categories-btn" class="category-manage-btn">Manage Categories</button>
        </div>
        <div id="contact-list" class="contact-list">
           <!-- Contacts will be populated by JS -->
        </div>
    </main>

    <div class="fab-container">
        <button id="add-fab" class="fab">+</button>
    </div>

    <!-- Contact Modal -->
    <div id="contact-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="contact-modal-title">Add New Contact</h2>
                <span class="close-btn" id="close-contact-modal">&times;</span>
            </div>
            <form id="contact-form">
                <div class="form-group">
                    <label for="contact-name">Name</label>
                    <input type="text" id="contact-name" required>
                </div>
                <div class="form-group">
                    <label for="contact-phone">Phone Number</label>
                    <input type="tel" id="contact-phone" required>
                </div>
                <div class="form-group">
                    <label for="contact-category">Category</label>
                    <select id="contact-category" required></select>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Category Management Modal -->
    <div id="category-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Manage Categories</h2>
                 <span class="close-btn" id="close-category-modal">&times;</span>
            </div>
            <ul id="category-management-list"></ul>
            <form id="category-form" style="margin-top: 1.5rem; display: flex; gap: 1rem;">
                <input type="text" id="category-name" placeholder="New category name" required>
                <button type="submit" class="btn btn-primary">Add</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const DB_NAME = 'ContactManagerDB_V2';
            const DB_VERSION = 1;
            let db;

            // --- DATABASE INITIALIZATION ---
            function initDB() {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = (e) => console.error('Database error:', e.target.errorCode);
                request.onsuccess = (e) => {
                    db = e.target.result;
                    renderCategories();
                    renderContacts();
                };
                request.onupgradeneeded = (e) => {
                    let db = e.target.result;
                    db.createObjectStore('categories', { keyPath: 'id', autoIncrement: true });
                    const contactStore = db.createObjectStore('contacts', { keyPath: 'id', autoIncrement: true });
                    contactStore.createIndex('categoryId', 'categoryId', { unique: false });
                };
            }

            // --- UI ELEMENTS ---
            const contactList = document.getElementById('contact-list');
            const categoryFilter = document.getElementById('category-filter');
            const contactModal = document.getElementById('contact-modal');
            const categoryModal = document.getElementById('category-modal');
            const contactForm = document.getElementById('contact-form');
            const categoryForm = document.getElementById('category-form');
            const dropdownMenu = document.getElementById('dropdown-menu');

            // --- EVENT LISTENERS ---
            document.getElementById('add-fab').addEventListener('click', openAddContactModal);
            document.getElementById('manage-categories-btn').addEventListener('click', openCategoryManager);
            document.getElementById('close-contact-modal').addEventListener('click', () => contactModal.classList.remove('show'));
            document.getElementById('close-category-modal').addEventListener('click', () => categoryModal.classList.remove('show'));
            categoryForm.addEventListener('submit', handleCategoryAdd);
            contactForm.addEventListener('submit', handleContactSubmit);
            categoryFilter.addEventListener('change', () => renderContacts(categoryFilter.value === 'all' ? null : Number(categoryFilter.value)));
            
            // Menu dropdown
            document.getElementById('menu-btn').addEventListener('click', () => dropdownMenu.classList.toggle('show'));
            window.addEventListener('click', (e) => {
                if (!e.target.matches('.menu-btn, .menu-btn *')) {
                    if (dropdownMenu.classList.contains('show')) {
                        dropdownMenu.classList.remove('show');
                    }
                }
                if (e.target == contactModal) contactModal.classList.remove('show');
                if (e.target == categoryModal) categoryModal.classList.remove('show');
            });

            // Export listener
            document.getElementById('export-vcf-btn').addEventListener('click', exportToVCF);
            
            // --- THEME SWITCHER ---
            const themeToggleBtn = document.getElementById('toggle-theme-btn');

            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
            }

            function toggleTheme() {
                const currentTheme = localStorage.getItem('theme') || 'dark';
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                applyTheme(newTheme);
            }

            function loadTheme() {
                const savedTheme = localStorage.getItem('theme');
                applyTheme(savedTheme || 'dark');
            }

            themeToggleBtn.addEventListener('click', toggleTheme);


            // --- CATEGORY FUNCTIONS ---
            function renderCategories() {
                const tx = db.transaction(['categories'], 'readonly');
                const store = tx.objectStore('categories');
                const request = store.getAll();

                request.onsuccess = () => {
                    const categories = request.result;
                    categoryFilter.innerHTML = `<option value="all">All Contacts</option>`;
                    categories.forEach(cat => {
                        categoryFilter.innerHTML += `<option value="${cat.id}">${cat.name}</option>`;
                    });
                    populateContactCategoryDropdown(categories);
                    renderCategoryManager(categories);
                };
            }

            function openCategoryManager() {
                categoryModal.classList.add('show');
            }
            
            function renderCategoryManager(categories) {
                const list = document.getElementById('category-management-list');
                list.innerHTML = '';
                 categories.forEach(cat => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <span>${cat.name}</span>
                        <button class="btn-icon delete-category-btn" data-id="${cat.id}" title="Delete Category">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/><path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/></svg>
                        </button>
                    `;
                    list.appendChild(li);
                });
                document.querySelectorAll('.delete-category-btn').forEach(btn => btn.addEventListener('click', deleteCategory));
            }

            function handleCategoryAdd(event) {
                event.preventDefault();
                const nameInput = document.getElementById('category-name');
                const name = nameInput.value.trim();
                if (!name) return;

                const tx = db.transaction(['categories'], 'readwrite');
                const request = tx.objectStore('categories').add({ name });

                request.onsuccess = () => {
                    nameInput.value = '';
                    renderCategories();
                };
            }

            function deleteCategory(e) {
                const id = Number(e.currentTarget.dataset.id);
                if (confirm('Are you sure? This will also delete all contacts in this category.')) {
                    const catTx = db.transaction(['categories', 'contacts'], 'readwrite');
                    catTx.objectStore('categories').delete(id);
                    const contactStore = catTx.objectStore('contacts');
                    const index = contactStore.index('categoryId');
                    const request = index.openCursor(IDBKeyRange.only(id));
                    request.onsuccess = (event) => {
                        const cursor = event.target.result;
                        if (cursor) {
                            contactStore.delete(cursor.primaryKey);
                            cursor.continue();
                        }
                    };
                    catTx.oncomplete = () => {
                         renderCategories();
                         renderContacts();
                    }
                }
            }

            // --- CONTACT FUNCTIONS ---
            function renderContacts(categoryId = null) {
                contactList.innerHTML = '';
                const store = db.transaction(['contacts'], 'readonly').objectStore('contacts');
                const request = categoryId ? store.index('categoryId').getAll(categoryId) : store.getAll();

                request.onsuccess = () => {
                    const contacts = request.result;
                    if (contacts.length === 0) {
                        contactList.innerHTML = '<p style="text-align:center; color: var(--on-surface-variant-color);">No contacts found.</p>';
                        return;
                    }
                    contacts.forEach(contact => {
                        const card = document.createElement('div');
                        card.className = 'contact-card';
                        const avatarInitial = contact.name ? contact.name[0] : '?';
                        card.innerHTML = `
                            <div class="contact-avatar">${avatarInitial}</div>
                            <div class="contact-info">
                                <h3>${contact.name}</h3>
                                <p>${contact.phone}</p>
                            </div>
                            <div class="contact-actions">
                                <a href="tel:${contact.phone}" class="btn-icon" title="Call">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M3.654 1.328a.678.678 0 0 0-1.015-.063L1.605 2.3c-.483.484-.661 1.169-.45 1.77a17.568 17.568 0 0 0 4.168 6.608 17.569 17.569 0 0 0 6.608 4.168c.601.211 1.286.033 1.77-.45l1.034-1.034a.678.678 0 0 0-.063-1.015l-2.307-1.794a.678.678 0 0 0-.58-.122l-2.19.547a1.745 1.745 0 0 1-1.657-.459L5.482 8.062a1.745 1.745 0 0 1-.46-1.657l.548-2.19a.678.678 0 0 0-.122-.58L3.654 1.328zM1.884.511a1.745 1.745 0 0 1 2.612.163L6.29 2.98c.329.423.445.974.28 1.465l-.547 2.19a.678.678 0 0 0 .178.643l2.457 2.457a.678.678 0 0 0 .644.178l2.189-.547a1.745 1.745 0 0 1 1.465.28l2.306 1.794c.829.645.905 1.87.163 2.611l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.634 18.634 0 0 1-7.01-4.42 18.634 18.634 0 0 1-4.42-7.009c-.363-1.03-.038-2.137.703-2.877L1.885.511z"/></svg>
                                </a>
                                <button class="btn-icon delete-contact-btn" data-id="${contact.id}" title="Delete">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/><path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/></svg>
                                </button>
                            </div>
                        `;
                        contactList.appendChild(card);
                    });
                    document.querySelectorAll('.delete-contact-btn').forEach(btn => btn.addEventListener('click', deleteContact));
                };
            }

            function openAddContactModal() {
                contactForm.reset();
                contactModal.classList.add('show');
            }
            
            function populateContactCategoryDropdown(categories) {
                const select = document.getElementById('contact-category');
                select.innerHTML = '';
                if (categories.length === 0) {
                    select.innerHTML = '<option value="" disabled>Please add a category first</option>';
                } else {
                    categories.forEach(cat => {
                        select.innerHTML += `<option value="${cat.id}">${cat.name}</option>`;
                    });
                }
            }

            function handleContactSubmit(event) {
                event.preventDefault();
                const contact = {
                    name: document.getElementById('contact-name').value,
                    phone: document.getElementById('contact-phone').value,
                    categoryId: Number(document.getElementById('contact-category').value)
                };
                if (isNaN(contact.categoryId) || !contact.categoryId) {
                    alert('Please select a valid category.');
                    return;
                }
                const tx = db.transaction(['contacts'], 'readwrite');
                tx.objectStore('contacts').add(contact);
                tx.oncomplete = () => {
                    renderContacts(categoryFilter.value === 'all' ? null : Number(categoryFilter.value));
                    contactModal.classList.remove('show');
                };
            }
            
            function deleteContact(e) {
                const id = Number(e.currentTarget.dataset.id);
                if (confirm('Are you sure you want to delete this contact?')) {
                     const tx = db.transaction(['contacts'], 'readwrite');
                     tx.objectStore('contacts').delete(id);
                     tx.oncomplete = () => renderContacts(categoryFilter.value === 'all' ? null : Number(categoryFilter.value));
                }
            }

            // --- EXPORT FUNCTION ---
            function exportToVCF() {
                const store = db.transaction('contacts', 'readonly').objectStore('contacts');
                const request = store.getAll();

                request.onsuccess = () => {
                    const contacts = request.result;
                    if (contacts.length === 0) {
                        alert('No contacts to export.');
                        return;
                    }

                    let vcfContent = '';
                    contacts.forEach(contact => {
                        vcfContent += 'BEGIN:VCARD\r\n';
                        vcfContent += 'VERSION:3.0\r\n';
                        vcfContent += `FN:${contact.name}\r\n`;
                        vcfContent += `TEL;TYPE=CELL:${contact.phone}\r\n`;
                        vcfContent += 'END:VCARD\r\n';
                    });

                    const blob = new Blob([vcfContent], { type: 'text/vcard;charset=utf-8' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = 'contacts.vcf';
                    link.style.display = 'none';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(link.href);
                };
                 request.onerror = (e) => console.error("Error fetching contacts for export:", e);
            }
            
            // --- INITIALIZE ---
            loadTheme();
            initDB();
        });
    </script>
</body>
</html>
